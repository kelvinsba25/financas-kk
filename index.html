<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;background:#060D08;color:#E2F0E8;-webkit-font-smoothing:antialiased}
:root{
  --bg0:#060D08;--bg1:#0C1610;--bg2:#111F15;--bg3:#172A1B;--bg4:#1D3422;
  --border:#1F3826;--text:#E2F0E8;--muted:#7AAB82;--faint:#0F1C12;
  --mint:#4ECCA3;--mint2:#2EBD8A;--mintbg:rgba(78,204,163,.12);--mintbd:rgba(78,204,163,.25);
  --red:#F06B6B;--redbg:rgba(240,107,107,.10);--redbd:rgba(240,107,107,.25);
  --gold:#F5C842;--goldbg:rgba(245,200,66,.10);--goldbd:rgba(245,200,66,.25);
  --blue:#5B9CF8;--pink:#F07DB0;--purple:#A87EF8;--orange:#F0883C;
  --r:12px;--r2:18px;--touch:48px;
}
#app{display:flex;height:100dvh;overflow:hidden}
#sidebar{width:220px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
@media(max-width:767px){#sidebar{display:none}}
.sb-top{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-logo{font-size:18px;font-weight:900;letter-spacing:-.5px}
.sb-logo em{color:var(--mint);font-style:normal}
.sb-sync{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px}
.sb-sec{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 16px 5px}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;border:none;background:none;color:var(--muted);font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;text-align:left;transition:.15s;font-weight:600;border-left:3px solid transparent;min-height:var(--touch)}
.sb-nav-item:hover{background:var(--bg3);color:var(--text)}
.sb-nav-item.active{background:var(--mintbg);color:var(--mint);border-left-color:var(--mint)}
.sb-nav-item .ico{width:20px;text-align:center;font-size:16px;flex-shrink:0}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg2)}
#topbar{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg1);gap:10px;min-height:56px}
.tb-title{font-size:16px;font-weight:900;letter-spacing:-.3px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{height:40px;padding:0 14px;border-radius:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap;min-width:40px;justify-content:center}
.tb-btn:active{opacity:.7}
.tb-btn.pri{background:var(--mint);color:#060D08}
.tb-btn.ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
#monthnav{display:flex;align-items:center;padding:8px 12px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);gap:8px;overflow-x:auto;scrollbar-width:none;min-height:50px}
#monthnav::-webkit-scrollbar{display:none}
.mn-yr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mn-yr-btn{width:32px;height:32px;border:none;border-radius:8px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.mn-yr-lbl{font-size:14px;font-weight:800;color:var(--text);min-width:42px;text-align:center}
.mn-months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.mn-months::-webkit-scrollbar{display:none}
.mn-m{padding:7px 13px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:none;color:var(--muted);transition:.15s;white-space:nowrap;font-family:'Nunito',sans-serif;min-height:34px}
.mn-m.active{background:var(--mint);color:#060D08}
.mn-m:hover:not(.active){background:var(--bg4);color:var(--text)}
#mobtabs{display:none;background:var(--bg1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;padding:8px 12px;gap:6px}
#mobtabs::-webkit-scrollbar{display:none}
@media(max-width:767px){#mobtabs{display:flex}}
.mt-tab{padding:8px 14px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:none;color:var(--muted);white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s;min-height:36px}
.mt-tab.active{background:var(--mintbg);color:var(--mint)}
#content{flex:1;overflow-y:auto;padding:14px 14px 100px}
@media(min-width:768px){#content{padding:18px 22px 50px}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#botnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--border);z-index:100;padding:6px 4px env(safe-area-inset-bottom)}
@media(max-width:767px){#botnav{display:flex}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;font-family:'Nunito',sans-serif;font-weight:700;transition:.15s;min-height:var(--touch)}
.bn-item.active{color:var(--mint)}
.bn-ico{font-size:22px;line-height:1}
.card{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:16px;margin-bottom:12px}
.card-sm{background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);padding:13px 14px;margin-bottom:8px}
.card-in{background:var(--bg4);border-radius:10px;padding:12px 14px;margin-bottom:7px}
.sec{font-size:10px;font-weight:800;color:var(--mint2);text-transform:uppercase;letter-spacing:1px;margin:18px 0 9px}
.dre{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.dre-hdr{background:linear-gradient(135deg,#0A2218,#071510);padding:16px;border-bottom:1px solid var(--border)}
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);min-height:52px;gap:10px}
.dre-row:last-child{border-bottom:none}
.dre-row.tot{background:var(--bg4);padding:14px 16px}
.dre-sub{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 13px 16px;border-bottom:1px solid var(--faint);min-height:52px;gap:10px;background:var(--faint)}
.dre-sub:last-child{border-bottom:none}
.dre-lbl{font-size:13px;color:var(--muted);font-weight:600}
.dre-lbl.h{font-size:14px;color:var(--text);font-weight:700}
.dre-lbl.s{font-size:13px;color:var(--muted)}
.dre-val{font-size:14px;font-weight:800;flex-shrink:0}
.pos{color:var(--mint)}.neg{color:var(--red)}.neu{color:var(--text)}
.big{font-size:22px;font-weight:900}
.chk-row{display:flex;align-items:center;gap:0;min-height:52px;padding:10px 16px 10px 16px;border-bottom:1px solid var(--faint);background:var(--faint)}
.chk-touch{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border-radius:9px}
.chk-touch input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint);cursor:pointer}
.chk-touch:active{background:rgba(78,204,163,.1)}
.chk-txt{flex:1;font-size:13px;color:var(--muted);font-weight:600;min-width:0;padding:0 4px}
.chk-amt{font-size:14px;font-weight:800;flex-shrink:0;padding-left:8px}
.pbar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:5px 0}
.pbar-fill{height:6px;border-radius:3px;transition:width .5s}
.input{background:var(--bg0);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 13px;font-size:15px;width:100%;font-family:'Nunito',sans-serif;outline:none;transition:.15s;min-height:48px}
.input:focus{border-color:var(--mintbd);box-shadow:0 0 0 3px rgba(78,204,163,.07)}
.input option{background:var(--bg1)}
.lbl{font-size:11px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}
textarea.input{resize:vertical;min-height:80px}
.btn{border:none;border-radius:11px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;transition:.12s;text-align:center;min-height:var(--touch)}
.btn:active{opacity:.75}
.btn-pri{background:var(--mint);color:#060D08}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}
.fbrow{display:flex;gap:10px;margin-top:16px}
.type-toggle{display:flex;background:var(--bg0);border-radius:12px;padding:4px;border:1px solid var(--border)}
.type-opt{flex:1;padding:12px;border-radius:9px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.type-opt.saida-on{background:var(--red);color:#fff}
.type-opt.entrada-on{background:var(--mint);color:#060D08}
.type-opt.off{background:none;color:var(--muted)}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s;background:var(--bg4);color:var(--muted);min-height:40px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-mint{background:var(--mintbg);color:var(--mint);border:1px solid var(--mintbd)}
.b-red{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}
.b-gold{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbd)}
.b-blue{background:rgba(91,156,248,.1);color:var(--blue);border:1px solid rgba(91,156,248,.25)}
.b-muted{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}
.b-terceiro{background:rgba(168,126,248,.15);color:var(--purple);border:1px solid rgba(168,126,248,.3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(6px)}
.sheet{background:var(--bg1);border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:520px;max-height:93dvh;overflow-y:auto}
@media(min-width:768px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88dvh}}
.sh-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.sh-title{font-size:18px;font-weight:900;letter-spacing:-.3px}
.sh-sub{font-size:12px;color:var(--muted);margin-top:3px}
.xbtn{width:36px;height:36px;border:none;border-radius:9px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty-ico{font-size:48px;margin-bottom:12px}
.reminder{background:var(--goldbg);border:1px solid var(--goldbd);border-radius:12px;padding:13px 14px;margin-bottom:10px}
#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);color:var(--text);padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;z-index:999;pointer-events:none;border:1px solid var(--border);white-space:nowrap;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){#toast{bottom:24px}}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;transition:background .3s}
.sd-ok{background:var(--mint)}.sd-syncing{background:var(--gold);animation:blink .7s infinite}
.sd-err{background:var(--red)}.sd-local{background:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function fmtBRL(v){return(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fmtDate(d){if(!d)return"";try{return new Date((d instanceof Date?d:d+"T00:00:00")).toLocaleDateString("pt-BR")}catch{return d}}

function invoiceKey(cardId,cy,cm){return`${cardId}__${cy}-${String(cm+1).padStart(2,"0")}`}
function getCardDates(card,ds){
 const d=new Date(ds+"T00:00:00"),mk=monthKey(d.getFullYear(),d.getMonth());
 const ov=S.cardDateOverrides?.[card.id]?.[mk];
 return{closeDay:ov?.closeDay||card.closeDay,payDay:ov?.payDay||card.payDay};
}
function setBilling(card,ds){
 const{closeDay:cd,payDay:pd}=getCardDates(card,ds);
 const d=new Date(ds+"T00:00:00"),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
 let ps,pe;
 if(day<=cd){const pm=m===0?11:m-1,py=m===0?y-1:y;ps=new Date(py,pm,cd+1);pe=new Date(y,m,cd);}
 else{ps=new Date(y,m,cd+1);const nm=m===11?0:m+1,ny=m===11?y+1:y;pe=new Date(ny,nm,cd);}
 const payM=pe.getMonth()===11?0:pe.getMonth()+1,payY=pe.getMonth()===11?pe.getFullYear()+1:pe.getFullYear();
 return{start:ps,end:pe,payDate:new Date(payY,payM,pd)};
}
function getInvoicePayMonth(card,cy,cm){
 const fakeDate=new Date(cy,cm,card.closeDay+1);
 const b=setBilling(card,fakeDate.toISOString().slice(0,10));
 return{year:b.payDate.getFullYear(),month:b.payDate.getMonth()};
}

let DB=null;
function syncDot(st,lbl){
 const cls={ok:"sd-ok",syncing:"sd-syncing",err:"sd-err",local:"sd-local"}[st]||"sd-local";
 ["sync-dot","sync-dot-m"].forEach(id=>{const el=document.getElementById(id);if(el)el.className="sd "+cls;});
 ["sync-lbl"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lbl;});
}
function fbSet(path,data){if(!DB)return;syncDot("syncing","salvando...");DB.ref("kk/"+path).set(data).then(()=>syncDot("ok","sincronizado")).catch(()=>syncDot("err","erro ao salvar"));}
function fbDel(path){if(DB)DB.ref("kk/"+path).remove();}

function initFB(){
 try{
  const app=firebase.initializeApp(FB);
  DB=firebase.database(app);
  syncDot("syncing","conectando...");
  DB.ref("kk").on("value",snap=>{
   const d=snap.val();
   if(d){
    if(d.transactions)S.transactions=Object.values(d.transactions);else S.transactions=[];
    if(d.cards)S.cards=Object.values(d.cards);
    if(d.accounts)S.accounts=Object.values(d.accounts);
    if(d.goals)S.goals=d.goals;
    if(d.fixedAccounts)S.fixedAccounts=Object.values(d.fixedAccounts);
    if(d.fixedLogs)S.fixedLogs=d.fixedLogs;
    if(d.fixedSkips)S.fixedSkips=d.fixedSkips;
    if(d.balances)S.balances=d.balances;
    if(d.billedInvoices)S.billedInvoices=d.billedInvoices;
    if(d.monthStartBalance)S.monthStartBalance=d.monthStartBalance;
    if(d.cardDateOverrides)S.cardDateOverrides=d.cardDateOverrides;
    if(d.fixedPaid)S.fixedPaid=d.fixedPaid;
    if(d.apto)S.apto={...S.apto,...d.apto};
    if(d.customGroups)S.customGroups=Object.values(d.customGroups);
    if(d.establishments)S.establishments=Object.values(d.establishments);
    if(d.apto)S.apto={...S.apto,...d.apto};
   } else {
    DB.ref("kk").set({
     transactions:{},cards:Object.fromEntries(DEFAULT_CARDS.map(c=>[c.id,c])),
     accounts:Object.fromEntries(DEFAULT_ACCOUNTS.map(a=>[a.id,a])),
     fixedAccounts:Object.fromEntries(DEFAULT_FIXED.map(f=>[f.id,f])),
     fixedLogs:{},fixedSkips:{},fixedPaid:{},balances:{},billedInvoices:{},
     monthStartBalance:{},goals:{},customGroups:{},establishments:{},cardDateOverrides:{}
    });
   }
   S.loaded=true;syncDot("ok","sincronizado");render();
  },()=>{syncDot("err","erro Firebase");S.loaded=true;render();});
 }catch(e){syncDot("err","erro");S.loaded=true;render();}
}

 const mt=mTx(), mk=monthKey(S.filterYear,S.filterMonth);
 const today=new Date(); today.setHours(0,0,0,0);

 // ── Entradas ─────────────────────────────────────────────
 const entradas=mt.filter(t=>t.txType==="entrada");
 const totalEntradas=entradas.reduce((a,b)=>a+b.amount,0);
 const entByType={};
 entradas.forEach(t=>{const k=t.incomeType||"Outros";entByType[k]=(entByType[k]||0)+t.amount;});

 // ── Faturas a pagar NESTE MÊS ────────────────────────────
 // (invoices whose payMonth = current month)
 const invThisMonth=Object.values(S.billedInvoices).filter(i=>
  i.confirmed && i.payMonth===S.filterMonth && i.payYear===S.filterYear
 );
 // Auto-mark debitoAuto as paid when payDate passed
 invThisMonth.forEach(inv=>{
  const card=S.cards.find(c=>c.id===inv.cardId);
  if(card?.debitoAuto && !inv.paid){
   const pd=new Date(inv.paidDate+"T00:00:00");
   if(pd<=today){inv.paid=true; fbSet("billedInvoices/"+inv.key+"/paid",true);}
  }
 });
 const invPagas=invThisMonth.filter(i=>i.paid);
 const invPrev=invThisMonth.filter(i=>!i.paid);
 const totalInvPagas=invPagas.reduce((a,b)=>a+b.total,0);
 const totalInvPrev=invPrev.reduce((a,b)=>a+b.total,0);

 // ── Contas fixas ─────────────────────────────────────────
 const faAtivas=S.fixedAccounts.filter(fa=>fa.active!==false && !S.fixedSkips?.[fa.id]?.[mk]);
 const faLancadas=faAtivas.map(fa=>{const v=S.fixedLogs[fa.id]?.[mk]||0; const paid=S.fixedPaid?.[fa.id]?.[mk]||false; return v?{fa,v,paid}:null;}).filter(Boolean);
 const faPend=faAtivas.filter(fa=>!S.fixedLogs[fa.id]?.[mk]);
 const totalFaPagas=faLancadas.filter(f=>f.paid).reduce((a,b)=>a+b.v,0);
 const totalFaLanc=faLancadas.reduce((a,b)=>a+b.v,0);
 const totalFaPend=faPend.reduce((a,b)=>a+(b.valor||0),0);

 // ── Saídas diretas (não crédito, não fixas) ──────────────
 const fixaDescs=new Set(S.fixedAccounts.map(f=>f.desc));
 const sairasDir=mt.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito"&&!fixaDescs.has(t.desc));
 const totalDir=sairasDir.reduce((a,b)=>a+b.amount,0);
 const dirByGrp={};
 sairasDir.forEach(t=>{const g=getGroup(t.category); const k=g?g.l:"📦 Outros"; dirByGrp[k]=(dirByGrp[k]||0)+t.amount;});

 // ── Totals ────────────────────────────────────────────────
 const totalSaidasReal=totalInvPagas+totalFaLanc+totalDir;
 const totalPrevisto=totalInvPrev+totalFaPend;
 const resultado=totalEntradas-totalSaidasReal;
 const saldoInicial=S.monthStartBalance?.[mk]||Object.values(S.balances).reduce((s,b)=>s+(b.value||0),0);
 const saldoReal=saldoInicial+totalEntradas-totalSaidasReal;
 const saldoProj=saldoReal-totalPrevisto;

 // ── Faturas não confirmadas (warning) ────────────────────
 const unconf=[];
 S.cards.forEach(c=>{
  const key=invoiceKey(c.id,S.filterYear,S.filterMonth);
  const hasTx=mt.some(t=>t.method==="Crédito"&&t.cardId===c.id&&(!t.txType||t.txType==="saida"));
  if(hasTx&&!S.billedInvoices[key])unconf.push(c);
 });

 // ── Alerts ────────────────────────────────────────────────
 const alerts=[];
 if(unconf.length)alerts.push(`<div class="reminder row"><div><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ Há compras no cartão sem fatura confirmada</span><div style="font-size:10px;color:var(--muted);margin-top:1px">${unconf.map(c=>c.name).join(", ")}</div></div><button onclick="nav('cartoes')" style="background:var(--gold);border:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif;flex-shrink:0">Gestão →</button></div>`);
 if(saldoProj<0)alerts.push(`<div class="reminder" style="background:var(--redbg);border-color:var(--redbd)"><span style="font-size:12px;font-weight:700;color:var(--red)">🚨 Saldo projetado negativo: ${fmtBRL(saldoProj)} (incluindo pendentes)</span></div>`);
 if(faPend.length)alerts.push(`<div class="reminder row"><span style="font-size:12px;font-weight:700;color:var(--gold)">📌 ${faPend.length} conta(s) fixa(s) sem registro${totalFaPend>0?" · estimado "+fmtBRL(totalFaPend):""}</span><button onclick="nav('fixas')" style="background:none;border:1px solid var(--goldbd);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;color:var(--gold);font-family:'Nunito',sans-serif;white-space:nowrap">Registrar →</button></div>`);
 if(invPrev.length)alerts.push(`<div class="reminder" style="background:rgba(91,156,248,.08);border-color:rgba(91,156,248,.25)"><span style="font-size:12px;font-weight:700;color:var(--blue)">⏳ ${invPrev.length} fatura(s) confirmada(s) aguardando pagamento: ${fmtBRL(totalInvPrev)}</span></div>`);
 entradas.filter(t=>(t.incomeType||"").includes("Ajuste")).length&&alerts.push(`<div class="reminder"><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ Há ajustes gerenciais pendentes de classificação</span></div>`);

 // ── DRE ──────────────────────────────────────────────────
 const invChld=[
  ...invPagas.map(i=>{const c=S.cards.find(x=>x.id===i.cardId);return{key:i.key,paid:true,label:`${c?c.name:""} ${OWNERS.find(o=>o.id===c?.owner)?.e||""} — Fatura ${MONTHS_F[i.chargeMonth]}/${i.chargeYear} ${c?.debitoAuto?"🔄":"✋"}`,value:i.total};}),
  ...invPrev.map(i=>{const c=S.cards.find(x=>x.id===i.cardId);return{key:i.key,paid:false,label:`${c?c.name:""} ${OWNERS.find(o=>o.id===c?.owner)?.e||""} — Fatura ${MONTHS_F[i.chargeMonth]}/${i.chargeYear} ${c?.debitoAuto?"🔄":"✋"} ⏳`,value:i.total};}),
 ];
 const faChld=faLancadas.map(({fa,v})=>({faId:fa.id,paid:isFixaPaid(fa.id,mk),label:fa.desc,value:v}));
 const dirChld=Object.entries(dirByGrp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v}));

 function dreChkBlock(ico,label,total,colorCls,children,blockId){
  const has=children&&children.length>0;
  return`<div>
   <div class="dre-row" onclick="${has?`dreToggle('${blockId}')`:""}" style="${has?"cursor:pointer":""}">
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
     ${has?`<span id="arr_${blockId}" style="font-size:11px;color:var(--muted);display:inline-block;transition:.2s;flex-shrink:0">▶</span>`:`<span style="width:11px;display:inline-block;flex-shrink:0"></span>`}
     <span class="dre-lbl h">${ico} ${escH(label)}</span>
    </div>
    <span class="dre-val ${colorCls}">${fmtBRL(total)}</span>
   </div>
   ${has?`<div id="${blockId}" style="display:none">${children.map(c=>{
    const hasChk=c.key||c.faId;
    const chkHandler=c.key?`openPayDateModal('${c.key}',this.checked)`:`openFixaPayDateModal('${c.faId}','${mk}',this.checked)`;
    return`<div class="chk-row">
     <label class="chk-touch" onclick="event.stopPropagation()">
      ${hasChk?`<input type="checkbox" ${c.paid?"checked":""} onchange="${chkHandler}">`:`<span style="width:20px"></span>`}
     </label>
     <span class="chk-txt">${escH(c.label)}</span>
     <span class="chk-amt ${colorCls}">${fmtBRL(c.value)}</span>
    </div>`;
   }).join("")}</div>`:""}
  </div>`;
 }

 const ownerRows=OWNERS.slice(0,3).map(o=>{
  const vD=sairasDir.filter(t=>t.owner===o.id).reduce((a,b)=>a+b.amount,0);
  const vI=invThisMonth.filter(i=>{const c=S.cards.find(x=>x.id===i.cardId);return c?.owner===o.id;}).reduce((a,b)=>a+b.total,0);
  const vF=faLancadas.filter(({fa})=>fa.resp===o.id).reduce((a,b)=>a+b.v,0);
  return{...o,total:vD+vI+vF};
 }).filter(o=>o.total>0);

 return`
  ${alerts.join("")}
  <div class="dre">
   <div class="dre-hdr">
    <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px">📊 DEMONSTRATIVO — ${MONTHS_F[S.filterMonth].toUpperCase()} ${S.filterYear}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
     <div><div style="font-size:9px;color:var(--muted);margin-bottom:2px">Saldo inicial</div>
      <div style="font-size:15px;font-weight:800">${fmtBRL(saldoInicial)}</div>
      <button onclick="openModal('setSaldoInicial')" style="background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:0;font-family:'Nunito',sans-serif">✏️ editar</button></div>
     <div><div style="font-size:9px;color:var(--muted);margin-bottom:2px">Saldo atual</div>
      <div style="font-size:15px;font-weight:800;color:${saldoReal>=0?"var(--mint)":"var(--red)"}">${fmtBRL(saldoReal)}</div>
      <div style="font-size:9px;color:var(--muted)">após pagamentos realizados</div></div>
     <div style="text-align:right"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">Saldo projetado</div>
      <div style="font-size:18px;font-weight:900;color:${saldoProj>=0?"var(--mint)":"var(--red)"}">${fmtBRL(saldoProj)}</div>
      <div style="font-size:9px;color:var(--muted)">c/ pendentes</div></div>
    </div>
   </div>
   <div class="dre-row tot">
    <div><span class="dre-lbl h">Resultado realizado</span><div style="font-size:10px;color:var(--muted)">Entradas − saídas já pagas</div></div>
    <span class="dre-val big ${resultado>=0?"pos":"neg"}">${resultado>=0?"+":""}${fmtBRL(resultado)}</span>
   </div>
   ${dreChkBlock("🟢","Entradas",totalEntradas,"pos",Object.entries(entByType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v})),"dblk_ent")}
   <div class="dre-row" style="background:var(--faint);border-top:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:6px"><span style="width:14px;display:inline-block"></span>
     <div><span class="dre-lbl h">🔴 Saídas realizadas</span><div style="font-size:10px;color:var(--muted)">Valores já debitados das contas</div></div></div>
    <span class="dre-val neg">${fmtBRL(totalSaidasReal)}</span>
   </div>
   ${invChld.length>0?dreChkBlock("💳","Pagamentos de Fatura",totalInvPagas+totalInvPrev,"neg",invChld,"dblk_inv"):""}
   ${faChld.length>0?dreChkBlock("📌","Contas Fixas",totalFaLanc,"neg",faChld,"dblk_fa"):""}
   ${dirChld.length>0?dreChkBlock("📦","Outras Despesas",totalDir,"neg",dirChld,"dblk_dir"):""}
   ${(()=>{
    // Pending = invoices not paid + fixed accounts not paid (both pending log and logged but not marked paid)
    const faUnpaid=[...faPend,...faLancadas.filter(({fa})=>!isFixaPaid(fa.id,mk))];
    const totalFaUnpaid=faUnpaid.reduce((a,b)=>a+(b.v||b.valor||0),0);
    const totalPrev2=totalInvPrev+totalFaUnpaid;
    if(totalPrev2<=0)return"";
    return`<div>
     <div class="dre-row" style="background:rgba(245,200,66,.06);border-top:1px solid var(--goldbd)">
      <div style="display:flex;align-items:center;gap:6px;cursor:pointer;flex:1" onclick="dreToggle('dblk_prev')">
       <span id="arr_dblk_prev" style="font-size:10px;color:var(--gold);display:inline-block;transition:.2s">▶</span>
       <div><span class="dre-lbl h" style="color:var(--gold)">⏳ A pagar este mês (previsto)</span><div style="font-size:10px;color:var(--muted)">Ainda não debitado</div></div>
      </div>
      <span class="dre-val" style="color:var(--gold)">${fmtBRL(totalPrev2)}</span>
     </div>
     <div id="dblk_prev" style="display:none">
      ${invPrev.map(i=>{const c=S.cards.find(x=>x.id===i.cardId);return`<div class="dre-row sub"><span class="dre-lbl s">💳 ${c?escH(c.name):""} — Fatura ${MONTHS_F[i.chargeMonth]}/${i.chargeYear} · vence ${fmtDate(i.paidDate)}</span><span class="dre-val" style="font-size:12px;color:var(--gold)">${fmtBRL(i.total)}</span></div>`;}).join("")}
      ${faUnpaid.map(x=>{const fa=x.fa||x;const v=x.v||x.valor||0;return`<div class="dre-row sub"><span class="dre-lbl s">📌 ${escH(fa.desc)}${v?" · "+fmtBRL(v):""}</span><span class="dre-val" style="font-size:12px;color:var(--gold)">${fmtBRL(v)}</span></div>`;}).join("")}
     </div>
    </div>`;
   })()}
   ${totalEntradas===0&&totalSaidasReal===0&&totalPrevisto===0?`<div style="text-align:center;padding:22px;color:var(--muted);font-size:13px">Nenhum movimento em ${MONTHS_F[S.filterMonth]}.<br><button onclick="openModal('add')" style="background:var(--mint);border:none;border-radius:9px;padding:8px 18px;cursor:pointer;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif;margin-top:10px">＋ Lançar</button></div>`:""}
  </div>
  ${ownerRows.length?`<div class="sec">👥 Por responsável</div>${ownerRows.map(o=>{const p=totalSaidasReal>0?Math.round((o.total/totalSaidasReal)*100):0;return`<div class="card-in"><div class="row" style="margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:${o.c}">${o.e} ${o.l}</span><div><span style="font-size:14px;font-weight:800;color:var(--red)">${fmtBRL(o.total)}</span><span style="font-size:11px;color:var(--muted);margin-left:5px">${p}%</span></div></div><div class="pbar"><div class="pbar-fill" style="width:${p}%;background:${o.c}"></div></div></div>`;}).join("")}`:""}
  <button onclick="nav('gastos')" style="background:none;border:1px solid var(--border);border-radius:11px;padding:11px;width:100%;color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px">📈 Ver resumo de gastos <span style="color:var(--mint)">→</span></button>
 `;
}

function renderGroups(){
 const mt=mTx();
 const mk=monthKey(S.filterYear,S.filterMonth);

 // ── Regular spending this month (non-credit saídas) ──────────────
 const rows=allGroups().map(g=>{
  const items=mt.filter(t=>getGroup(t.category)?.id===g.id&&(!t.txType||t.txType==="saida")&&t.method!=="Crédito");
  const spent=items.reduce((a,b)=>a+b.amount,0);if(!spent)return"";
  const goal=S.goals[g.id]||0;
  const bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1]||"?";bySub[s]=(bySub[s]||0)+t.amount;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--faint)"><span style="font-size:12px;color:var(--muted)">↳ ${escH(s)}</span><span style="font-size:12px;font-weight:700">${fmtBRL(v)}</span></div>`).join("");
  const pbar=goal>0?`<div class="pbar"><div class="pbar-fill" style="width:${pct(spent,goal)}%;background:${pct(spent,goal)>=100?"var(--red)":g.c}"></div></div><div class="row" style="margin-top:3px"><span style="font-size:10px;color:var(--muted)">${pct(spent,goal).toFixed(0)}%</span><span style="font-size:10px;color:${spent>goal?"var(--red)":"var(--mint)"}">${spent>goal?"▲ +"+fmtBRL(spent-goal):"✓ −"+fmtBRL(goal-spent)}</span></div>`:"";
  return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px"><div style="padding:12px 14px;border-left:4px solid ${g.c}"><div class="row" style="margin-bottom:4px"><span style="font-weight:800;font-size:14px;color:${g.c}">${g.l}</span><div><span style="font-weight:900;font-size:16px">${fmtBRL(spent)}</span>${goal>0?`<span style="font-size:10px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}</div></div>${pbar}</div><div style="padding:8px 14px 12px;background:var(--faint)">${subRows}</div></div>`;
 }).join("");

 // ── Crédito usado este mês (por grupo) ────────────────────────────
 const creditItems=mt.filter(t=>t.method==="Crédito"&&(!t.txType||t.txType==="saida"));
 const creditByGroup={};
 creditItems.forEach(t=>{const g=getGroup(t.category);const k=g?.id||"outros";if(!creditByGroup[k])creditByGroup[k]={g,items:[]};creditByGroup[k].items.push(t);});
 const creditTotal=creditItems.reduce((a,b)=>a+b.amount,0);
 const creditRows=Object.values(creditByGroup).map(({g,items})=>{
  if(!g)return"";
  const spent=items.reduce((a,b)=>a+b.amount,0);
  const bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1]||"?";bySub[s]=(bySub[s]||0)+t.amount;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--faint)"><span style="font-size:12px;color:var(--muted)">↳ ${escH(s)}</span><span style="font-size:12px;font-weight:700">${fmtBRL(v)}</span></div>`).join("");
  return`<div style="background:var(--faint);border-radius:10px;margin-bottom:6px;overflow:hidden"><div style="padding:9px 12px;border-left:3px solid ${g.c}"><div class="row"><span style="font-weight:700;font-size:13px;color:${g.c}">${g.l}</span><span style="font-weight:800;font-size:14px">${fmtBRL(spent)}</span></div></div><div style="padding:6px 12px 10px">${subRows}</div></div>`;
 }).join("");

 // ── Parcelas de meses anteriores competindo este mês ──────────────
 // Installments where the charge is from a previous month but the installment falls here
 const allTx=S.transactions;
 const parcRows=[];
 // Find all installment transactions dated this month (current=N of total)
 const instThisMonth=allTx.filter(t=>{
  if(!t.installments||!t.date)return false;
  const d=new Date(t.date+"T00:00:00");
  return d.getMonth()===S.filterMonth&&d.getFullYear()===S.filterYear;
 });
 // Group by original purchase (same desc + total)
 const parcByGroup={};
 instThisMonth.forEach(t=>{
  const g=getGroup(t.category);const gk=g?.id||"outros";
  if(!parcByGroup[gk])parcByGroup[gk]={g,items:[]};
  parcByGroup[gk].items.push(t);
 });
 const parcTotal=instThisMonth.reduce((a,b)=>a+b.amount,0);
 const parcRows2=Object.values(parcByGroup).map(({g,items})=>{
  if(!g)return"";
  const v=items.reduce((a,b)=>a+b.amount,0);
  const itemRows=items.map(t=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--faint)">
   <div><span style="font-size:12px">${escH(t.desc)}</span><span style="font-size:10px;color:var(--muted);margin-left:6px">${t.installments.current}/${t.installments.total}x · ${fmtBRL(t.installments.totalValue)} total</span></div>
   <span style="font-size:12px;font-weight:700">${fmtBRL(t.amount)}</span>
  </div>`).join("");
  return`<div style="background:var(--faint);border-radius:10px;margin-bottom:6px;overflow:hidden"><div style="padding:9px 12px;border-left:3px solid ${g?.c||"var(--muted)"}"><div class="row"><span style="font-weight:700;font-size:13px;color:${g?.c||"var(--muted)"}">${g?.l||"📦 Outros"}</span><span style="font-weight:800;font-size:14px">${fmtBRL(v)}</span></div></div><div style="padding:6px 12px 10px">${itemRows}</div></div>`;
 }).join("");

 const hasCredit=creditTotal>0;
 const hasParc=parcTotal>0;
 const hasRows=rows.length>0;

 return`<div class="row" style="margin-bottom:12px">
  <div class="sec" style="margin:0">Grupos — ${MONTHS_S[S.filterMonth]}/${S.filterYear}</div>
  <button onclick="openModal('metas')" style="background:none;border:1px solid var(--mintbd);border-radius:8px;color:var(--mint);font-size:11px;padding:5px 10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700">🎯 Metas</button>
 </div>

 ${hasRows?`<div class="sec" style="margin-top:0">💰 Gastos diretos (débito/PIX/dinheiro)</div>${rows}`:""}

 ${hasCredit?`<div class="sec">💳 Compras no cartão este mês</div>
  <div style="background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:12px;margin-bottom:10px">
   <div class="row" style="margin-bottom:10px"><span style="font-size:13px;font-weight:700">Total no cartão</span><span style="font-size:17px;font-weight:900;color:var(--red)">${fmtBRL(creditTotal)}</span></div>
   <div style="font-size:11px;color:var(--muted);margin-bottom:8px">⚠️ Estes valores serão cobrados na fatura do próximo ciclo</div>
   ${creditRows}
  </div>`:""}

 ${hasParc?`<div class="sec">📦 Parcelas de compras anteriores</div>
  <div style="background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:12px;margin-bottom:10px">
   <div class="row" style="margin-bottom:10px"><span style="font-size:13px;font-weight:700">Total de parcelas</span><span style="font-size:17px;font-weight:900;color:var(--orange)">${fmtBRL(parcTotal)}</span></div>
   ${parcRows2}
  </div>`:""}

 ${!hasRows&&!hasCredit&&!hasParc?`<div class="empty"><div class="empty-ico">📊</div><p>Nenhum gasto em ${MONTHS_F[S.filterMonth]}</p></div>`:""}`;
}

// ── RENDER LIST ──────────────────────────────────────────────
function renderList(){
 const ft=mTx().sort((a,b)=>b.date.localeCompare(a.date));
 // Invoice payments DUE this month (not the credit items themselves)
 const invPayThisMonth=Object.values(S.billedInvoices).filter(inv=>inv.confirmed&&inv.payMonth===S.filterMonth&&inv.payYear===S.filterYear);
 const saidas=ft.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito").reduce((a,b)=>a+b.amount,0)+invPayThisMonth.reduce((a,b)=>a+b.total,0);
 const creditTotal=ft.filter(t=>t.method==="Crédito"&&(!t.txType||t.txType==="saida")).reduce((a,b)=>a+b.amount,0);
 const entradas=ft.filter(t=>t.txType==="entrada").reduce((a,b)=>a+b.amount,0);
 if(!ft.length&&!invPayThisMonth.length)return`<div class="empty"><div class="empty-ico">📭</div><p>Nenhum lançamento em ${MONTHS_F[S.filterMonth]}</p><button onclick="openModal('add')" style="background:var(--mint);border:none;border-radius:9px;padding:9px 20px;cursor:pointer;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif;margin-top:12px">＋ Novo lançamento</button></div>`;
 // Invoice payment rows
 const invRows=invPayThisMonth.map(inv=>{
  const c=S.cards.find(x=>x.id===inv.cardId);
  const ac=S.accounts.find(x=>x.id===inv.accountId);
  const paidBadge=inv.paid?`<span class="badge b-mint">✅ Paga</span>`:`<span class="badge b-blue">⏳ Prevista</span>`;
  const daLabel=S.cards.find(x=>x.id===inv.cardId)?.debitoAuto?"🔄":"✋";
  return`<div class="card-sm" style="cursor:pointer;border-left:3px solid ${c?.color||"var(--red)"}" onclick="openModal('confirmInvoice','${inv.key}')">

    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px"><span style="font-size:13px;font-weight:700">💳 Pgto ${c?escH(c.name):"Fatura"}</span>${paidBadge}<span class="badge b-muted">${daLabel}</span></div>
    <div style="font-size:11px;color:var(--muted)">Fatura ${MONTHS_F[inv.chargeMonth]}/${inv.chargeYear} · ${fmtDate(inv.paidDate)}${ac?" · "+escH(ac.name):""}</div>
   </div>
   <span style="font-size:15px;font-weight:800;color:${inv.paid?"var(--red)":"var(--gold)"};margin-left:8px;flex-shrink:0">${fmtBRL(inv.total)}</span>
  </div></div>`;
 }).join("");
 // Non-credit saídas + entradas + credit items (for reference)
 const creditNote=creditTotal>0?`<div style="background:rgba(91,156,248,.08);border:1px solid rgba(91,156,248,.2);border-radius:9px;padding:8px 12px;margin-bottom:6px;font-size:11px;color:var(--blue)">💳 R$ ${fmtBRL(creditTotal)} em compras no cartão este mês — o pagamento da fatura aparece no mês de vencimento</div>`:"";
 return`<p style="font-size:11px;color:var(--muted);margin-bottom:8px">${ft.length} lançamentos · <span style="color:var(--red)">↓${fmtBRL(saidas)}</span> <span style="color:var(--mint)">↑${fmtBRL(entradas)}</span></p>${creditNote}${invRows}`+
 ft.map(t=>{
  const o=OWNERS.find(x=>x.id===t.owner),g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];
  const isE=t.txType==="entrada",isTer=t.owner==="outros";
  const isAdj=(t.incomeType||"").includes("Ajuste");
  const ib=t.installments?`<span class="badge b-gold">${t.installments.current}/${t.installments.total}x</span>`:"";
  const fb=t.fixed?`<span class="badge b-blue">Fixo</span>`:"";
  const etb=isE?`<span class="badge ${isAdj?"b-gold":"b-mint"}">${isAdj?"⚠️ Ajuste":"🟢 "+escH(t.incomeType||"Entrada")}</span>`:"";
  const terb=isTer&&!isE?`<span class="badge b-terceiro">👤 Terceiro</span>`:"";
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  const acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;
  return`<div class="card-sm" style="cursor:pointer;border-left:3px solid ${isE?isAdj?"var(--gold)":"var(--mint)":isTer?"var(--purple)":g?.c||"var(--border)"}" onclick="editTx('${t.id}')">
   <div class="row"><div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px">
     <span style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">${escH(t.desc)}</span>
     ${ib}${fb}${etb}${terb}
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--muted)">
     <span>${fmtDate(t.date)}</span>
     ${g&&!isE?`<span>·</span><span style="color:${g.c}">${escH(sub||"")}</span>`:""}
     <span>·</span><span style="color:${o?.c}">${o?.e||""} ${o?.l||""}</span>
     ${card?`<span>· 💳 ${escH(card.name)}</span>`:acc?`<span>· 🏦 ${escH(acc.name)}</span>`:""}
    </div>
   </div>
   <span style="font-size:15px;font-weight:800;color:${isE?"var(--mint)":"var(--red)"};margin-left:8px;flex-shrink:0">${isE?"+":"−"}${fmtBRL(t.amount)}</span>
  </div></div>`;
 }).join("");
}

}

 return`<div style="background:linear-gradient(135deg,#0A2A18,#07150A);border-radius:var(--r2);padding:15px;margin-bottom:12px;border:1px solid var(--mintbd)"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Saldo total em contas</div><div style="font-size:28px;font-weight:900;color:var(--mint)">${fmtBRL(totalBal)}</div></div>

// ── RENDER BILLS ─────────────────────────────────────────────
function renderGastos(){
 const mt=mTx(), mk=monthKey(S.filterYear,S.filterMonth);
 // All saídas this month (including credit)
 const saidas=mt.filter(t=>(!t.txType||t.txType==="saida"));
 const creditItems=saidas.filter(t=>t.method==="Crédito");
 const directItems=saidas.filter(t=>t.method!=="Crédito");
 const instItems=saidas.filter(t=>t.installments&&t.installments.total>1);
 const total=saidas.reduce((a,b)=>a+b.amount,0);
 const totalCredit=creditItems.reduce((a,b)=>a+b.amount,0);
 const totalDirect=directItems.reduce((a,b)=>a+b.amount,0);

 // By group
 const byGrp={};
 saidas.forEach(t=>{const g=getGroup(t.category);const k=g?.id||"outros";if(!byGrp[k])byGrp[k]={g,items:[],total:0};byGrp[k].items.push(t);byGrp[k].total+=t.amount;});
 const grpRows=Object.values(byGrp).sort((a,b)=>b.total-a.total).map(({g,items,total:gTotal})=>{
  const goal=S.goals[g?.id||"outros"]||0;
  const p=total>0?Math.round((gTotal/total)*100):0;
  const bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1]||"?";bySub[s]=(bySub[s]||0)+t.amount;});
  const byCCard={};items.filter(t=>t.method==="Crédito").forEach(t=>{const c=S.cards.find(x=>x.id===t.cardId);const k=c?c.name:"Cartão";byCCard[k]=(byCCard[k]||0)+t.amount;});
  const hasMeta=goal>0;
  const over=goal>0&&gTotal>goal;
  return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">
   <div style="padding:12px 14px;border-left:4px solid ${g?.c||"var(--muted)"}">
    <div class="row" style="margin-bottom:5px">
     <span style="font-weight:800;font-size:14px;color:${g?.c||"var(--muted)"}">${g?.l||"📦 Outros"}</span>
     <div><span style="font-weight:900;font-size:16px;color:${over?"var(--red)":"var(--text)"}">${fmtBRL(gTotal)}</span>${hasMeta?`<span style="font-size:10px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}<span style="font-size:10px;color:var(--muted);margin-left:5px">${p}%</span></div>
    </div>
    <div style="height:4px;background:var(--bg4);border-radius:3px;overflow:hidden">
     <div style="height:4px;border-radius:3px;width:${Math.min(100,p)}%;background:${over?"var(--red)":g?.c||"var(--mint)"}"></div>
    </div>
    ${hasMeta?`<div class="row" style="margin-top:3px"><span style="font-size:9px;color:var(--muted)">${Math.round(pct(gTotal,goal))}% da meta</span><span style="font-size:9px;color:${over?"var(--red)":"var(--mint)"}">${over?"▲ +"+fmtBRL(gTotal-goal):"✓ −"+fmtBRL(goal-gTotal)}</span></div>`:""}
   </div>
   <div style="padding:8px 14px 12px;background:var(--faint)">
    ${Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--bg4)"><span style="font-size:12px;color:var(--muted)">↳ ${escH(s)}</span><span style="font-size:12px;font-weight:700">${fmtBRL(v)}</span></div>`).join("")}
    ${Object.keys(byCCard).length>0?`<div style="margin-top:6px;padding-top:5px;border-top:1px dashed var(--border)"><span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">No cartão</span>${Object.entries(byCCard).map(([k,v])=>`<div class="row" style="padding:3px 0"><span style="font-size:11px;color:var(--blue)">💳 ${escH(k)}</span><span style="font-size:11px;font-weight:700;color:var(--blue)">${fmtBRL(v)}</span></div>`).join("")}</div>`:""}
   </div>
  </div>`;
 }).join("");

 // Pie chart SVG
 const colors=Object.values(byGrp).sort((a,b)=>b.total-a.total).map(({g})=>g?.c||"#5A6480");
 const vals=Object.values(byGrp).sort((a,b)=>b.total-a.total).map(x=>x.total);
 let pieHtml="";
 if(total>0){
  let cumAngle=0; const cx=60,cy=60,r=55;
  const slices=vals.map((v,i)=>{
   const slice=(v/total)*2*Math.PI;
   const x1=cx+r*Math.sin(cumAngle),y1=cy-r*Math.cos(cumAngle);
   cumAngle+=slice;
   const x2=cx+r*Math.sin(cumAngle),y2=cy-r*Math.cos(cumAngle);
   const large=slice>Math.PI?1:0;
   const path=`M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
   return`<path d="${path}" fill="${colors[i]||"#5A6480"}" opacity="0.9"/>`;
  }).join("");
  pieHtml=`<svg viewBox="0 0 120 120" width="120" height="120" style="flex-shrink:0">${slices}<circle cx="${cx}" cy="${cy}" r="28" fill="var(--bg3)"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="var(--text)" font-size="10" font-weight="800" font-family="Nunito">${fmtBRL(total).replace("R$","").trim()}</text></svg>`;
 }

 // Installments this month
 const instTotal=instItems.reduce((a,b)=>a+b.amount,0);
 const instRows=instItems.map(t=>`<div class="card-sm row"><div><div style="font-size:13px;font-weight:600">${escH(t.desc)}</div><div style="font-size:11px;color:var(--muted)">${fmtDate(t.date)} · ${t.installments.current}/${t.installments.total}x · Total ${fmtBRL(t.installments.totalValue)}</div></div><span style="font-size:14px;font-weight:800;color:var(--orange)">${fmtBRL(t.amount)}</span></div>`).join("");

 // By card
 const cardRows=S.cards.map(c=>{
  const items=creditItems.filter(t=>t.cardId===c.id);
  const ct=items.reduce((a,b)=>a+b.amount,0);
  if(!ct)return"";
  const ow=OWNERS.find(x=>x.id===c.owner);
  return`<div class="card-in" style="border-left:3px solid ${c.color};margin-bottom:6px"><div class="row"><div><span style="font-size:13px;font-weight:700;color:${c.color}">${escH(c.name)} ${ow?.e||""}</span><div style="font-size:10px;color:var(--muted)">${items.length} compras</div></div><span style="font-size:15px;font-weight:800;color:var(--red)">${fmtBRL(ct)}</span></div></div>`;
 }).join("");

 return`<div class="row" style="margin-bottom:12px">
  <div class="sec" style="margin:0">📈 Gastos — ${MONTHS_F[S.filterMonth]} ${S.filterYear}</div>
  <button onclick="openModal('metas')" style="background:none;border:1px solid var(--mintbd);border-radius:8px;color:var(--mint);font-size:11px;padding:5px 10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700">🎯 Metas</button>
 </div>
 ${total===0?`<div class="empty"><div class="empty-ico">📈</div><p>Nenhum gasto em ${MONTHS_F[S.filterMonth]}</p></div>`:`
 <!-- Overview -->
 <div class="card" style="margin-bottom:10px">
  <div style="display:flex;gap:14px;align-items:center">
   ${pieHtml}
   <div style="flex:1">
    <div style="font-size:10px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Total gasto</div>
    <div style="font-size:22px;font-weight:900;color:var(--red);margin-bottom:10px">${fmtBRL(total)}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:3px">💳 Crédito: <span style="font-weight:700;color:var(--text)">${fmtBRL(totalCredit)}</span></div>
    <div style="font-size:11px;color:var(--muted)">🏦 Débito/PIX: <span style="font-weight:700;color:var(--text)">${fmtBRL(totalDirect)}</span></div>
   </div>
  </div>
 </div>
 <!-- Por cartão -->
 ${cardRows?`<div class="sec">💳 Por cartão</div>${cardRows}`:""}
 <!-- Por grupo -->
 <div class="sec">🗂️ Por categoria</div>
 ${grpRows}
 <!-- Parcelas -->
 ${instItems.length>0?`<div class="sec">📦 Compras parceladas este mês</div><div style="background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:12px;margin-bottom:10px"><div class="row" style="margin-bottom:8px"><span style="font-size:13px;font-weight:700">Total em parcelas</span><span style="font-size:16px;font-weight:900;color:var(--orange)">${fmtBRL(instTotal)}</span></div>${instRows}</div>`:""}
 `}`;
}

function renderApto(){
 const ap=S.apto||{};
 const vv=ap.vivaz||{totalParcelas:0,parcAtual:0,valorParcela:0,dataEntrega:"",pagamentos:{}};
 const ob=ap.obra||{valorTotal:0,pagamentos:{}};
 const fi=ap.financiamento||{valorTotal:0,prazo:0,parcela:0,inicio:"",pagamentos:{}};
 const co=ap.condominio||{valor:0,inicio:"",pagamentos:{}};
 const ip=ap.iptu||{valor:0,pagamentos:{}};
 const rf=ap.reformas||[];

 // Progress calc for vivaz
 const vivazPago=Object.values(vv.pagamentos||{}).filter(p=>p.paid).reduce((a,b)=>a+(b.val||0),0);
 const vivazTotal=(vv.totalParcelas||0)*(vv.valorParcela||0);
 const vivazPct=vivazTotal>0?Math.round((vivazPago/vivazTotal)*100):0;

 // Obra progress
 const obraPago=Object.values(ob.pagamentos||{}).filter(p=>p.paid).reduce((a,b)=>a+(b.val||0),0);
 const obraPct=ob.valorTotal>0?Math.round((obraPago/ob.valorTotal)*100):0;

 const mk=monthKey(S.filterYear,S.filterMonth);

 function secCard(title,color,content2){
  return`<div class="card" style="border-left:4px solid ${color};margin-bottom:10px"><div style="font-size:14px;font-weight:800;color:${color};margin-bottom:10px">${title}</div>${content2}</div>`;
 }
 function payRow(section,mk2,label,val,existPay){
  const paid=existPay?.paid||false;
  const pDate=existPay?.date||"";
  return`<div class="card-in row" style="margin-bottom:5px">
   <div><div style="font-size:13px;font-weight:600">${escH(label)}</div>${pDate&&paid?`<div style="font-size:10px;color:var(--muted)">Pago em ${fmtDate(pDate)}</div>`:""}
   </div>
   <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:14px;font-weight:800">${fmtBRL(val)}</span>
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
     <input type="checkbox" ${paid?"checked":""} onchange="saveAptoPayment('${section}','${mk2}',${val},this.checked)" onclick="event.stopPropagation()" style="accent-color:var(--mint);width:15px;height:15px">
     <span style="font-size:11px;color:${paid?"var(--mint)":"var(--muted)"}">${paid?"✅ Pago":"Marcar pago"}</span>
    </label>
   </div>
  </div>`;
 }

 // Vivaz section — current month payment
 const vivazPayMk=payRow("vivaz",mk,
  `Parcela ${vv.parcAtual||"?"}/${vv.totalParcelas||"?"} — ${MONTHS_F[S.filterMonth]}`,
  vv.valorParcela||0, vv.pagamentos?.[mk]);

 // Obra current month
 const obraPayMk=payRow("obra",mk,
  `Evolução de Obra — ${MONTHS_F[S.filterMonth]}`,
  ob.valorMensal||0, ob.pagamentos?.[mk]);

 // Format pago history
 function paidHistory(pagamentos){
  const entries=Object.entries(pagamentos||{}).filter(([,v])=>v.paid).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  if(!entries.length)return`<p style="font-size:11px;color:var(--muted)">Nenhum pagamento registrado.</p>`;
  return entries.map(([k,v])=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--faint)"><span style="font-size:11px;color:var(--muted)">${MONTHS_F[parseInt(k.split("-")[1])-1]}/${k.split("-")[0]}</span><div><span style="font-size:11px;font-weight:700">${fmtBRL(v.val||0)}</span>${v.date?`<span style="font-size:10px;color:var(--muted);margin-left:5px">${fmtDate(v.date)}</span>`:""}</div></div>`).join("");
 }

 // Reformas
 const rfRows=rf.map((r,i)=>`<div class="card-in row" style="margin-bottom:5px"><div><div style="font-size:13px;font-weight:600">${escH(r.desc)}</div><div style="font-size:10px;color:var(--muted)">${fmtDate(r.data)}${r.obs?" · "+escH(r.obs):""}</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;font-weight:800;color:var(--orange)">${fmtBRL(r.valor||0)}</span><button onclick="delReforma(${i})" style="background:none;border:1px solid var(--redbd);border-radius:6px;color:var(--red);font-size:10px;padding:2px 7px;cursor:pointer;font-family:'Nunito',sans-serif">🗑</button></div></div>`).join("");

 return`
 <div class="sec" style="margin-top:0">🏗️ APARTAMENTO VIVAZ — Controle</div>
 <div style="background:linear-gradient(135deg,#0D1A2A,#081012);border-radius:var(--r2);padding:14px;margin-bottom:12px;border:1px solid rgba(91,156,248,.2)">
  <div class="row" style="margin-bottom:10px"><span style="font-size:12px;color:var(--muted)">Previsão de entrega</span><span style="font-size:13px;font-weight:700">${vv.dataEntrega||"—"}</span></div>
  <div class="row" style="margin-bottom:6px"><span style="font-size:12px;color:var(--muted)">Total do imóvel</span><span style="font-size:13px;font-weight:700">${fmtBRL(vivazTotal)}</span></div>
  <div class="row" style="margin-bottom:6px"><span style="font-size:12px;color:var(--muted)">Pago até agora</span><span style="font-size:13px;font-weight:700;color:var(--mint)">${fmtBRL(vivazPago)}</span></div>
  <div class="pbar" style="height:8px;margin:8px 0"><div class="pbar-fill" style="width:${vivazPct}%;background:var(--blue);height:8px"></div></div>
  <div class="row"><span style="font-size:10px;color:var(--muted)">${vivazPct}% pago</span><span style="font-size:10px;color:var(--muted)">Restam ${fmtBRL(vivazTotal-vivazPago)}</span></div>
 </div>

 <!-- Mensalidade Vivaz -->

function renderHistorico(){
 // Build month range: startMonth to current
 const months=[];
 let y=S.startYear,m=S.startMonth;
 const nowY=new Date().getFullYear(),nowM=new Date().getMonth();
 while(y<nowY||(y===nowY&&m<=nowM)){months.push({y,m});m++;if(m>11){m=0;y++;}}

 if(months.length===0)return`<div class="empty"><div class="empty-ico">📉</div><p>Nenhum dado histórico ainda</p></div>`;

 // Aggregate by month
 const byMonth=months.map(({y,m})=>{
  const mk2=monthKey(y,m);
  const txs=S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===m&&d.getFullYear()===y;});
  const entradas=txs.filter(t=>t.txType==="entrada").reduce((a,b)=>a+b.amount,0);
  const saidas=txs.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito").reduce((a,b)=>a+b.amount,0);
  const faturas=Object.values(S.billedInvoices).filter(i=>i.confirmed&&i.payMonth===m&&i.payYear===y).reduce((a,b)=>a+b.total,0);
  const fixas=Object.entries(S.fixedLogs).reduce((sum,[faId,logs])=>sum+(logs[mk2]||0),0);
  const totalSaidas=saidas+faturas;
  return{y,m,mk:mk2,label:`${MONTHS_S[m]}/${y}`,entradas,saidas:totalSaidas,fixas,resultado:entradas-totalSaidas};
 });

 // SVG line chart
 const W=Math.max(400,months.length*52),H=200,PAD=40;
 const maxVal=Math.max(...byMonth.flatMap(b=>[b.entradas,b.saidas,Math.abs(b.resultado)]),100);
 function toY(v){return PAD+((H-2*PAD)*(1-v/maxVal));}
 function toX(i){return PAD+(i/(Math.max(byMonth.length-1,1)))*(W-2*PAD);}

 const entPath=byMonth.map((b,i)=>`${i===0?"M":"L"}${toX(i).toFixed(0)},${toY(b.entradas).toFixed(0)}`).join(" ");
 const saiPath=byMonth.map((b,i)=>`${i===0?"M":"L"}${toX(i).toFixed(0)},${toY(b.saidas).toFixed(0)}`).join(" ");
 const resPath=byMonth.map((b,i)=>`${i===0?"M":"L"}${toX(i).toFixed(0)},${toY(Math.abs(b.resultado)).toFixed(0)}`).join(" ");
 const zero=toY(0).toFixed(0);

 const dots=byMonth.map((b,i)=>`
  <circle cx="${toX(i)}" cy="${toY(b.entradas)}" r="4" fill="var(--mint)" title="${b.label}: ${fmtBRL(b.entradas)}"/>
  <circle cx="${toX(i)}" cy="${toY(b.saidas)}" r="4" fill="var(--red)"/>
 `).join("");

 const labels=byMonth.map((b,i)=>`<text x="${toX(i)}" y="${H-8}" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Nunito">${b.label}</text>`).join("");

 const gridLines=[0,0.25,0.5,0.75,1].map(f=>{
  const v=maxVal*f,y2=toY(v);
  return`<line x1="${PAD}" x2="${W-PAD}" y1="${y2}" y2="${y2}" stroke="var(--border)" stroke-dasharray="3,3"/>
   <text x="${PAD-4}" y="${y2+4}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="Nunito">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text>`;
 }).join("");

 const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
  ${gridLines}
  <path d="${entPath}" stroke="var(--mint)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <path d="${saiPath}" stroke="var(--red)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  ${dots}
  ${labels}
  <!-- Legend -->
  <circle cx="${PAD}" cy="14" r="5" fill="var(--mint)"/><text x="${PAD+10}" y="18" fill="var(--mint)" font-size="10" font-family="Nunito">Entradas</text>
  <circle cx="${PAD+70}" cy="14" r="5" fill="var(--red)"/><text x="${PAD+80}" y="18" fill="var(--red)" font-size="10" font-family="Nunito">Saídas</text>
 </svg>`;

 // Table
 const tableRows=byMonth.slice().reverse().map(b=>`<tr>
  <td style="padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap">${b.label}</td>
  <td style="padding:7px 10px;font-size:12px;color:var(--mint);text-align:right">${fmtBRL(b.entradas)}</td>
  <td style="padding:7px 10px;font-size:12px;color:var(--red);text-align:right">${fmtBRL(b.saidas)}</td>
  <td style="padding:7px 10px;font-size:12px;font-weight:700;color:${b.resultado>=0?"var(--mint)":"var(--red)"};text-align:right">${b.resultado>=0?"+":""}${fmtBRL(b.resultado)}</td>
 </tr>`).join("");

 // By category summary
 const catSummary={};
 S.transactions.filter(t=>!isBeforeStart(new Date(t.date+"T00:00:00").getFullYear(),new Date(t.date+"T00:00:00").getMonth())).forEach(t=>{
  if(!t.txType||t.txType==="saida"){const g=getGroup(t.category);const k=g?g.l:"📦 Outros";catSummary[k]=(catSummary[k]||0)+t.amount;}
 });
 const catRows=Object.entries(catSummary).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td style="padding:6px 10px;font-size:12px">${escH(k)}</td><td style="padding:6px 10px;font-size:12px;color:var(--red);text-align:right;font-weight:700">${fmtBRL(v)}</td></tr>`).join("");

 return`
 <div class="row" style="margin-bottom:12px">
  <div class="sec" style="margin:0">📉 Histórico a partir de ${MONTHS_F[S.startMonth]} ${S.startYear}</div>
  <button onclick="exportHistorico()" style="background:var(--mint);border:none;border-radius:8px;color:#060D08;font-size:11px;font-weight:700;padding:5px 11px;cursor:pointer;font-family:'Nunito',sans-serif">⬇️ Exportar</button>
 </div>
 <div class="card" style="margin-bottom:12px;overflow-x:auto">
  <div class="sec" style="margin-top:0">Entradas vs Saídas por mês</div>
  ${svg}
 </div>
 <div class="card" style="margin-bottom:12px;overflow-x:auto">
  <div class="sec" style="margin-top:0">Tabela mensal</div>
  <table style="width:100%;border-collapse:collapse">
   <tr style="border-bottom:1px solid var(--border)">
    <th style="padding:7px 10px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Mês</th>
    <th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Entradas</th>
    <th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Saídas</th>
    <th style="padding:7px 10px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Resultado</th>
   </tr>
   ${tableRows}
  </table>
 </div>
 <div class="card" style="margin-bottom:12px;overflow-x:auto">
  <div class="sec" style="margin-top:0">Top categorias (acumulado)</div>
  <table style="width:100%;border-collapse:collapse">
   <tr style="border-bottom:1px solid var(--border)"><th style="padding:6px 10px;text-align:left;font-size:10px;color:var(--muted)">Categoria</th><th style="padding:6px 10px;text-align:right;font-size:10px;color:var(--muted)">Total</th></tr>
   ${catRows}
  </table>
 </div>
 `;
}
function exportHistorico(){
 if(typeof XLSX==="undefined"){toast("⚠️ Aguarde o carregamento");return;}
 const months=[];let y=S.startYear,m=S.startMonth;
 const nowY=new Date().getFullYear(),nowM=new Date().getMonth();
 while(y<nowY||(y===nowY&&m<=nowM)){months.push({y,m});m++;if(m>11){m=0;y++;}}
 const rows=months.map(({y,m})=>{
  const mk2=monthKey(y,m);
  const txs=S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===m&&d.getFullYear()===y;});
  const ent=txs.filter(t=>t.txType==="entrada").reduce((a,b)=>a+b.amount,0);
  const sai=txs.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito").reduce((a,b)=>a+b.amount,0);
  const fat=Object.values(S.billedInvoices).filter(i=>i.confirmed&&i.payMonth===m&&i.payYear===y).reduce((a,b)=>a+b.total,0);
  return[`${MONTHS_S[m]}/${y}`,ent,sai+fat,ent-(sai+fat)];
 });
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet([["Mês","Entradas","Saídas","Resultado"],...rows]);
 XLSX.utils.book_append_sheet(wb,ws,"Histórico");
 XLSX.writeFile(wb,"Historico_KK.xlsx");toast("✓ Exportado!");
}

 ;
 return pendHTML+S.cards.map(c=>{

function setTxType(type){
 _txType=type;
 const isSaida=type==="saida";
 document.getElementById("tt-saida").className="type-opt "+(isSaida?"saida-on":"off");
 document.getElementById("tt-entrada").className="type-opt "+(isSaida?"off":"entrada-on");
 // Update category
 const catWrap=document.getElementById("catWrap");
 if(catWrap){
  const catOpts=isSaida?allGroups().flatMap(g=>(g.subs||[]).map(s=>`<option value="${escH(g.l+' > '+s)}">${escH(g.l+' > '+s)}</option>`)).join(""):INCOME_TYPES.map(t=>`<option value="${escH(t)}">${escH(t)}</option>`).join("");
  catWrap.innerHTML=`<label class="lbl">${isSaida?"Categoria":"Tipo de entrada"}</label>${isSaida?`<select class="input" id="txCat">${catOpts}</select>`:`<select class="input" id="txIncomeType" onchange="checkAjuste(this.value)">${catOpts}</select><div id="ajusteWarn" style="display:none;background:var(--goldbg);border:1px solid var(--goldbd);border-radius:8px;padding:8px 11px;margin-top:6px;font-size:11px;color:var(--gold)">⚠️ <b>Ajuste Gerencial</b> — lembre-se de classificar depois!</div>`}`;
 }
 document.getElementById("payWrap").style.display=isSaida?"block":"none";
 document.getElementById("entAccWrap").style.display=isSaida?"none":"block";
 const dl=document.getElementById("txDesc");if(dl)dl.placeholder=isSaida?"Ex: Gasolina Shell":"Ex: Salário maio";
}
function txOwner(id){_txOwner=id;OWNERS.forEach(o=>{const b=document.getElementById("oc_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg4)";b.style.color=o.id===id?"#fff":"var(--muted)";b.style.borderColor=o.id===id?o.c:"transparent";}});}
function txMethod(m){
 _txMethod=m;
 METHODS_SAIDA.forEach(x=>{const b=document.getElementById("mc_"+x);if(b){b.style.background=x===m?"var(--mint)":"var(--bg4)";b.style.color=x===m?"#060D08":"var(--muted)";b.style.borderColor=x===m?"var(--mint)":"transparent";}});
 const lbl=document.getElementById("ptLabel");if(lbl)lbl.textContent=m==="Crédito"?"Cartão":"Conta";
 const wrap=document.getElementById("ptBtns");
 if(wrap){
  if(m==="Crédito"){wrap.innerHTML=S.cards.map(c=>{const ow=OWNERS.find(x=>x.id===c.owner);return`<button id="crd_${c.id}" onclick="txCard('${c.id}')" style="background:${_txCard===c.id?c.color+'33':'var(--bg4)'};border:2px solid ${_txCard===c.id?c.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txCard===c.id?c.color:'var(--text)'}">${escH(c.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} · Fecha ${c.closeDay}</span></span>${_txCard===c.id?`<span style="color:${c.color}">✓</span>`:""}</div></button>`;}).join("");}
  else{wrap.innerHTML=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" style="background:${_txAcc===a.id?a.color+'33':'var(--bg4)'};border:2px solid ${_txAcc===a.id?a.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txAcc===a.id?a.color:'var(--text)'}">${escH(a.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} ${ow?.l||""}</span></span>${_txAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div></button>`;}).join("");}
 }
 updateBillingInfo();
}
function txCard(id){_txCard=id;S.cards.forEach(c=>{const b=document.getElementById("crd_"+c.id);if(b){b.style.background=c.id===id?c.color+"33":"var(--bg4)";b.style.borderColor=c.id===id?c.color:"transparent";}});updateBillingInfo();}
function txAcc(id){_txAcc=id;S.accounts.forEach(a=>{const b=document.getElementById("acc_"+a.id);if(b){b.style.background=a.id===id?a.color+"33":"var(--bg4)";b.style.borderColor=a.id===id?a.color:"transparent";}});}
function updateBillingInfo(){
 const card=S.cards.find(c=>c.id===_txCard),dateEl=document.getElementById("txDate"),info=document.getElementById("billingInfo");
 if(!info)return;
 if(_txMethod==="Crédito"&&card&&dateEl?.value){
  try{const p=setBilling(card,dateEl.value);document.getElementById("bPeriod").textContent=`${fmtDate(p.start.toISOString().slice(0,10))} → ${fmtDate(p.end.toISOString().slice(0,10))}`;document.getElementById("bPay").textContent=`Vence ${fmtDate(p.payDate.toISOString().slice(0,10))}`;info.style.display="block";}catch{info.style.display="none";}
 } else info.style.display="none";
}
function checkAjuste(v){const w=document.getElementById("ajusteWarn");if(w)w.style.display=v.includes("Ajuste")?"block":"none";}
function toggleInst(){const c=document.getElementById("isInst"),w=document.getElementById("instWrap"),p=document.getElementById("instPrev");if(w)w.style.display=c?.checked?"flex":"none";if(p)p.style.display=c?.checked?"block":"none";}
function calcInst(){const tv=parseFloat(document.getElementById("instTot")?.value)||0,tq=parseInt(document.getElementById("instQty")?.value)||0,p=document.getElementById("instPrev"),ae=document.getElementById("txAmt");if(tq>0&&tv>0){const par=tv/tq;if(ae)ae.value=par.toFixed(2);if(p)p.textContent=`${tq}x de ${fmtBRL(par)} = ${fmtBRL(tv)}`;}}
function submitTx(eid){
 const date=document.getElementById("txDate")?.value||todayStr();
 const amt=parseFloat(document.getElementById("txAmt")?.value||"0");
 const desc=(document.getElementById("txDesc")?.value||"").trim();
 const notes=document.getElementById("txNotes")?.value||"";
 const fixed=document.getElementById("txFixed")?.checked||false;
 if(!desc||!amt||isNaN(amt)){toast("⚠️ Preencha descrição e valor");return;}
 const isSaida=_txType==="saida";
 const cat=isSaida?document.getElementById("txCat")?.value||"":"";
 const incomeType=!isSaida?document.getElementById("txIncomeType")?.value||"":"";
 const isInst=document.getElementById("isInst")?.checked;
 let installments=null;
 if(isInst){const tv=parseFloat(document.getElementById("instTot")?.value)||0,tq=parseInt(document.getElementById("instQty")?.value)||0,tc=parseInt(document.getElementById("instCurr")?.value)||1;if(tv>0&&tq>0)installments={totalValue:tv,total:tq,current:tc};}
 const tx={id:eid||gid(),date,desc,amount:amt,owner:_txOwner,category:cat,method:isSaida?_txMethod:"PIX",
  cardId:isSaida&&_txMethod==="Crédito"?(_txCard||null):null,
  accountId:_txAcc||null,
  notes,installments,fixed,txType:_txType,incomeType};
 saveTx(tx);closeModal();
}
function confirmDel(id){const b=document.getElementById("delBtn");if(b?.dataset.c==="1"){deleteTx(id);closeModal();}else if(b){b.textContent="⚠️ Confirmar?";b.dataset.c="1";setTimeout(()=>{if(b){b.textContent="🗑 Excluir";b.dataset.c="";}},3000);}}

function buildFixedLogModal(faId){

 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">

function skipFixedThisMonth(faId,mk){

function submitFixedLog(faId,mk){

 saveTx(tx);closeModal();toast("✓ Valor registrado");
}

// ── CONFIRM INVOICE ──────────────────────────────────────────
function buildConfirmInvoiceModal(invKey){
 const[cardId,ym]=invKey.split("__");const[yr,mo]=ym.split("-").map(Number);
 const chargeYear=yr,chargeMonth=mo-1;
 const card=S.cards.find(c=>c.id===cardId);if(!card)return"";
 const txList=S.transactions.filter(t=>t.method==="Crédito"&&t.cardId===cardId&&(()=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===chargeMonth&&d.getFullYear()===chargeYear;})());
 const total=txList.reduce((a,b)=>a+b.amount,0);
 const pay=getInvoicePayMonth(card,chargeYear,chargeMonth);
 const existing=S.billedInvoices[invKey]||{};
 _ciAcc=existing.accountId||S.accounts[0]?.id||null;_ciKey=invKey;
 const accBtns=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="cia_${a.id}" onclick="ciAcc('${a.id}')" style="background:${_ciAcc===a.id?a.color+'33':'var(--bg4)'};border:2px solid ${_ciAcc===a.id?a.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif"><div class="row"><span style="font-size:12px;font-weight:700;color:${_ciAcc===a.id?a.color:'var(--text)'}">${escH(a.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} ${ow?.l||""}</span></span>${_ciAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div></button>`;}).join("");
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div><div class="sh-title">✅ Confirmar fatura</div><div class="sh-sub">${escH(card.name)} · ${MONTHS_F[chargeMonth]}/${chargeYear}</div></div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div style="background:var(--redbg);border:1px solid var(--redbd);border-radius:12px;padding:13px;margin-bottom:13px"><div style="font-size:10px;color:var(--red);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px">Total da fatura</div><div style="font-size:26px;font-weight:900;color:var(--red)">${fmtBRL(total)}</div><div style="font-size:11px;color:var(--muted)">${txList.length} lançamentos · Pagamento em <b style="color:var(--gold)">${MONTHS_F[pay.month]}/${pay.year}</b></div></div>
  ${txList.sort((a,b)=>b.amount-a.amount).slice(0,4).map(t=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px">${escH(t.desc)}</span><span style="font-size:11px;font-weight:700;color:var(--red)">${fmtBRL(t.amount)}</span></div>`).join("")}
  ${txList.length>4?`<div style="font-size:10px;color:var(--muted);margin:4px 0 10px">+${txList.length-4} outros</div>`:`<div style="margin-bottom:10px"></div>`}
  <div style="margin-bottom:10px"><label class="lbl">Valor a pagar (ajuste se necessário)</label><input class="input" id="ciVal" type="number" step="0.01" value="${existing.total||total.toFixed(2)}" style="font-size:18px"></div>
  <div style="margin-bottom:12px"><label class="lbl">Data do pagamento</label><input class="input" id="ciDate" type="date" value="${existing.paidDate||new Date(pay.year,pay.month,card.payDay).toISOString().slice(0,10)}"></div>
  <label class="lbl">Conta de débito</label>${accBtns}
  <div class="fbrow"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="submitConfirmInvoice()">✅ Confirmar</button></div>
 </div></div>`;
}
function ciAcc(id){_ciAcc=id;S.accounts.forEach(a=>{const b=document.getElementById("cia_"+a.id);if(b){b.style.background=a.id===id?a.color+"33":"var(--bg4)";b.style.borderColor=a.id===id?a.color:"transparent";}});}
function submitConfirmInvoice(){
 if(!_ciKey||!_ciAcc){toast("⚠️ Selecione a conta");return;}
 const val=parseFloat(document.getElementById("ciVal")?.value)||0;
 const dt=document.getElementById("ciDate")?.value||todayStr();
 const[cardId,ym]=_ciKey.split("__");const[yr,mo]=ym.split("-").map(Number);
 const inv={key:_ciKey,cardId,chargeYear:yr,chargeMonth:mo-1,total:val,accountId:_ciAcc,paidDate:dt,confirmed:true,payYear:new Date(dt).getFullYear(),payMonth:new Date(dt).getMonth()};
 saveBilledInvoice(inv);closeModal();
}

function buildCardDatesModal(cardId){

  <div class="g2" style="margin-bottom:14px"><div><label class="lbl">Dia fechamento</label><input class="input" id="cdClose" type="number" min="1" max="31" value="${ov.closeDay||card.closeDay}"></div><div><label class="lbl">Dia vencimento</label><input class="input" id="cdPay" type="number" min="1" max="31" value="${ov.payDay||card.payDay}"></div></div>

function saveCardDates(cid,mk){const cd=+document.getElementById("cdClose")?.value,pd=+document.getElementById("cdPay")?.value;if(!S.cardDateOverrides)S.cardDateOverrides={};if(!S.cardDateOverrides[cid])S.cardDateOverrides[cid]={};S.cardDateOverrides[cid][mk]={closeDay:cd,payDay:pd};fbSet("cardDateOverrides",S.cardDateOverrides);closeModal();render();toast("✓ Datas atualizadas");}
function resetCardDates(cid,mk){if(S.cardDateOverrides?.[cid]?.[mk])delete S.cardDateOverrides[cid][mk];fbSet("cardDateOverrides",S.cardDateOverrides);closeModal();render();toast("✓ Resetado");}

let _aiRes=null,_aiOwner="kelvin";
function buildAIModal(){
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div class="sh-title">✨ Importar com IA</div><button class="xbtn" onclick="closeModal()">✕</button></div>

  <textarea id="aiTxt" class="input" rows="6" placeholder="Nubank Maio&#10;05/05 Gasolina R$ 220,00&#10;07/05 iFood R$ 45,90..."></textarea>
  <div id="aiErr" style="color:var(--red);font-size:12px;margin-top:5px;display:none"></div>
  <div id="aiRes" style="display:none;margin-top:10px;max-height:150px;overflow-y:auto"></div>
  <div class="fbrow">
   <button class="btn btn-pri" id="aiBtn" onclick="aiParse()">🔍 Analisar</button>
   <button class="btn btn-ghost" id="aiConfBtn" style="display:none" onclick="aiConfirm()">✅ Importar ${_aiRes?.length||0}</button>
  </div>
 </div></div>`;

function aiOwner(id,btn){_aiOwner=id;document.querySelectorAll("#aiTxt~* .chip,[onclick*='aiOwner'] ").forEach(()=>{});btn?.closest(".chip-row")?.querySelectorAll("button").forEach(b=>{const o=OWNERS.find(x=>b.textContent.includes(x.l));if(o){b.style.background=o.id===id?o.c:"var(--bg4)";b.style.color=o.id===id?"#fff":"var(--muted)";}});}
async function aiParse(){
 const text=document.getElementById("aiTxt")?.value||"";if(!text.trim()){toast("⚠️ Cole algum texto");return;}
 const btn=document.getElementById("aiBtn");btn.textContent="⏳ Analisando...";btn.disabled=true;
 document.getElementById("aiErr").style.display="none";
 const catList=allGroups().flatMap(g=>(g.subs||[]).map(s=>`${g.l} > ${s}`)).slice(0,60).join(", ");
 try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:`Extraia lançamentos financeiros. Responda APENAS com JSON válido sem markdown. Formato: {"transactions":[{"date":"YYYY-MM-DD","desc":"descrição curta","amount":0.00,"category":"categoria exata da lista"}]}. Categorias disponíveis: ${catList}. Se data não clara use ${todayStr()}. Amount positivo.`,messages:[{role:"user",content:text}]})});
  const data=await res.json();
  const raw=data.content?.find(b=>b.type==="text")?.text||"";
  _aiRes=JSON.parse(raw.replace(/```json|```/g,"").trim()).transactions||[];
  const resDiv=document.getElementById("aiRes");resDiv.style.display="block";
  resDiv.innerHTML=`<div style="font-size:11px;color:var(--mint);margin-bottom:5px">✓ ${_aiRes.length} lançamento(s) encontrado(s):</div>`+_aiRes.map(t=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${escH(t.desc)} <span style="color:var(--muted)">${escH((t.category||"").split(" > ")[1]||"")}</span></span><span style="color:var(--red);font-weight:700">${fmtBRL(t.amount)}</span></div>`).join("");
  const cb=document.getElementById("aiConfBtn");if(cb){cb.style.display="flex";cb.textContent=`✅ Importar ${_aiRes.length}`;}
 }catch(e){const err=document.getElementById("aiErr");err.style.display="block";err.textContent="Não consegui interpretar. Tente colar um texto mais estruturado.";}
 btn.textContent="🔍 Analisar";btn.disabled=false;
}
function aiConfirm(){if(!_aiRes)return;_aiRes.forEach(t=>saveTx({...t,id:gid(),owner:_aiOwner,cardId:null,accountId:S.accounts[0]?.id||null,notes:"Importado via IA",installments:null,fixed:false,txType:"saida",incomeType:""}));closeModal();toast(`✓ ${_aiRes.length} lançamentos importados`);}

// ── EXCEL EXPORT ──────────────────────────────────────────────
function exportExcel(){
 if(typeof XLSX==="undefined"){toast("⚠️ Aguarde o carregamento");return;}
 const wb=XLSX.utils.book_new();
 const headers=["Data","Descrição","Tipo","Responsável","Categoria","Método","Conta/Cartão","Valor (R$)","Parcela","Total Parc.","Tipo Entrada","Fixo?","Obs"];
 const rows=S.transactions.map(t=>{const o=OWNERS.find(x=>x.id===t.owner),card=t.cardId?S.cards.find(c=>c.id===t.cardId):null,acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;return[t.date,t.desc,t.txType==="entrada"?"Entrada":"Saída",o?.l||t.owner,t.category||t.incomeType||"",t.method,card?card.name:acc?acc.name:"",t.amount,t.installments?.current||"",t.installments?.total||"",t.incomeType||"",t.fixed?"Sim":"Não",t.notes||""];});
 const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
 ws["!cols"]=headers.map((_,i)=>({wch:[12,30,8,10,35,10,18,12,8,10,20,6,25][i]||12}));
 XLSX.utils.book_append_sheet(wb,ws,"📋 Lançamentos");
 XLSX.writeFile(wb,`Financas_KK_${S.filterYear}-${String(S.filterMonth+1).padStart(2,"0")}.xlsx`);
 toast("✓ Excel exportado!");
}

// ── IMPORT EXCEL ──────────────────────────────────────────────
function buildImportExcelModal(){
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div class="sh-title">⬆️ Importar Excel</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:13px">Selecione um arquivo Excel com lançamentos.</p>
  <input type="file" id="xlFile" accept=".xlsx,.xls" style="display:none" onchange="processXL(this)">
  <button class="btn btn-pri" onclick="document.getElementById('xlFile').click()" style="width:100%;padding:11px;margin-bottom:10px">📂 Selecionar arquivo</button>
  <div id="xlStatus" style="font-size:12px;color:var(--muted);text-align:center"></div>
 </div></div>`;
}
function processXL(input){
 const file=input.files[0];if(!file)return;
 document.getElementById("xlStatus").textContent="Lendo arquivo...";
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
   const sheetName=wb.SheetNames.find(n=>n.includes("Importar")||n.includes("Lançamentos"))||wb.SheetNames[0];
   const ws=wb.Sheets[sheetName];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
   let hIdx=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes("data")));
   if(hIdx<0)hIdx=0;
   const dataRows=rows.slice(hIdx+1).filter(r=>r[0]&&r[1]);
   let imported=0;
   dataRows.forEach(r=>{
    const date=normalizeDate(String(r[0]||"").trim());
    const desc=String(r[1]||"").trim();
    const amt=parseFloat(String(r[7]||r[3]||"0").replace(",","."))||0;
    if(!date||!desc||!amt)return;
    const ownerLabel=String(r[3]||"").trim();
    const ownerId=OWNERS.find(o=>o.l.toLowerCase()===ownerLabel.toLowerCase())?.id||"outros";
    saveTx({id:gid(),date,desc,amount:amt,owner:ownerId,category:String(r[4]||"").trim(),method:String(r[5]||"PIX").trim(),cardId:null,accountId:S.accounts[0]?.id||null,notes:String(r[12]||"").trim(),installments:null,fixed:String(r[11]||"").toLowerCase()==="sim",txType:String(r[2]||"saida").toLowerCase().includes("entrada")?"entrada":"saida",incomeType:String(r[10]||"").trim()});
    imported++;
   });
   document.getElementById("xlStatus").textContent=`✓ ${imported} lançamento(s) importado(s)`;
   setTimeout(()=>{closeModal();toast(`✓ ${imported} importados`);},1500);
  }catch(err){document.getElementById("xlStatus").textContent="❌ Erro ao ler o arquivo.";}
 };
 reader.readAsArrayBuffer(file);
}
function normalizeDate(d){
 if(!d)return todayStr();
 if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)){const[dd,mm,yyyy]=d.split("/");return`${yyyy}-${mm}-${dd}`;}
 try{const dt=new Date(d);if(!isNaN(dt))return dt.toISOString().slice(0,10);}catch{}
 return todayStr();
}
