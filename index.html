<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>💚 K&K Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;background:#060D08;color:#E2F0E8;-webkit-font-smoothing:antialiased}

/* ── TOKENS ── */
:root{
  --bg0:#060D08;    /* deepest bg */
  --bg1:#0C1610;    /* sidebar / cards */
  --bg2:#111F15;    /* content bg */
  --bg3:#172A1B;    /* card surface */
  --bg4:#1D3422;    /* elevated */
  --border:#1F3826;
  --text:#E2F0E8;
  --muted:#6B9070;
  --faint:#0F1C12;
  --mint:#4ECCA3;   /* primary accent */
  --mint2:#2EBD8A;  /* darker mint */
  --mintbg:rgba(78,204,163,.10);
  --mintbd:rgba(78,204,163,.22);
  --red:#F06B6B;
  --redbg:rgba(240,107,107,.10);
  --redbd:rgba(240,107,107,.22);
  --gold:#F5C842;
  --goldbg:rgba(245,200,66,.10);
  --goldbd:rgba(245,200,66,.22);
  --blue:#5B9CF8;
  --pink:#F07DB0;
  --purple:#A87EF8;
  --r:13px; --r2:18px;
}

/* ── LAYOUT ── */
#app{display:flex;height:100dvh;overflow:hidden}

/* SIDEBAR desktop */
#sidebar{width:210px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:0 0 16px}
@media(max-width:639px){#sidebar{display:none}}
.sb-header{padding:18px 16px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sb-logo{font-size:19px;font-weight:900;letter-spacing:-.5px}
.sb-logo em{color:var(--mint);font-style:normal}
.sb-sync{font-size:10px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
.sb-section{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;padding:12px 16px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:0;border:none;background:none;color:var(--muted);font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;text-align:left;transition:.15s;font-weight:600}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--mintbg);color:var(--mint);border-right:3px solid var(--mint)}
.sb-item .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-footer{margin-top:auto;padding:12px 10px 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border)}
.sb-btn{padding:9px 12px;border-radius:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;text-align:center;transition:.15s;width:100%}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg2)}

/* TOP BAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg1);gap:10px}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-title{font-size:16px;font-weight:900;letter-spacing:-.3px}
@media(max-width:639px){.tb-title{font-size:15px}}
.tb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{height:34px;padding:0 13px;border-radius:9px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.tb-sync{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}

/* MONTH NAV */
#monthnav{display:flex;align-items:center;gap:0;padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);overflow-x:auto;scrollbar-width:none}
#monthnav::-webkit-scrollbar{display:none}
.mn-year{display:flex;align-items:center;gap:5px;margin-right:10px;flex-shrink:0}
.mn-year-btn{width:26px;height:26px;border:none;border-radius:7px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.mn-year-lbl{font-size:13px;font-weight:800;color:var(--text);min-width:36px;text-align:center}
.mn-months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.mn-months::-webkit-scrollbar{display:none}
.mn-m{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:var(--bg3);color:var(--muted);transition:.15s;white-space:nowrap;font-family:'Nunito',sans-serif}
.mn-m.active{background:var(--mint);color:#060D08}
.mn-m:hover:not(.active){background:var(--bg4);color:var(--text)}

/* MOBILE TABS */
#mobtabs{display:none;background:var(--bg1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#mobtabs::-webkit-scrollbar{display:none}
@media(max-width:639px){#mobtabs{display:flex;padding:6px 10px;gap:4px}}
.mt-tab{padding:6px 13px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:none;color:var(--muted);white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s}
.mt-tab.active{background:var(--mintbg);color:var(--mint)}

/* SCROLL AREA */
#content{flex:1;overflow-y:auto;padding:14px 14px 80px}
@media(min-width:640px){#content{padding:16px 20px 40px}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* BOTTOM NAV mobile */
#botnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--border);z-index:100;padding:4px 0 env(safe-area-inset-bottom)}
@media(max-width:639px){#botnav{display:flex}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;font-family:'Nunito',sans-serif;font-weight:600;transition:.15s}
.bn-item.active{color:var(--mint)}
.bn-ico{font-size:19px;line-height:1}

/* ── CARDS / SURFACES ── */
.card{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:15px;margin-bottom:10px}
.card-sm{background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);padding:11px 13px;margin-bottom:7px}
.card-inset{background:var(--bg4);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.sec{font-size:9px;font-weight:800;color:var(--mint2);text-transform:uppercase;letter-spacing:1.2px;margin:16px 0 7px}

/* ── DRE CARD ── */
.dre{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.dre-header{background:linear-gradient(135deg,#0A2218,#071510);padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border)}
.dre-row:last-child{border-bottom:none}
.dre-row.sub{padding:6px 24px;background:var(--faint)}
.dre-row.total{background:var(--bg4);padding:10px 16px}
.dre-lbl{font-size:12px;color:var(--muted);font-weight:600}
.dre-lbl.main{font-size:13px;color:var(--text);font-weight:700}
.dre-lbl.sub{font-size:11px;color:var(--muted)}
.dre-val{font-size:13px;font-weight:800}
.dre-val.pos{color:var(--mint)}
.dre-val.neg{color:var(--red)}
.dre-val.neu{color:var(--text)}
.dre-val.big{font-size:20px;font-weight:900}

/* ── FORMS ── */
.input{background:var(--bg0);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;font-size:14px;width:100%;font-family:'Nunito',sans-serif;outline:none;transition:.15s}
.input:focus{border-color:var(--mintbd);box-shadow:0 0 0 3px rgba(78,204,163,.08)}
.input option{background:var(--bg1)}
.label{font-size:10px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea.input{resize:vertical;min-height:70px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;transition:.12s}
.btn:active{opacity:.75}
.btn-pri{background:var(--mint);color:#060D08}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}
.fbrow{display:flex;gap:8px}

/* ── CHIPS ── */
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s;background:var(--bg4);color:var(--muted)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-mint{background:var(--mintbg);color:var(--mint);border:1px solid var(--mintbd)}
.b-red{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}
.b-gold{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbd)}
.b-blue{background:rgba(91,156,248,.1);color:var(--blue);border:1px solid rgba(91,156,248,.25)}
.b-muted{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}

/* ── PROGRESS ── */
.pbar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:4px 0}
.pbar-fill{height:5px;border-radius:3px;transition:width .5s}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(6px)}
.sheet{background:var(--bg1);border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88dvh}}
.sh-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.sh-title{font-size:17px;font-weight:900;letter-spacing:-.3px}
.sh-sub{font-size:11px;color:var(--muted);margin-top:2px}
.xbtn{width:30px;height:30px;border:none;border-radius:8px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── MISC ── */
.row{display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty-ico{font-size:44px;margin-bottom:10px}
.reminder{background:var(--goldbg);border:1px solid var(--goldbd);border-radius:11px;padding:10px 12px;margin-bottom:7px}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--bg4);color:var(--text);padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.25s;z-index:999;pointer-events:none;border:1px solid var(--border);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:640px){#toast{bottom:24px}}
#sync-dot,#sync-dot-m{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.sd-ok{background:var(--mint)}
.sd-syncing{background:var(--gold);animation:blink .7s infinite}
.sd-err{background:var(--red)}
.sd-local{background:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->

    <div class="sb-header">

  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- TOP BAR -->
    <div id="topbar">

        <button class="tb-btn" style="background:var(--bg3);color:var(--muted);border:1px solid var(--border)" onclick="exportExcel()">⬇️</button>
        <button class="tb-btn" style="background:var(--mint);color:#060D08" onclick="openModal('add')">＋ Novo</button>
      </div>
    </div>

    <!-- MONTH NAV -->
    <div id="monthnav">
      <div class="mn-year">
        <button class="mn-year-btn" onclick="changeYear(-1)">‹</button>
        <span class="mn-year-lbl" id="yearLbl">2026</span>
        <button class="mn-year-btn" onclick="changeYear(1)">›</button>
      </div>
      <div class="mn-months" id="monthBtns"></div>
    </div>

    <!-- MOBILE TABS -->
    <div id="mobtabs">
      <button class="mt-tab active" onclick="nav('home',this)">📊 DRE</button>
      <button class="mt-tab" onclick="nav('gastos',this)">📈 Grupos</button>
      <button class="mt-tab" onclick="nav('list',this)">📋 Lançamentos</button>
      <button class="mt-tab" onclick="nav('faturas',this)">💳 Faturas</button>
      <button class="mt-tab" onclick="nav('saldos',this)">🏦 Saldos</button>
      <button class="mt-tab" onclick="nav('fixas',this)">📌 Fixas</button>
    </div>

    <!-- CONTENT -->
    <div id="content"><div class="empty"><div class="empty-ico">⏳</div><p>Carregando...</p></div></div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="botnav">
    <button class="bn-item active" onclick="nav('home',this)"><span class="bn-ico">📊</span>DRE</button>
    <button class="bn-item" onclick="nav('gastos',this)"><span class="bn-ico">📈</span>Grupos</button>
    <button class="bn-item" onclick="nav('list',this)"><span class="bn-ico">📋</span>Lançamentos</button>
    <button class="bn-item" onclick="nav('faturas',this)"><span class="bn-ico">💳</span>Faturas</button>
    <button class="bn-item" onclick="nav('saldos',this)"><span class="bn-ico">🏦</span>Saldos</button>
    <button class="bn-item" onclick="openModal('add')"><span class="bn-ico">➕</span>Novo</button>
  </div>
</div>

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtBRL(v){return(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fmtDate(d){return d instanceof Date?d.toLocaleDateString("pt-BR"):new Date(d+"T00:00:00").toLocaleDateString("pt-BR")}
function pct(a,b){return b>0?Math.min(100,(a/b)*100):0}
function allGroups(){return[...GROUPS,...S.customGroups]}
function getGroup(cat){if(!cat)return null;const[l]=cat.split(" > ");return allGroups().find(g=>g.l===l)||null}
function getWeek(ds){const d=new Date(ds+"T00:00:00"),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()-day+(day===0?-6:1));return m.toISOString().slice(0,10)}
function wkLabel(w){const d=new Date(w+"T00:00:00"),e=new Date(d);e.setDate(d.getDate()+6);return`${d.getDate()}/${d.getMonth()+1}–${e.getDate()}/${e.getMonth()+1}`}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
// invoiceKey = who owns the charges, payKey = when payment is due
function invoiceKey(cardId, chargeYear, chargeMonth){
 return cardId+"__"+chargeYear+"-"+String(chargeMonth+1).padStart(2,"0");
}
function getInvoicePayMonth(card, chargeYear, chargeMonth){
 // returns {year, month} when the invoice is DUE to be paid
 const fakeDate = new Date(chargeYear, chargeMonth, card.closeDay+1);
 const billing = setBilling(card, fakeDate.toISOString().slice(0,10));
 return {year: billing.payDate.getFullYear(), month: billing.payDate.getMonth()};
}
function getCardDates(card,ds){
 const d=new Date(ds+"T00:00:00"),mk=monthKey(d.getFullYear(),d.getMonth());
 const ov=S.cardDateOverrides?.[card.id]?.[mk];
 return{closeDay:ov?.closeDay||card.closeDay,payDay:ov?.payDay||card.payDay};
}
function setBilling(card,ds){
 const{closeDay:cd}=getCardDates(card,ds);
 const d=new Date(ds+"T00:00:00"),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
 let ps,pe;
 if(day<=cd){const pm=m===0?11:m-1,py=m===0?y-1:y;ps=new Date(py,pm,cd+1);pe=new Date(y,m,cd);}
 else{ps=new Date(y,m,cd+1);const nm=m===11?0:m+1,ny=m===11?y+1:y;pe=new Date(ny,nm,cd);}
 const{payDay:pd}=getCardDates(card,ds);
 const payM=pe.getMonth()===11?0:pe.getMonth()+1,payY=pe.getMonth()===11?pe.getFullYear()+1:pe.getFullYear();
 return{start:ps,end:pe,payDate:new Date(payY,payM,pd)};
}
function pKey(s,e){return s.toISOString().slice(0,10)+"__"+e.toISOString().slice(0,10)}
function monthKey(y,m){return`${y}-${String(m+1).padStart(2,"0")}`}

 const cls={ok:"sd-ok",syncing:"sd-syncing",err:"sd-err",local:"sd-local"}[st]||"sd-local";

 ["sync-lbl","sync-lbl-m"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lbl;});
}

let DB=null;
function initFB(){
 try{
  if(FB.apiKey==="COLE_API_KEY"){syncDot("local","modo local");S.loaded=true;render();return;}
  const app=firebase.initializeApp(FB);
  DB=firebase.database(app);
  syncDot("syncing","conectando...");
  DB.ref("kk").on("value",snap=>{
   const d=snap.val();
   if(d){
    if(d.transactions) S.transactions=Object.values(d.transactions);
    if(d.cards) S.cards=Object.values(d.cards);
    if(d.accounts) S.accounts=Object.values(d.accounts);
    if(d.goals) S.goals=d.goals;
    if(d.fixedAccounts) S.fixedAccounts=Object.values(d.fixedAccounts);
    if(d.fixedLogs) S.fixedLogs=d.fixedLogs;
    if(d.balances) S.balances=d.balances;
    if(d.customGroups) S.customGroups=Object.values(d.customGroups);
    if(d.monthStartBalance) S.monthStartBalance=d.monthStartBalance;
    if(d.cardDateOverrides) S.cardDateOverrides=d.cardDateOverrides;
    if(d.billedInvoices) S.billedInvoices=d.billedInvoices;
   } else {
    DB.ref("kk").set({
     transactions:Object.fromEntries(SAMPLE_TX.map(t=>[t.id,t])),
     cards:Object.fromEntries(DEFAULT_CARDS.map(c=>[c.id,c])),
     accounts:Object.fromEntries(DEFAULT_ACCOUNTS.map(a=>[a.id,a])),
     fixedAccounts:Object.fromEntries(FIXED_ACCOUNTS.map(f=>[f.id,f])),
     fixedLogs:{},balances:{},goals:S.goals,customGroups:{}
    });
   }
   S.loaded=true;syncDot("ok","sincronizado");render();
  },()=>{syncDot("err","erro Firebase");S.loaded=true;render();});
 }catch(e){syncDot("err","erro");S.loaded=true;render();}
}
function fbSet(path,data){if(!DB)return;syncDot("syncing","salvando...");DB.ref("kk/"+path).set(data).then(()=>syncDot("ok","sincronizado")).catch(()=>syncDot("err","erro"));}
function fbDel(path){if(DB)DB.ref("kk/"+path).remove();}

// ── HOME ─────────────────────────────────────────────────────
function renderHome(){
 const mt=mTx();
 const mk=monthKey(S.filterYear,S.filterMonth);

 // ── Classify transactions ──────────────────────────────────
 const entradas=mt.filter(t=>t.txType==="entrada");
 const saidasDiretas=mt.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito");
 const invPay=Object.values(S.billedInvoices).filter(inv=>inv.confirmed&&inv.payMonth===S.filterMonth&&inv.payYear===S.filterYear);
 const creditItems=mt.filter(t=>t.method==="Crédito"&&(!t.txType||t.txType==="saida"));

 // ── Totals ─────────────────────────────────────────────────
 const totalEntradas=entradas.reduce((a,b)=>a+b.amount,0);
 const totalInvoices=invPay.reduce((a,b)=>a+b.total,0);
 const totalDiretas=saidasDiretas.reduce((a,b)=>a+b.amount,0);
 const totalSaidas=totalInvoices+totalDiretas;
 const resultado=totalEntradas-totalSaidas;

 // ── Saldo ──────────────────────────────────────────────────
 const totalBal=Object.values(S.balances).reduce((s,b)=>s+(b.value||0),0);
 const saldoInicial=S.monthStartBalance?.[mk]||totalBal;
 const saldoFinal=saldoInicial+resultado;

 // ── Contas fixas lançadas ──────────────────────────────────
 const fixasRows=S.fixedAccounts.map(fa=>{
  const v=S.fixedLogs[fa.id]?.[mk]||0;
  return v?{desc:fa.desc,v}:null;
 }).filter(Boolean);
 const totalFixas=fixasRows.reduce((a,b)=>a+b.v,0);
 const outrasSaidas=saidasDiretas.filter(t=>{
  const fa=S.fixedAccounts.find(f=>t.desc&&t.desc.includes(f.desc));return !fa;
 }).reduce((a,b)=>a+b.amount,0);

 // ── Entradas por tipo ──────────────────────────────────────
 const entradasByType={};
 entradas.forEach(t=>{const k=t.incomeType||"Outros";entradasByType[k]=(entradasByType[k]||0)+t.amount;});

 // ── Cartões ────────────────────────────────────────────────
 // Confirmed invoices by card
 const invByCard={};
 invPay.forEach(inv=>{invByCard[inv.cardId]=(invByCard[inv.cardId]||0)+inv.total;});
 // Unconfirmed credit totals by card (estimated)
 const unconfByCard={};
 creditItems.forEach(t=>{
  if(t.cardId){const key=invoiceKey(t.cardId,S.filterYear,S.filterMonth);
   if(!S.billedInvoices[key])unconfByCard[t.cardId]=(unconfByCard[t.cardId]||0)+t.amount;}
 });
 const pendInvCount=Object.keys(unconfByCard).length;

 // ── Alerts ─────────────────────────────────────────────────
 const alerts=[];
 if(pendInvCount>0)alerts.push(`<div class="reminder"><div class="row"><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ ${pendInvCount} fatura(s) aguardando confirmação</span><button onclick="nav('faturas')" style="background:var(--gold);border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif">Ver →</button></div></div>`);
 if(saldoFinal<0)alerts.push(`<div class="reminder" style="background:var(--redbg);border-color:var(--redbd)"><span style="font-size:12px;font-weight:700;color:var(--red)">🚨 Saldo projetado negativo: ${fmtBRL(saldoFinal)}</span></div>`);
 const ajustes=entradas.filter(t=>(t.incomeType||"").includes("Ajuste"));
 if(ajustes.length)alerts.push(`<div class="reminder"><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ ${ajustes.length} ajuste(s) gerencial(is) pendente(s) de classificação</span></div>`);
 const fixasPend=S.fixedAccounts.filter(fa=>!S.fixedLogs[fa.id]?.[mk]&&fa.fixed);
 if(fixasPend.length)alerts.push(`<div class="reminder"><div class="row"><span style="font-size:12px;font-weight:700;color:var(--gold)">📌 ${fixasPend.length} conta(s) fixa(s) pendente(s)</span><button onclick="nav('fixas')" style="background:none;border:1px solid var(--goldbd);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;color:var(--gold);font-family:'Nunito',sans-serif">Registrar →</button></div></div>`);

 // ── Metas ultrapassadas ────────────────────────────────────
 allGroups().filter(g=>S.goals[g.id]>0).forEach(g=>{
  const spent=mt.filter(t=>getGroup(t.category)?.id===g.id&&(!t.txType||t.txType==="saida")).reduce((a,b)=>a+b.amount,0);
  if(spent>S.goals[g.id])alerts.push(`<div class="reminder" style="background:var(--redbg);border-color:var(--redbd)"><span style="font-size:12px;font-weight:700;color:var(--red)">🚨 Meta ${g.l}: ${fmtBRL(spent)} / ${fmtBRL(S.goals[g.id])}</span></div>`);
 });

 // Entradas children
 const entChld=Object.entries(entradasByType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v}));

 // Cartão crédito children (confirmed invoices)

 saidasDiretas.forEach(t=>{

 const se=document.getElementById("ttSaida"),ee=document.getElementById("ttEntrada");

 if(ee){ee.style.background=type==="entrada"?"var(--accent)":"transparent";ee.style.color=type==="entrada"?"#080F0B":"var(--muted)";}

 // hide card selector for entrada, always use account

 if(type==="entrada"){

  </button>`}).join("");}
 }

   <div class="row"><div><span style="font-size:13px;font-weight:700;color:${_tCrd===c.id?c.color:"var(--text)"}">${escH(c.name)}</span> <span style="font-size:10px;color:var(--muted)">${c.brand} · fecha dia ${c.closeDay}</span></div>${_tCrd===c.id?`<span style="color:${c.color}">✓</span>`:""}</div>
  </button>`).join("");}
  else{wrap.innerHTML=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" style="background:${_tAcc===a.id?a.color+"33":"var(--bg3)"};border:2px solid ${_tAcc===a.id?a.color:"transparent"};border-radius:11px;padding:9px 13px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:var(--bfont)">
   <div class="row"><div><span style="font-size:13px;font-weight:700;color:${_tAcc===a.id?a.color:"var(--text)"}">${escH(a.name)}</span> <span style="font-size:10px;color:var(--muted)">${ow?.e||""} ${ow?.l||""}</span></div>${_tAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div>

function txCard(id){_tCrd=id;S.cards.forEach(c=>{const b=document.getElementById("crd_"+c.id);if(b){b.style.background=c.id===id?c.color+"33":"var(--bg3)";b.style.borderColor=c.id===id?c.color:"transparent";}});updateBillingInfo();}

 if(_tM==="Crédito"&&card&&dateEl?.value){

function calcInst(){

function submitTx(eid,eOwner){
 const date=document.getElementById("txDate")?.value||todayStr();

// ── CLOSING MODAL ───────────────────────────────────────────
function buildClosingModal(){
 const mt=mTx();
 const nonCreditMt=mt.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito");
 const invPayC=Object.values(S.billedInvoices).filter(inv=>inv.confirmed&&inv.payMonth===S.filterMonth&&inv.payYear===S.filterYear);
 const total=nonCreditMt.reduce((a,b)=>a+b.amount,0)+invPayC.reduce((a,b)=>a+b.total,0);
 const byM=["Crédito","Débito","PIX"].map(m=>`<div><div style="font-size:10px;color:var(--muted)">${m}</div><div style="font-size:13px;font-weight:700;color:${m==="Crédito"?"var(--gold)":m==="PIX"?"var(--cyan)":"var(--green)"}">${fmtBRL(mt.filter(t=>t.method===m).reduce((a,b)=>a+b.amount,0))}</div></div>`).join("");
 const oGrid=OWNERS.map(o=>{const v=mt.filter(t=>t.owner===o.id).reduce((a,b)=>a+b.amount,0);return`<div style="background:${o.c}1A;border-radius:10px;padding:10px;border-left:3px solid ${o.c}"><div style="font-size:11px;color:var(--muted)">${o.e} ${o.l}</div><div style="font-size:15px;font-weight:700;color:${o.c}">${fmtBRL(v)}</div><div style="font-size:10px;color:var(--muted)">${total>0?((v/total)*100).toFixed(1):0}%</div></div>`;}).join("");
 const byGrp=allGroups().map(g=>{
  const items=mt.filter(t=>getGroup(t.category)?.id===g.id),spent=items.reduce((a,b)=>a+b.amount,0);if(!spent)return"";
  const goal=S.goals[g.id]||0,bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1];bySub[s]=(bySub[s]||0)+t.amount;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:4px 0;border-top:1px solid rgba(255,255,255,.05)"><span style="font-size:11px;color:var(--muted)">↳ ${escH(s)}</span><div><span style="font-size:11px;font-weight:600">${fmtBRL(v)}</span><span style="font-size:10px;color:var(--muted);margin-left:4px">(${spent>0?((v/spent)*100).toFixed(0):0}%)</span></div></div>`).join("");
  const pbar=goal>0?`<div class="pbar"><div class="pbar-fill" style="width:${pct(spent,goal)}%;background:${pct(spent,goal)>=100?"var(--red)":g.c}"></div></div><div class="row" style="margin-top:3px"><span style="font-size:10px;color:var(--muted)">${pct(spent,goal).toFixed(0)}% da meta</span><span style="font-size:10px;color:${spent>goal?"var(--red)":"var(--green)"}">${spent>goal?"▲ +"+fmtBRL(spent-goal)+" acima":"✓ −"+fmtBRL(goal-spent)}</span></div>`:"";
  return`<div style="background:var(--bg3);border-radius:11px;padding:13px;margin-bottom:9px"><div class="row" style="margin-bottom:5px"><span style="font-weight:700;color:${g.c}">${g.l}</span><div><span style="font-weight:800;font-size:15px">${fmtBRL(spent)}</span>${goal>0?`<span style="font-size:10px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}</div></div>${pbar}<div style="margin-top:8px">${subRows}</div></div>`;
 }).join("");

let _aiOwner="kelvin",_aiCard=null,_aiRes=null;
function buildAIModal(){

function aiOwner(id){_aiOwner=id;OWNERS.forEach(o=>{const b=document.getElementById("aio_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg3)";b.style.borderColor=o.id===id?o.c:"transparent";}})}

async function aiParse(){
 const text=document.getElementById("aiTxt")?.value||"";if(!text.trim())return;
 const btn=document.getElementById("aiBtn");btn.textContent="Analisando...";btn.disabled=true;
 document.getElementById("aiErr").style.display="none";
 const catList=allGroups().flatMap(g=>(g.subs||[]).map(s=>`${g.l} > ${s}`)).join(", ");
 try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,
    system:`Extraia lançamentos financeiros. APENAS JSON sem markdown. Formato: {"transactions":[{"date":"YYYY-MM-DD","desc":"descrição curta","amount":0.00,"category":"categoria exata","method":"Crédito|Débito|PIX|Dinheiro|TED"}]}. Categorias disponíveis: ${catList}. Se data não clara use ${todayStr()}. Amount positivo em reais.`,
    messages:[{role:"user",content:text}]})});
  const data=await res.json();
  const raw=data.content?.find(b=>b.type==="text")?.text||"";
  const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
  _aiRes=parsed.transactions||[];
  const resDiv=document.getElementById("aiRes");resDiv.style.display="block";
  resDiv.innerHTML=`<div style="font-size:12px;color:var(--green);margin-bottom:5px">✓ ${_aiRes.length} lançamento(s):</div>`+
   _aiRes.map(t=>{const g=getGroup(t.category);return`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px"><span>${escH(t.desc)} <span style="font-size:10px;color:${g?.c||"var(--muted)"}">${escH(t.category?.split(" > ")[1]||"")}</span></span><span style="color:var(--green);font-weight:700">${fmtBRL(t.amount)}</span></div>`;}).join("");
  document.getElementById("aiConfBtn").style.display="block";
 }catch(e){const err=document.getElementById("aiErr");err.style.display="block";err.textContent="Não consegui interpretar. Tente colar melhor o texto.";}
 btn.textContent="🔍 Analisar";btn.disabled=false;
}
function aiConfirm(){
 if(!_aiRes)return;
 _aiRes.forEach(t=>saveTx({...t,id:gid(),owner:_aiOwner,cardId:t.method==="Crédito"?_aiCard:null,accountId:t.method!=="Crédito"?"ac1":null,notes:"Importado via IA",installments:null,fixed:false}));
 closeModal();toast(`✓ ${_aiRes.length} lançamentos importados`);
}

// ── EXCEL EXPORT ─────────────────────────────────────────────
function exportExcel(){
 if(typeof XLSX==="undefined"){toast("⚠️ Aguarde o carregamento do SheetJS");return;}
 const wb=XLSX.utils.book_new();
 const headers=["Data","Descrição","Responsável","Grupo","Subcategoria","Categoria Completa","Método","Conta/Cartão","Valor (R$)","Parcela Atual","Total Parcelas","Valor Total Parc.","Fixo?","Observação"];
 const rows=S.transactions.map(t=>{
  const g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  const acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;
  const owLabel=OWNERS.find(o=>o.id===t.owner)?.l||t.owner;
  return[
   t.date,t.desc,owLabel,g?.l||"",sub||"",t.category||"",t.method,
   card?card.name:acc?`${acc.name} (${OWNERS.find(o=>o.id===acc.owner)?.l||""})` :"",
   t.amount,
   t.installments?.current||"",t.installments?.total||"",t.installments?.totalValue||"",
   t.fixed?"Sim":"Não",t.notes||""
  ];
 });
 const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
 ws["!cols"]=headers.map((_,i)=>({wch:[12,32,12,22,22,42,10,22,12,12,14,16,8,28][i]||14}));
 XLSX.utils.book_append_sheet(wb,ws,"📋 Lançamentos");
 // Summary sheet
 const today=new Date(),m=today.getMonth(),y=today.getFullYear();
 const mTxNow=S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===m&&d.getFullYear()===y});
 const sumHeaders=["Grupo","Gasto Mês Atual (R$)","Meta (R$)","% da Meta"];
 const sumRows=allGroups().map(g=>{
  const spent=mTxNow.filter(t=>getGroup(t.category)?.id===g.id).reduce((a,b)=>a+b.amount,0);
  const goal=S.goals[g.id]||0;
  return[g.l,spent,goal,goal>0?Math.round((spent/goal)*100)+"%":"—"];
 });
 const ws2=XLSX.utils.aoa_to_sheet([sumHeaders,...sumRows]);
 XLSX.utils.book_append_sheet(wb,ws2,"📊 Resumo Mês");
 // Fixed accounts sheet
 const mk=monthKey(y,m);
 const faHeaders=["Conta","Responsável","Vencimento","Valor Fixo","Mês Atual","Status"];
 const faRows=S.fixedAccounts.map(fa=>{
  const ow=OWNERS.find(x=>x.id===fa.resp)?.l||fa.resp;
  const log=S.fixedLogs[fa.id]?.[mk];
  return[fa.desc,ow,fa.venc,fa.valor,log||"—",log?"✓ Lançado":"⚠️ Pendente"];
 });
 const ws3=XLSX.utils.aoa_to_sheet([faHeaders,...faRows]);
 XLSX.utils.book_append_sheet(wb,ws3,"📌 Contas Fixas");
 XLSX.writeFile(wb,`Financas_KK_${y}-${String(m+1).padStart(2,"0")}.xlsx`);
 toast("✓ Excel exportado com sucesso!");
}

// ── EXCEL IMPORT ─────────────────────────────────────────────
function buildImportExcelModal(){
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="shdr"><div class="stitle">⬆️ Importar Excel</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Selecione o arquivo Excel exportado por este app ou preenchido na aba <b style="color:var(--text)">⬆️ Importar</b> do template.</p>
  <input type="file" id="xlFile" accept=".xlsx,.xls" style="display:none" onchange="processXL(this)">
  <button class="btn btn-pri" onclick="document.getElementById('xlFile').click()" style="width:100%;margin-bottom:10px">📂 Selecionar arquivo Excel</button>
  <div id="xlStatus" style="font-size:12px;color:var(--muted);text-align:center"></div>
 </div></div>`;
}
function processXL(input){
 const file=input.files[0];if(!file)return;
 document.getElementById("xlStatus").textContent="Lendo arquivo...";
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
   // try "⬆️ Importar" first, then "📋 Lançamentos"
   let sheetName=wb.SheetNames.find(n=>n.includes("Importar")||n.includes("Lançamentos"));
   if(!sheetName){document.getElementById("xlStatus").textContent="❌ Aba de lançamentos não encontrada.";return;}
   const ws=wb.Sheets[sheetName];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
   // find header row
   let hIdx=rows.findIndex(r=>r.some(c=>String(c).includes("Data")));
   if(hIdx<0)hIdx=0;
   const dataRows=rows.slice(hIdx+1).filter(r=>r[0]&&r[1]);
   let imported=0;
   dataRows.forEach(r=>{
    const date=String(r[0]||"").trim();
    const desc=String(r[1]||"").trim();
    const ownerLabel=String(r[2]||"").trim();
    const cat=String(r[5]||r[3]||"").trim();
    const method=String(r[6]||"PIX").trim();
    const amount=parseFloat(String(r[8]||"0").replace(",","."))||0;
    const instCurr=parseInt(r[9])||null;
    const instTot=parseInt(r[10])||null;
    const instTotal=parseFloat(String(r[11]||"0").replace(",","."))||null;
    const fixed=String(r[12]||"").toLowerCase()==="sim";
    const notes=String(r[13]||"").trim();
    if(!date||!desc||!amount)return;
    const ownerId=OWNERS.find(o=>o.l.toLowerCase()===ownerLabel.toLowerCase())?.id||"outros";
    const installments=(instCurr&&instTot)?{current:instCurr,total:instTot,totalValue:instTotal||amount*instTot}:null;
    const tx={id:gid(),date:normalizeDate(date),desc,owner:ownerId,category:cat,method,
     cardId:null,accountId:"ac1",notes,installments,fixed,amount};
    saveTx(tx);imported++;
   });
   document.getElementById("xlStatus").textContent=`✓ ${imported} lançamento(s) importado(s)`;
   setTimeout(()=>{closeModal();toast(`✓ ${imported} lançamentos importados`);},1500);
  }catch(err){document.getElementById("xlStatus").textContent="❌ Erro ao ler o arquivo. Verifique o formato.";}
 };
 reader.readAsArrayBuffer(file);
}
function normalizeDate(d){
 if(!d)return todayStr();
 const s=String(d).trim();
 if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[dd,mm,yyyy]=s.split("/");return`${yyyy}-${mm}-${dd}`;}
 if(/^\d{2}\/\d{2}\/\d{2}$/.test(s)){const[dd,mm,yy]=s.split("/");return`20${yy}-${mm}-${dd}`;}
 try{const dt=new Date(s);if(!isNaN(dt))return dt.toISOString().slice(0,10);}catch{}
 return todayStr();
}
