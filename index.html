*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;background:#060D08;color:#E2F0E8;-webkit-font-smoothing:antialiased}
:root{
  --bg0:#060D08;--bg1:#0C1610;--bg2:#111F15;--bg3:#172A1B;--bg4:#1D3422;
  --border:#1F3826;--text:#E2F0E8;--muted:#6B9070;--faint:#0F1C12;
  --mint:#4ECCA3;--mint2:#2EBD8A;--mintbg:rgba(78,204,163,.10);--mintbd:rgba(78,204,163,.22);
  --red:#F06B6B;--redbg:rgba(240,107,107,.10);--redbd:rgba(240,107,107,.22);
  --gold:#F5C842;--goldbg:rgba(245,200,66,.10);--goldbd:rgba(245,200,66,.22);
  --blue:#5B9CF8;--pink:#F07DB0;--purple:#A87EF8;--orange:#F0883C;
  --r:12px;--r2:18px;
}
#app{display:flex;height:100dvh;overflow:hidden}
/* SIDEBAR */
#sidebar{width:215px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
@media(max-width:639px){#sidebar{display:none}}
.sb-top{padding:16px 14px 10px;border-bottom:1px solid var(--border)}
.sb-logo{font-size:18px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.sb-logo em{color:var(--mint);font-style:normal}
.sb-sync{font-size:10px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.sb-sec{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;padding:12px 14px 4px}
.sb-nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border:none;background:none;color:var(--muted);font-size:13px;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;text-align:left;transition:.15s;font-weight:600;border-left:3px solid transparent}
.sb-nav-item:hover{background:var(--bg3);color:var(--text)}
.sb-nav-item.active{background:var(--mintbg);color:var(--mint);border-left-color:var(--mint)}
.sb-nav-item .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sb-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg2)}
/* TOPBAR */
#topbar{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg1);gap:8px}
.tb-title{font-size:15px;font-weight:900;letter-spacing:-.3px;flex:1}
.tb-btn{height:34px;padding:0 13px;border-radius:9px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.tb-btn.pri{background:var(--mint);color:#060D08}
.tb-btn.ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
/* MONTH NAV */
#monthnav{display:flex;align-items:center;padding:8px 12px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);gap:8px;overflow-x:auto;scrollbar-width:none}
#monthnav::-webkit-scrollbar{display:none}
.mn-yr{display:flex;align-items:center;gap:4px;flex-shrink:0}
.mn-yr-btn{width:24px;height:24px;border:none;border-radius:6px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif}
.mn-yr-lbl{font-size:13px;font-weight:800;color:var(--text);min-width:38px;text-align:center}
.mn-months{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.mn-months::-webkit-scrollbar{display:none}
.mn-m{padding:5px 11px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:none;color:var(--muted);transition:.15s;white-space:nowrap;font-family:'Nunito',sans-serif}
.mn-m.active{background:var(--mint);color:#060D08}
.mn-m:hover:not(.active){background:var(--bg4);color:var(--text)}
/* MOBILE TABS */
#mobtabs{display:none;background:var(--bg1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;padding:6px 10px;gap:4px}
#mobtabs::-webkit-scrollbar{display:none}
@media(max-width:639px){#mobtabs{display:flex}}
.mt-tab{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:none;color:var(--muted);white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s}
.mt-tab.active{background:var(--mintbg);color:var(--mint)}
/* SCROLL */
#content{flex:1;overflow-y:auto;padding:14px 14px 80px}
@media(min-width:640px){#content{padding:16px 20px 40px}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* BOTTOM NAV */
#botnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--border);z-index:100;padding:4px 0 env(safe-area-inset-bottom)}
@media(max-width:639px){#botnav{display:flex}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;font-family:'Nunito',sans-serif;font-weight:600;transition:.15s}
.bn-item.active{color:var(--mint)}
.bn-ico{font-size:18px;line-height:1}
/* CARDS */
.card{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);padding:14px;margin-bottom:10px}
.card-sm{background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);padding:10px 12px;margin-bottom:6px}
.card-in{background:var(--bg4);border-radius:9px;padding:9px 11px;margin-bottom:5px}
.sec{font-size:9px;font-weight:800;color:var(--mint2);text-transform:uppercase;letter-spacing:1.2px;margin:16px 0 7px}
/* DRE */
.dre{background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.dre-hdr{background:linear-gradient(135deg,#0A2218,#071510);padding:14px 15px;border-bottom:1px solid var(--border)}
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border)}
.dre-row:last-child{border-bottom:none}
.dre-row.sub{padding:7px 14px 7px 36px;background:var(--faint)}
.dre-row.tot{background:var(--bg4);padding:10px 14px}
.dre-row.clickable{cursor:pointer;transition:.12s}
.dre-row.clickable:hover{background:var(--bg4)}
.dre-lbl{font-size:12px;color:var(--muted);font-weight:600}
.dre-lbl.h{font-size:13px;color:var(--text);font-weight:700}
.dre-lbl.s{font-size:11px;color:var(--muted)}
.dre-val{font-size:13px;font-weight:800;flex-shrink:0;margin-left:8px}
.pos{color:var(--mint)}.neg{color:var(--red)}.neu{color:var(--text)}
.big{font-size:20px;font-weight:900}
/* PROGRESS */
.pbar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:4px 0}
.pbar-fill{height:5px;border-radius:3px;transition:width .5s}
/* FORM */
.input{background:var(--bg0);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;font-size:14px;width:100%;font-family:'Nunito',sans-serif;outline:none;transition:.15s}
.input:focus{border-color:var(--mintbd);box-shadow:0 0 0 3px rgba(78,204,163,.07)}
.input option{background:var(--bg1)}
.lbl{font-size:10px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
textarea.input{resize:vertical;min-height:65px}
/* BUTTONS */
.btn{border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;flex:1;font-family:'Nunito',sans-serif;transition:.12s;text-align:center}
.btn:active{opacity:.75}
.btn-pri{background:var(--mint);color:#060D08}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}
.btn-gold{background:var(--gold);color:#060D08}
.fbrow{display:flex;gap:8px;margin-top:14px}
/* TOGGLE TYPE */
.type-toggle{display:flex;background:var(--bg0);border-radius:11px;padding:3px;border:1px solid var(--border)}
.type-opt{flex:1;padding:9px;border-radius:9px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.type-opt.saida-on{background:var(--red);color:#fff}
.type-opt.entrada-on{background:var(--mint);color:#060D08}
.type-opt.off{background:none;color:var(--muted)}
/* CHIPS */
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;font-family:'Nunito',sans-serif;transition:.15s;background:var(--bg4);color:var(--muted)}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-mint{background:var(--mintbg);color:var(--mint);border:1px solid var(--mintbd)}
.b-red{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}
.b-gold{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbd)}
.b-blue{background:rgba(91,156,248,.1);color:var(--blue);border:1px solid rgba(91,156,248,.25)}
.b-muted{background:var(--bg4);color:var(--muted);border:1px solid var(--border)}
.b-terceiro{background:rgba(168,126,248,.15);color:var(--purple);border:1px solid rgba(168,126,248,.3)}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(6px)}
.sheet{background:var(--bg1);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:93dvh;overflow-y:auto}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88dvh}}
.sh-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.sh-title{font-size:17px;font-weight:900;letter-spacing:-.3px}
.sh-sub{font-size:11px;color:var(--muted);margin-top:2px}
.xbtn{width:30px;height:30px;border:none;border-radius:8px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Nunito',sans-serif}
/* MISC */
.row{display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty-ico{font-size:44px;margin-bottom:10px}
.reminder{background:var(--goldbg);border:1px solid var(--goldbd);border-radius:11px;padding:10px 12px;margin-bottom:8px}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--bg3);color:var(--text);padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.25s;z-index:999;pointer-events:none;border:1px solid var(--border);white-space:nowrap;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:640px){#toast{bottom:24px}}
.sd{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;transition:background .3s}
.sd-ok{background:var(--mint)}.sd-syncing{background:var(--gold);animation:blink .7s infinite}
.sd-err{background:var(--red)}.sd-local{background:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

// ── UTILS ────────────────────────────────────────────────────
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtBRL(v){return(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fmtDate(d){if(!d)return"";try{return new Date((d instanceof Date?d:d+"T00:00:00")).toLocaleDateString("pt-BR")}catch{return d}}
function pct(a,b){return b>0?Math.min(100,(a/b)*100):0}
function monthKey(y,m){return`${y}-${String(m+1).padStart(2,"0")}`}
function allGroups(){return[...DEFAULT_GROUPS,...S.customGroups]}
function getGroup(cat){if(!cat)return null;const[l]=cat.split(" > ");return allGroups().find(g=>g.l===l)||null}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function mTx(){return S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===S.filterMonth&&d.getFullYear()===S.filterYear})}

// ── INVOICE HELPERS ──────────────────────────────────────────
function invoiceKey(cardId,cy,cm){return`${cardId}__${cy}-${String(cm+1).padStart(2,"0")}`}
function getCardDates(card,ds){
 const d=new Date(ds+"T00:00:00"),mk=monthKey(d.getFullYear(),d.getMonth());
 const ov=S.cardDateOverrides?.[card.id]?.[mk];
 return{closeDay:ov?.closeDay||card.closeDay,payDay:ov?.payDay||card.payDay};
}
function setBilling(card,ds){
 const{closeDay:cd,payDay:pd}=getCardDates(card,ds);
 const d=new Date(ds+"T00:00:00"),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
 let ps,pe;
 if(day<=cd){const pm=m===0?11:m-1,py=m===0?y-1:y;ps=new Date(py,pm,cd+1);pe=new Date(y,m,cd);}
 else{ps=new Date(y,m,cd+1);const nm=m===11?0:m+1,ny=m===11?y+1:y;pe=new Date(ny,nm,cd);}
 const payM=pe.getMonth()===11?0:pe.getMonth()+1,payY=pe.getMonth()===11?pe.getFullYear()+1:pe.getFullYear();
 return{start:ps,end:pe,payDate:new Date(payY,payM,pd)};
}
function getInvoicePayMonth(card,cy,cm){
 const fakeDate=new Date(cy,cm,card.closeDay+1);
 const b=setBilling(card,fakeDate.toISOString().slice(0,10));
 return{year:b.payDate.getFullYear(),month:b.payDate.getMonth()};
}

// ── FIREBASE ────────────────────────────────────────────────
let DB=null;
function syncDot(st,lbl){
 const cls={ok:"sd-ok",syncing:"sd-syncing",err:"sd-err",local:"sd-local"}[st]||"sd-local";
 ["sync-dot","sync-dot-m"].forEach(id=>{const el=document.getElementById(id);if(el)el.className="sd "+cls;});
 ["sync-lbl"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lbl;});
}
function fbSet(path,data){if(!DB)return;syncDot("syncing","salvando...");DB.ref("kk/"+path).set(data).then(()=>syncDot("ok","sincronizado")).catch(()=>syncDot("err","erro ao salvar"));}
function fbDel(path){if(DB)DB.ref("kk/"+path).remove();}

function initFB(){
 try{
  const app=firebase.initializeApp(FB);
  DB=firebase.database(app);
  syncDot("syncing","conectando...");
  DB.ref("kk").on("value",snap=>{
   const d=snap.val();
   if(d){
    if(d.transactions)S.transactions=Object.values(d.transactions);else S.transactions=[];
    if(d.cards)S.cards=Object.values(d.cards);
    if(d.accounts)S.accounts=Object.values(d.accounts);
    if(d.goals)S.goals=d.goals;
    if(d.fixedAccounts)S.fixedAccounts=Object.values(d.fixedAccounts);
    if(d.fixedLogs)S.fixedLogs=d.fixedLogs;
    if(d.fixedSkips)S.fixedSkips=d.fixedSkips;
    if(d.balances)S.balances=d.balances;
    if(d.billedInvoices)S.billedInvoices=d.billedInvoices;
    if(d.monthStartBalance)S.monthStartBalance=d.monthStartBalance;
    if(d.cardDateOverrides)S.cardDateOverrides=d.cardDateOverrides;
    if(d.customGroups)S.customGroups=Object.values(d.customGroups);
    if(d.establishments)S.establishments=Object.values(d.establishments);
   } else {
    DB.ref("kk").set({
     transactions:{},cards:Object.fromEntries(DEFAULT_CARDS.map(c=>[c.id,c])),
     accounts:Object.fromEntries(DEFAULT_ACCOUNTS.map(a=>[a.id,a])),
     fixedAccounts:Object.fromEntries(DEFAULT_FIXED.map(f=>[f.id,f])),
     fixedLogs:{},fixedSkips:{},balances:{},billedInvoices:{},
     monthStartBalance:{},goals:{},customGroups:{},establishments:{},cardDateOverrides:{}
    });
   }
   S.loaded=true;syncDot("ok","sincronizado");render();
  },()=>{syncDot("err","erro Firebase");S.loaded=true;render();});
 }catch(e){syncDot("err","erro");S.loaded=true;render();}
}

// ── RENDER HOME (DRE) ────────────────────────────────────────
function renderHome(){
 const mt=mTx(),mk=monthKey(S.filterYear,S.filterMonth);
 const entradas=mt.filter(t=>t.txType==="entrada");
 const saidasDir=mt.filter(t=>(!t.txType||t.txType==="saida")&&t.method!=="Crédito");
 const invPay=Object.values(S.billedInvoices).filter(i=>i.confirmed&&i.payMonth===S.filterMonth&&i.payYear===S.filterYear);
 const totalEntradas=entradas.reduce((a,b)=>a+b.amount,0);
 const totalInv=invPay.reduce((a,b)=>a+b.total,0);
 const totalDir=saidasDir.reduce((a,b)=>a+b.amount,0);
 const totalSaidas=totalInv+totalDir;
 const resultado=totalEntradas-totalSaidas;
 const saldoInicial=S.monthStartBalance?.[mk]||Object.values(S.balances).reduce((s,b)=>s+(b.value||0),0);
 const saldoFinal=saldoInicial+resultado;
 // Entradas by type
 const entByType={};entradas.forEach(t=>{const k=t.incomeType||"Outros";entByType[k]=(entByType[k]||0)+t.amount;});
 // Cards
 const invByCard={};invPay.forEach(inv=>{invByCard[inv.cardId]=(invByCard[inv.cardId]||0)+inv.total;});
 const unconfByCard={};
 mt.filter(t=>t.method==="Crédito"&&(!t.txType||t.txType==="saida")).forEach(t=>{
  if(t.cardId){const key=invoiceKey(t.cardId,S.filterYear,S.filterMonth);if(!S.billedInvoices[key])unconfByCard[t.cardId]=(unconfByCard[t.cardId]||0)+t.amount;}
 });
 // Contas fixas
 const fixasRows=S.fixedAccounts.filter(fa=>!S.fixedSkips?.[fa.id]?.[mk]).map(fa=>{const v=S.fixedLogs[fa.id]?.[mk]||0;return v?{label:fa.desc,value:v}:null;}).filter(Boolean);
 const totalFixas=fixasRows.reduce((a,b)=>a+b.value,0);
 // Outras (non-fixed direct)
 const fixaDescs=new Set(S.fixedAccounts.map(fa=>fa.desc));
 const outrasGrp={};
 saidasDir.forEach(t=>{if(!fixaDescs.has(t.desc)){const g=getGroup(t.category);const k=g?g.l:"📦 Outros";outrasGrp[k]=(outrasGrp[k]||0)+t.amount;}});
 const totalOutras=Object.values(outrasGrp).reduce((a,b)=>a+b,0);
 const outrasChld=Object.entries(outrasGrp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v}));
 // Pending
 const pendInv=Object.keys(unconfByCard).length;
 const fixaPend=S.fixedAccounts.filter(fa=>fa.active!==false&&!S.fixedLogs[fa.id]?.[mk]&&!S.fixedSkips?.[fa.id]?.[mk]);
 const ajustes=entradas.filter(t=>(t.incomeType||"").includes("Ajuste"));
 const ownerRows=OWNERS.slice(0,3).map(o=>{
  const vD=saidasDir.filter(t=>t.owner===o.id).reduce((a,b)=>a+b.amount,0);
  const vI=invPay.filter(inv=>{const c=S.cards.find(x=>x.id===inv.cardId);return c&&c.owner===o.id;}).reduce((a,b)=>a+b.total,0);
  return{...o,total:vD+vI};
 }).filter(o=>o.total>0);
 const alerts=[];
 if(pendInv>0)alerts.push(`<div class="reminder row"><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ ${pendInv} fatura(s) para confirmar</span><button onclick="nav('faturas')" style="background:var(--gold);border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif">Ver →</button></div>`);
 if(saldoFinal<0)alerts.push(`<div class="reminder" style="background:var(--redbg);border-color:var(--redbd)"><span style="font-size:12px;font-weight:700;color:var(--red)">🚨 Saldo projetado negativo: ${fmtBRL(saldoFinal)}</span></div>`);
 if(ajustes.length)alerts.push(`<div class="reminder"><span style="font-size:12px;font-weight:700;color:var(--gold)">⚠️ ${ajustes.length} ajuste(s) gerencial(is) pendente(s)</span></div>`);
 if(fixaPend.length)alerts.push(`<div class="reminder row"><span style="font-size:12px;font-weight:700;color:var(--gold)">📌 ${fixaPend.length} conta(s) fixa(s) pendente(s)</span><button onclick="nav('fixas')" style="background:none;border:1px solid var(--goldbd);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;color:var(--gold);font-family:'Nunito',sans-serif">Registrar →</button></div>`);
 allGroups().filter(g=>S.goals[g.id]>0).forEach(g=>{const sp=mt.filter(t=>getGroup(t.category)?.id===g.id&&(!t.txType||t.txType==="saida")).reduce((a,b)=>a+b.amount,0);if(sp>S.goals[g.id])alerts.push(`<div class="reminder" style="background:var(--redbg);border-color:var(--redbd)"><span style="font-size:12px;font-weight:700;color:var(--red)">🚨 Meta ${g.l}: ${fmtBRL(sp)} / ${fmtBRL(S.goals[g.id])}</span></div>`);});
 const cardChld=[
  ...Object.entries(invByCard).map(([cid,v])=>{const c=S.cards.find(x=>x.id===cid);return{label:`${c?c.name:""} ${OWNERS.find(o=>o.id===c?.owner)?.e||""} — fatura confirmada`,value:v};}),
  ...Object.entries(unconfByCard).map(([cid,v])=>{const c=S.cards.find(x=>x.id===cid);return{label:`${c?c.name:""} — estimado (não confirmado)`,value:v};}),
 ];
 const totalCartao=totalInv+Object.values(unconfByCard).reduce((a,b)=>a+b,0);
 return`

     <div style="font-size:22px;font-weight:900;color:${saldoFinal>=0?"var(--mint)":"var(--red)"}">${fmtBRL(saldoFinal)}</div></div>
   </div>
  </div>
  <div class="dre-row tot" style="border-bottom:1px solid var(--border)">
   <span class="dre-lbl h">Resultado do mês</span>
   <span class="dre-val big ${resultado>=0?"pos":"neg"}">${resultado>=0?"+":""}${fmtBRL(resultado)}</span>

  <div class="dre-row" style="background:var(--faint);border-top:1px solid var(--border)">
   <div style="display:flex;align-items:center;gap:6px"><span style="width:14px;display:inline-block"></span><span class="dre-lbl h">🔴 Total de Saídas</span></div>
   <span class="dre-val neg">${fmtBRL(totalSaidas)}</span>
  </div>
  ${totalCartao>0?dreBlock("💳","Cartão de Crédito",totalCartao,"neg",cardChld):""}
  ${totalFixas>0?dreBlock("📌","Contas Fixas",totalFixas,"neg",fixasRows):""}

 </div>
 ${ownerRows.length?`<div class="sec">👥 Por responsável — saídas</div>${ownerRows.map(o=>{const p=totalSaidas>0?Math.round((o.total/totalSaidas)*100):0;return`<div class="card-in"><div class="row" style="margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:${o.c}">${o.e} ${o.l}</span><div><span style="font-size:14px;font-weight:800;color:var(--red)">${fmtBRL(o.total)}</span><span style="font-size:11px;color:var(--muted);margin-left:5px">${p}%</span></div></div><div class="pbar"><div class="pbar-fill" style="width:${p}%;background:${o.c}"></div></div></div>`;}).join("")}`:""}
 <button onclick="nav('list')" style="background:none;border:1px solid var(--border);border-radius:11px;padding:11px;width:100%;color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px">📋 Ver todos os lançamentos <span style="color:var(--mint)">→</span></button>
 `;
}

// ── RENDER GROUPS ────────────────────────────────────────────
function renderGroups(){
 const mt=mTx();
 const rows=allGroups().map(g=>{
  const items=mt.filter(t=>getGroup(t.category)?.id===g.id&&(!t.txType||t.txType==="saida"));
  const spent=items.reduce((a,b)=>a+b.amount,0);if(!spent)return"";
  const goal=S.goals[g.id]||0;
  const bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1]||"?";bySub[s]=(bySub[s]||0)+t.amount;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:5px 0;border-bottom:1px solid var(--faint)"><span style="font-size:12px;color:var(--muted)">↳ ${escH(s)}</span><span style="font-size:12px;font-weight:700">${fmtBRL(v)}</span></div>`).join("");
  const pbar=goal>0?`<div class="pbar"><div class="pbar-fill" style="width:${pct(spent,goal)}%;background:${pct(spent,goal)>=100?"var(--red)":g.c}"></div></div><div class="row" style="margin-top:3px"><span style="font-size:10px;color:var(--muted)">${pct(spent,goal).toFixed(0)}%</span><span style="font-size:10px;color:${spent>goal?"var(--red)":"var(--mint)"}">${spent>goal?"▲ +"+fmtBRL(spent-goal):"✓ −"+fmtBRL(goal-spent)}</span></div>`:"";
  return`<div class="card" style="padding:0;overflow:hidden"><div style="padding:12px 14px;border-left:4px solid ${g.c}"><div class="row" style="margin-bottom:4px"><span style="font-weight:800;font-size:14px;color:${g.c}">${g.l}</span><div><span style="font-weight:900;font-size:16px">${fmtBRL(spent)}</span>${goal>0?`<span style="font-size:10px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}</div></div>${pbar}</div><div style="padding:8px 14px 12px;background:var(--faint)">${subRows}</div></div>`;
 }).join("");
 return`<div class="row" style="margin-bottom:12px"><div class="sec" style="margin:0">Grupos — ${MONTHS_S[S.filterMonth]}/${S.filterYear}</div><div style="display:flex;gap:7px"><button onclick="openModal('metas')" style="background:none;border:1px solid var(--mintbd);border-radius:8px;color:var(--mint);font-size:11px;padding:5px 10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700">🎯 Metas</button></div></div>${rows||`<div class="empty"><div class="empty-ico">📊</div><p>Nenhum gasto neste mês</p></div>`}`;
}

// ── RENDER LIST ──────────────────────────────────────────────
function renderList(){
 const ft=mTx().sort((a,b)=>b.date.localeCompare(a.date));
 const [filterType,setFilterType]=[null,null]; // could add filter later
 const saidas=ft.filter(t=>!t.txType||t.txType==="saida").reduce((a,b)=>a+b.amount,0);
 const entradas=ft.filter(t=>t.txType==="entrada").reduce((a,b)=>a+b.amount,0);
 if(!ft.length)return`<div class="empty"><div class="empty-ico">📭</div><p>Nenhum lançamento em ${MONTHS_F[S.filterMonth]}</p><button onclick="openModal('add')" style="background:var(--mint);border:none;border-radius:9px;padding:9px 20px;cursor:pointer;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif;margin-top:12px">＋ Novo lançamento</button></div>`;
 return`<p style="font-size:11px;color:var(--muted);margin-bottom:10px">${ft.length} lançamentos · <span style="color:var(--red)">↓${fmtBRL(saidas)}</span> <span style="color:var(--mint)">↑${fmtBRL(entradas)}</span></p>`+
 ft.map(t=>{
  const o=OWNERS.find(x=>x.id===t.owner),g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];
  const isE=t.txType==="entrada",isTer=t.owner==="outros";
  const isAdj=(t.incomeType||"").includes("Ajuste");
  const ib=t.installments?`<span class="badge b-gold">${t.installments.current}/${t.installments.total}x</span>`:"";
  const fb=t.fixed?`<span class="badge b-blue">Fixo</span>`:"";
  const etb=isE?`<span class="badge ${isAdj?"b-gold":"b-mint"}">${isAdj?"⚠️ Ajuste":"🟢 "+escH(t.incomeType||"Entrada")}</span>`:"";
  const terb=isTer&&!isE?`<span class="badge b-terceiro">👤 Terceiro</span>`:"";
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  const acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;
  return`<div class="card-sm" style="cursor:pointer;border-left:3px solid ${isE?isAdj?"var(--gold)":"var(--mint)":isTer?"var(--purple)":g?.c||"var(--border)"}" onclick="editTx('${t.id}')">
   <div class="row"><div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px">
     <span style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">${escH(t.desc)}</span>
     ${ib}${fb}${etb}${terb}
    </div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--muted)">
     <span>${fmtDate(t.date)}</span>
     ${g&&!isE?`<span>·</span><span style="color:${g.c}">${escH(sub||"")}</span>`:""}
     <span>·</span><span style="color:${o?.c}">${o?.e||""} ${o?.l||""}</span>
     ${card?`<span>· 💳 ${escH(card.name)}</span>`:acc?`<span>· 🏦 ${escH(acc.name)}</span>`:""}
    </div>
   </div>
   <span style="font-size:15px;font-weight:800;color:${isE?"var(--mint)":"var(--red)"};margin-left:8px;flex-shrink:0">${isE?"+":"−"}${fmtBRL(t.amount)}</span>
  </div></div>`;
 }).join("");
}

// ── RENDER FIXED (month view) ────────────────────────────────
function renderFixed(){
 const mk=monthKey(S.filterYear,S.filterMonth);
 // Only show active + not skipped this month
 const rows=S.fixedAccounts.filter(fa=>fa.active!==false).map(fa=>{
  const log=S.fixedLogs[fa.id]?.[mk];
  const skip=S.fixedSkips?.[fa.id]?.[mk];
  const pending=!log&&!skip;
  const ow=OWNERS.find(x=>x.id===fa.resp);
  return`<div class="card-sm row" style="cursor:pointer;border-left:3px solid ${pending?"var(--gold)":"var(--mint)"}" onclick="openModal('fixedLog','${fa.id}')">
   <div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:3px"><span style="font-size:13px;font-weight:700">${escH(fa.desc)}</span>${fa.variable?`<span class="badge b-blue">Variável</span>`:""}</div>
    <div style="font-size:11px;color:var(--muted)">Vence dia ${fa.venc} · ${ow?.e||""} ${ow?.l||""}</div>
   </div>
   <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px">
    <span style="font-size:15px;font-weight:800">${skip?"—":log?fmtBRL(log):fa.valor?fmtBRL(fa.valor):"—"}</span>
    <span class="badge ${skip?"b-muted":log?"b-mint":"b-gold"}">${skip?"⊘ Ignorada neste mês":log?"✓ Lançado":"⚠️ Pendente"}</span>
   </div>
  </div>`;}).join("");
 return`<div class="row" style="margin-bottom:12px"><div class="sec" style="margin:0">📌 Fixas — ${MONTHS_F[S.filterMonth]} ${S.filterYear}</div><button onclick="nav('cad_fixas')" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;padding:5px 10px;cursor:pointer;font-family:'Nunito',sans-serif">⚙️ Editar cadastro</button></div>${rows}<p style="font-size:11px;color:var(--muted);margin-top:8px">Toque para registrar o valor ou ignorar no mês.</p>`;
}

// ── RENDER BILLS ─────────────────────────────────────────────
function renderBillsPage(){
 if(!S.cards.length)return`<div class="empty"><div class="empty-ico">💳</div><p>Nenhum cartão cadastrado</p><button onclick="nav('cad_cards')" style="background:var(--mint);border:none;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:700;color:#060D08;font-family:'Nunito',sans-serif;margin-top:12px">Cadastrar cartão</button></div>`;
 const pendingInvoices=[];
 S.cards.forEach(c=>{
  for(let i=2;i>=0;i--){
   let cm=S.filterMonth-i,cy=S.filterYear;if(cm<0){cm+=12;cy--;}
   const key=invoiceKey(c.id,cy,cm);
   const hasTx=S.transactions.some(t=>t.method==="Crédito"&&t.cardId===c.id&&(()=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===cm&&d.getFullYear()===cy;})());
   if(hasTx&&!S.billedInvoices[key]){
    const total=S.transactions.filter(t=>t.method==="Crédito"&&t.cardId===c.id&&(()=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===cm&&d.getFullYear()===cy;})()).reduce((a,b)=>a+b.amount,0);
    const pay=getInvoicePayMonth(c,cy,cm);
    pendingInvoices.push({card:c,chargeYear:cy,chargeMonth:cm,key,total,pay});
   }
  }
 });
 const pendHTML=pendingInvoices.length?`<div class="reminder" style="margin-bottom:14px"><div style="font-size:11px;font-weight:800;color:var(--gold);margin-bottom:8px;text-transform:uppercase">⚠️ Faturas aguardando confirmação</div>${pendingInvoices.map(p=>`<div class="card-in" style="margin-bottom:7px"><div class="row" style="margin-bottom:8px"><div><div style="font-size:13px;font-weight:700;color:${p.card.color}">${escH(p.card.name)} ${OWNERS.find(x=>x.id===p.card.owner)?.e||""}</div><div style="font-size:11px;color:var(--muted)">Gastos de ${MONTHS_F[p.chargeMonth]}/${p.chargeYear} · Vence em ${MONTHS_F[p.pay.month]}/${p.pay.year}</div></div><div style="font-size:18px;font-weight:900;color:var(--red)">${fmtBRL(p.total)}</div></div><div style="display:flex;gap:7px"><button onclick="openModal('editCardDates','${p.card.id}')" style="flex:1;background:var(--bg4);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;padding:8px;cursor:pointer;font-family:'Nunito',sans-serif">✏️ Datas</button><button onclick="openModal('confirmInvoice','${p.key}')" style="flex:2;background:var(--mint);border:none;border-radius:8px;color:#060D08;font-size:12px;font-weight:700;padding:8px;cursor:pointer;font-family:'Nunito',sans-serif">✅ Confirmar fatura</button></div></div>`).join("")}</div>`:""
 ;
 return pendHTML+S.cards.map(c=>{
  const ow=OWNERS.find(x=>x.id===c.owner);
  const totalCurrent=S.transactions.filter(t=>t.method==="Crédito"&&t.cardId===c.id&&(()=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===S.filterMonth&&d.getFullYear()===S.filterYear;})()).reduce((a,b)=>a+b.amount,0);
  const mk=monthKey(S.filterYear,S.filterMonth);
  const key=invoiceKey(c.id,S.filterYear,S.filterMonth);
  const inv=S.billedInvoices[key];
  const overrides=S.cardDateOverrides?.[c.id]?.[mk];
  const cd=overrides?.closeDay||c.closeDay,pd=overrides?.payDay||c.payDay;
  return`<div style="background:linear-gradient(135deg,${c.color}22,${c.color}08);border-radius:var(--r2);padding:13px;margin-bottom:12px;border-left:4px solid ${c.color};border:1px solid ${c.color}33">
   <div class="row" style="margin-bottom:8px"><div>
    <div style="font-size:15px;font-weight:800;color:${c.color}">${escH(c.name)} ${ow?.e||""}</div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:3px">
     <span style="font-size:11px;color:var(--muted)">${c.brand} · Fecha ${cd} · Vence ${pd}</span>
     <button onclick="openModal('editCardDates','${c.id}')" style="background:none;border:1px solid var(--mintbd);border-radius:5px;color:var(--mint);font-size:9px;padding:2px 6px;cursor:pointer;font-family:'Nunito',sans-serif">✏️</button>
    </div>
   </div>
   <div style="text-align:right"><div style="font-size:20px;font-weight:900;color:var(--red)">${fmtBRL(totalCurrent)}</div>
    ${inv?`<span class="badge b-mint">✅ Fatura confirmada ${fmtBRL(inv.total)}</span>`:`<button onclick="openModal('confirmInvoice','${key}')" style="background:var(--goldbg);border:1px solid var(--goldbd);border-radius:7px;color:var(--gold);font-size:10px;padding:3px 8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700">⚠️ Confirmar</button>`}
   </div></div>
   ${S.transactions.filter(t=>t.method==="Crédito"&&t.cardId===c.id&&(()=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===S.filterMonth&&d.getFullYear()===S.filterYear;})()).sort((a,b)=>b.amount-a.amount).slice(0,5).map(t=>{const g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];const isTer=t.owner==="outros";return`<div class="row" style="padding:5px 0;border-top:1px solid ${c.color}22"><div><span style="font-size:12px">${escH(t.desc)}</span>${isTer?` <span class="badge b-terceiro" style="font-size:9px">👤</span>`:""} <span style="font-size:10px;color:${g?.c||"var(--muted)"}">${escH(sub||"")}</span></div><span style="font-size:12px;font-weight:700;color:var(--red)">${fmtBRL(t.amount)}</span></div>`;}).join("")}
  </div>`;
 }).join("");
}

 const rows=S.fixedAccounts.map((fa,i)=>`<div class="card-sm"><div class="row" style="margin-bottom:8px"><span style="font-size:13px;font-weight:700">${escH(fa.desc)}</span><div style="display:flex;gap:6px"><label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer"><input type="checkbox" ${fa.active!==false?"checked":""} onchange="faToggleActive(${i},this.checked)" style="accent-color:var(--mint)"> Ativa</label><button onclick="faDelete(${i})" style="background:none;border:1px solid var(--redbd);border-radius:7px;color:var(--red);font-size:11px;padding:3px 8px;cursor:pointer;font-family:'Nunito',sans-serif">🗑</button></div></div>
  <div class="g3"><div><label class="lbl">Responsável</label><select class="input" onchange="faUpd(${i},'resp',this.value)">${OWNERS.slice(0,3).map(o=>`<option value="${o.id}" ${fa.resp===o.id?"selected":""}>${o.l}</option>`).join("")}</select></div><div><label class="lbl">Vencimento</label><input class="input" type="number" min="1" max="28" value="${fa.venc}" onchange="faUpd(${i},'venc',+this.value)"></div><div><label class="lbl">Valor R$</label><input class="input" type="number" step="0.01" value="${fa.valor||""}" placeholder="0,00" onchange="faUpd(${i},'valor',+this.value)"></div></div>
 </div>`).join("");
 return`<div class="row" style="margin-bottom:10px"><div class="sec" style="margin:0">📌 Contas Fixas</div><button onclick="faAdd()" style="background:var(--mint);border:none;border-radius:9px;color:#060D08;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;font-family:'Nunito',sans-serif">＋ Adicionar</button></div>${rows}<button onclick="saveFixedAccounts(S.fixedAccounts);toast('✓ Salvo')" style="background:var(--mint);border:none;border-radius:10px;padding:11px;width:100%;color:#060D08;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px">💾 Salvar alterações</button>`;
}
function faUpd(i,k,v){S.fixedAccounts[i][k]=v;}
function faToggleActive(i,v){S.fixedAccounts[i].active=v;}
function faDelete(i){if(confirm("Excluir esta conta fixa permanentemente?"))S.fixedAccounts.splice(i,1);renderPage();}
function faAdd(){S.fixedAccounts.push({id:gid(),desc:"Nova conta",resp:"nos",venc:10,valor:0,active:true});renderPage();}

// ── MODALS ───────────────────────────────────────────────────
let _txType="saida",_txMethod="PIX",_txCard=null,_txAcc="ac1",_txOwner="kelvin";
let _ciAcc=null,_ciKey=null;

function openModal(type,data){
 const root=document.getElementById("modalRoot");
 let html="";
 if(type==="add"){_txType="saida";_txMethod="PIX";_txCard=null;_txAcc=S.accounts[0]?.id||"ac1";_txOwner="kelvin";html=buildTxModal(null);}
 else if(type==="edit"&&data){_txType=data.txType||"saida";_txMethod=data.method||"PIX";_txCard=data.cardId||null;_txAcc=data.accountId||S.accounts[0]?.id||"ac1";_txOwner=data.owner||"kelvin";html=buildTxModal(data);}
 else if(type==="fixedLog")html=buildFixedLogModal(data);
 else if(type==="metas")html=buildMetasModal();
 else if(type==="setSaldoInicial")html=buildSaldoInicialModal();
 else if(type==="editBalance")html=buildEditBalanceModal(data);
 else if(type==="confirmInvoice")html=buildConfirmInvoiceModal(data);
 else if(type==="editCardDates")html=buildCardDatesModal(data);
 else if(type==="editGroup")html=buildEditGroupModal(data);
 else if(type==="editEstab")html=buildEditEstabModal(data);
 else if(type==="editCard")html=buildEditCardModal(data);
 else if(type==="editAccount")html=buildEditAccountModal(data);
 else if(type==="tools")html=buildToolsModal();
 else if(type==="ai")html=buildAIModal();
 else if(type==="importExcel")html=buildImportExcelModal();
 root.innerHTML=html;
}

// ── TX MODAL ─────────────────────────────────────────────────
function buildTxModal(tx){
 const isE=!!tx?.id,f=tx||{id:"",date:todayStr(),desc:"",amount:"",owner:"kelvin",category:"",method:"PIX",accountId:S.accounts[0]?.id||"",cardId:null,notes:"",installments:null,fixed:false,txType:"saida",incomeType:"",forThird:false};
 const isSaida=(_txType||"saida")==="saida";
 // Category dropdown
 const catOpts=isSaida?allGroups().flatMap(g=>(g.subs||[]).map(s=>`<option value="${escH(g.l+' > '+s)}" ${f.category===g.l+' > '+s?"selected":""}>${escH(g.l+' > '+s)}</option>`)).join(""):INCOME_TYPES.map(t=>`<option value="${escH(t)}" ${f.incomeType===t?"selected":""}>${escH(t)}</option>`).join("");
 // Account buttons
 const accBtns=()=>S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" class="acc-btn" style="background:${_txAcc===a.id?a.color+'33':'var(--bg4)'};border:2px solid ${_txAcc===a.id?a.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif;transition:.15s"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txAcc===a.id?a.color:'var(--text)'}">${escH(a.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} ${ow?.l||""}</span></span>${_txAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div></button>`;}).join("");
 const cardBtns=()=>S.cards.map(c=>{const ow=OWNERS.find(x=>x.id===c.owner);return`<button id="crd_${c.id}" onclick="txCard('${c.id}')" style="background:${_txCard===c.id?c.color+'33':'var(--bg4)'};border:2px solid ${_txCard===c.id?c.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif;transition:.15s"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txCard===c.id?c.color:'var(--text)'}">${escH(c.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} · Fecha ${c.closeDay}</span></span>${_txCard===c.id?`<span style="color:${c.color}">✓</span>`:""}</div></button>`;}).join("");
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div><div class="sh-title">${isE?"✏️ Editar":"➕ Novo"} lançamento</div></div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:13px">
   <!-- TYPE TOGGLE -->
   <div class="type-toggle">
    <button id="tt-saida" onclick="setTxType('saida')" class="type-opt ${isSaida?'saida-on':'off'}">🔴 Saída</button>
    <button id="tt-entrada" onclick="setTxType('entrada')" class="type-opt ${!isSaida?'entrada-on':'off'}">🟢 Entrada</button>
   </div>
   <!-- OWNER -->
   <div><label class="lbl">Responsável</label>
    <div class="chip-row" id="ownerChips">
     ${OWNERS.map(o=>`<button id="oc_${o.id}" onclick="txOwner('${o.id}')" class="chip" style="background:${_txOwner===o.id?o.c:'var(--bg4)'};color:${_txOwner===o.id?"#fff":"var(--muted)"};border-color:${_txOwner===o.id?o.c:"transparent"}">${o.e} ${o.l}</button>`).join("")}
    </div>
   </div>
   <!-- DATE + AMOUNT -->
   <div class="g2">
    <div><label class="lbl">Data</label><input class="input" id="txDate" type="date" value="${f.date}"></div>
    <div><label class="lbl">Valor (R$)</label><input class="input" id="txAmt" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${f.amount}"></div>
   </div>
   <!-- DESC -->
   <div><label class="lbl">Descrição</label>
    <input class="input" id="txDesc" placeholder="${isSaida?"Ex: Gasolina Shell":"Ex: Salário maio"}" value="${escH(f.desc)}" list="estabList">
    <datalist id="estabList">${S.establishments.map(e=>`<option value="${escH(e.name)}">`).join("")}</datalist>
   </div>
   <!-- CATEGORY -->
   <div id="catWrap"><label class="lbl">${isSaida?"Categoria":"Tipo de entrada"}</label>
    ${isSaida?`<select class="input" id="txCat">${catOpts}</select>`:
     `<select class="input" id="txIncomeType" onchange="checkAjuste(this.value)">${catOpts}</select>
      <div id="ajusteWarn" style="display:${(f.incomeType||"").includes("Ajuste")?"block":"none"};background:var(--goldbg);border:1px solid var(--goldbd);border-radius:8px;padding:8px 11px;margin-top:6px;font-size:11px;color:var(--gold)">⚠️ <b>Ajuste Gerencial</b> — lembre-se de classificar depois!</div>`
    }
   </div>
   <!-- PAYMENT (saida only) -->
   <div id="payWrap" style="display:${isSaida?"block":"none"}">
    <label class="lbl">Pagamento</label>
    <div class="chip-row" id="methodChips">
     ${METHODS_SAIDA.map(m=>`<button id="mc_${m}" onclick="txMethod('${m}')" class="chip" style="background:${_txMethod===m?"var(--mint)":"var(--bg4)"};color:${_txMethod===m?"#060D08":"var(--muted)"};border-color:${_txMethod===m?"var(--mint)":"transparent"}">${m}</button>`).join("")}
    </div>
    <div id="payTarget" style="margin-top:10px">
     <label class="lbl" id="ptLabel">${_txMethod==="Crédito"?"Cartão":"Conta"}</label>
     <div id="ptBtns">${_txMethod==="Crédito"?cardBtns():accBtns()}</div>
     <div id="billingInfo" style="display:none;background:var(--bg0);border-radius:8px;padding:8px 11px;margin-top:4px;border:1px solid var(--border)">
      <div style="font-size:10px;color:var(--muted)">Entra na fatura</div>
      <div id="bPeriod" style="font-size:12px;font-weight:700"></div>
      <div id="bPay" style="font-size:11px;color:var(--gold)"></div>
     </div>
    </div>
   </div>
   <!-- ENTRADA account -->
   <div id="entAccWrap" style="display:${isSaida?"none":"block"}">
    <label class="lbl">Conta de destino</label>
    <div id="entAccBtns">${accBtns()}</div>
   </div>
   <!-- INSTALLMENTS -->
   <div style="background:var(--bg4);border-radius:10px;padding:11px 12px;border:1px solid var(--border)">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700"><input type="checkbox" id="isInst" ${!!f.installments?"checked":""} onchange="toggleInst()" style="accent-color:var(--mint);width:15px;height:15px"> Compra parcelada</label>
    <div id="instWrap" style="display:${f.installments?"flex":"none"};gap:8px;margin-top:10px" class="g3">
     <div><label class="lbl">Total R$</label><input class="input" id="instTot" type="number" step="0.01" value="${f.installments?.totalValue||""}" oninput="calcInst()"></div>
     <div><label class="lbl">Parcelas</label><input class="input" id="instQty" type="number" min="2" max="72" value="${f.installments?.total||""}" oninput="calcInst()"></div>
     <div><label class="lbl">Nº Atual</label><input class="input" id="instCurr" type="number" min="1" value="${f.installments?.current||1}" oninput="calcInst()"></div>
    </div>
    <div id="instPrev" style="display:${f.installments?"block":"none"};font-size:11px;color:var(--gold);margin-top:6px"></div>
   </div>
   <div style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="txFixed" ${f.fixed?"checked":""} style="accent-color:var(--mint);width:15px;height:15px"><label for="txFixed" style="font-size:13px;cursor:pointer;font-weight:600">Marcar como gasto fixo</label></div>
   <div><label class="lbl">Observação</label><input class="input" id="txNotes" placeholder="Opcional" value="${escH(f.notes||"")}"></div>
   <div class="fbrow">
    ${isE?`<button class="btn btn-red" id="delBtn" onclick="confirmDel('${f.id}')">🗑 Excluir</button>`:""}
    <button class="btn btn-pri" onclick="submitTx('${f.id||""}')">💾 Salvar</button>
   </div>
  </div>
 </div></div>`;
}

function setTxType(type){
 _txType=type;
 const isSaida=type==="saida";
 document.getElementById("tt-saida").className="type-opt "+(isSaida?"saida-on":"off");
 document.getElementById("tt-entrada").className="type-opt "+(isSaida?"off":"entrada-on");
 // Update category
 const catWrap=document.getElementById("catWrap");
 if(catWrap){
  const catOpts=isSaida?allGroups().flatMap(g=>(g.subs||[]).map(s=>`<option value="${escH(g.l+' > '+s)}">${escH(g.l+' > '+s)}</option>`)).join(""):INCOME_TYPES.map(t=>`<option value="${escH(t)}">${escH(t)}</option>`).join("");
  catWrap.innerHTML=`<label class="lbl">${isSaida?"Categoria":"Tipo de entrada"}</label>${isSaida?`<select class="input" id="txCat">${catOpts}</select>`:`<select class="input" id="txIncomeType" onchange="checkAjuste(this.value)">${catOpts}</select><div id="ajusteWarn" style="display:none;background:var(--goldbg);border:1px solid var(--goldbd);border-radius:8px;padding:8px 11px;margin-top:6px;font-size:11px;color:var(--gold)">⚠️ <b>Ajuste Gerencial</b> — lembre-se de classificar depois!</div>`}`;
 }
 document.getElementById("payWrap").style.display=isSaida?"block":"none";
 document.getElementById("entAccWrap").style.display=isSaida?"none":"block";
 const dl=document.getElementById("txDesc");if(dl)dl.placeholder=isSaida?"Ex: Gasolina Shell":"Ex: Salário maio";
}
function txOwner(id){_txOwner=id;OWNERS.forEach(o=>{const b=document.getElementById("oc_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg4)";b.style.color=o.id===id?"#fff":"var(--muted)";b.style.borderColor=o.id===id?o.c:"transparent";}});}
function txMethod(m){
 _txMethod=m;
 METHODS_SAIDA.forEach(x=>{const b=document.getElementById("mc_"+x);if(b){b.style.background=x===m?"var(--mint)":"var(--bg4)";b.style.color=x===m?"#060D08":"var(--muted)";b.style.borderColor=x===m?"var(--mint)":"transparent";}});
 const lbl=document.getElementById("ptLabel");if(lbl)lbl.textContent=m==="Crédito"?"Cartão":"Conta";
 const wrap=document.getElementById("ptBtns");
 if(wrap){
  if(m==="Crédito"){wrap.innerHTML=S.cards.map(c=>{const ow=OWNERS.find(x=>x.id===c.owner);return`<button id="crd_${c.id}" onclick="txCard('${c.id}')" style="background:${_txCard===c.id?c.color+'33':'var(--bg4)'};border:2px solid ${_txCard===c.id?c.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txCard===c.id?c.color:'var(--text)'}">${escH(c.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} · Fecha ${c.closeDay}</span></span>${_txCard===c.id?`<span style="color:${c.color}">✓</span>`:""}</div></button>`;}).join("");}
  else{wrap.innerHTML=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" style="background:${_txAcc===a.id?a.color+'33':'var(--bg4)'};border:2px solid ${_txAcc===a.id?a.color:'transparent'};border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:'Nunito',sans-serif"><div class="row"><span style="font-size:12px;font-weight:700;color:${_txAcc===a.id?a.color:'var(--text)'}">${escH(a.name)} <span style="font-weight:400;color:var(--muted);font-size:10px">${ow?.e||""} ${ow?.l||""}</span></span>${_txAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div></button>`;}).join("");}
 }
 updateBillingInfo();
}
function txCard(id){_txCard=id;S.cards.forEach(c=>{const b=document.getElementById("crd_"+c.id);if(b){b.style.background=c.id===id?c.color+"33":"var(--bg4)";b.style.borderColor=c.id===id?c.color:"transparent";}});updateBillingInfo();}
function txAcc(id){_txAcc=id;S.accounts.forEach(a=>{const b=document.getElementById("acc_"+a.id);if(b){b.style.background=a.id===id?a.color+"33":"var(--bg4)";b.style.borderColor=a.id===id?a.color:"transparent";}});}
function updateBillingInfo(){
 const card=S.cards.find(c=>c.id===_txCard),dateEl=document.getElementById("txDate"),info=document.getElementById("billingInfo");
 if(!info)return;
 if(_txMethod==="Crédito"&&card&&dateEl?.value){
  try{const p=setBilling(card,dateEl.value);document.getElementById("bPeriod").textContent=`${fmtDate(p.start.toISOString().slice(0,10))} → ${fmtDate(p.end.toISOString().slice(0,10))}`;document.getElementById("bPay").textContent=`Vence ${fmtDate(p.payDate.toISOString().slice(0,10))}`;info.style.display="block";}catch{info.style.display="none";}
 } else info.style.display="none";
}
function checkAjuste(v){const w=document.getElementById("ajusteWarn");if(w)w.style.display=v.includes("Ajuste")?"block":"none";}
function toggleInst(){const c=document.getElementById("isInst"),w=document.getElementById("instWrap"),p=document.getElementById("instPrev");if(w)w.style.display=c?.checked?"flex":"none";if(p)p.style.display=c?.checked?"block":"none";}
function calcInst(){const tv=parseFloat(document.getElementById("instTot")?.value)||0,tq=parseInt(document.getElementById("instQty")?.value)||0,p=document.getElementById("instPrev"),ae=document.getElementById("txAmt");if(tq>0&&tv>0){const par=tv/tq;if(ae)ae.value=par.toFixed(2);if(p)p.textContent=`${tq}x de ${fmtBRL(par)} = ${fmtBRL(tv)}`;}}
function submitTx(eid){
 const date=document.getElementById("txDate")?.value||todayStr();
 const amt=parseFloat(document.getElementById("txAmt")?.value||"0");
 const desc=(document.getElementById("txDesc")?.value||"").trim();
 const notes=document.getElementById("txNotes")?.value||"";
 const fixed=document.getElementById("txFixed")?.checked||false;
 if(!desc||!amt||isNaN(amt)){toast("⚠️ Preencha descrição e valor");return;}
 const isSaida=_txType==="saida";
 const cat=isSaida?document.getElementById("txCat")?.value||"":"";
 const incomeType=!isSaida?document.getElementById("txIncomeType")?.value||"":"";
 const isInst=document.getElementById("isInst")?.checked;
 let installments=null;
 if(isInst){const tv=parseFloat(document.getElementById("instTot")?.value)||0,tq=parseInt(document.getElementById("instQty")?.value)||0,tc=parseInt(document.getElementById("instCurr")?.value)||1;if(tv>0&&tq>0)installments={totalValue:tv,total:tq,current:tc};}
 const tx={id:eid||gid(),date,desc,amount:amt,owner:_txOwner,category:cat,method:isSaida?_txMethod:"PIX",
  cardId:isSaida&&_txMethod==="Crédito"?(_txCard||null):null,
  accountId:_txAcc||null,
  notes,installments,fixed,txType:_txType,incomeType};
 saveTx(tx);closeModal();
}
function confirmDel(id){const b=document.getElementById("delBtn");if(b?.dataset.c==="1"){deleteTx(id);closeModal();}else if(b){b.textContent="⚠️ Confirmar?";b.dataset.c="1";setTimeout(()=>{if(b){b.textContent="🗑 Excluir";b.dataset.c="";}},3000);}}

// ── FIXED LOG MODAL ──────────────────────────────────────────
function buildFixedLogModal(faId){
 const fa=S.fixedAccounts.find(x=>x.id===faId);if(!fa)return"";
 const mk=monthKey(S.filterYear,S.filterMonth);
 const existing=S.fixedLogs[faId]?.[mk]||"";
 const isSkipped=S.fixedSkips?.[faId]?.[mk];
 const ow=OWNERS.find(x=>x.id===fa.resp);
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div><div class="sh-title">📌 ${escH(fa.desc)}</div><div class="sh-sub">${MONTHS_F[S.filterMonth]} ${S.filterYear} · ${ow?.e||""} ${ow?.l||""} · Vence dia ${fa.venc}</div></div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <label class="lbl">Valor de ${MONTHS_S[S.filterMonth]}</label>
  <input class="input" id="flVal" type="number" step="0.01" inputmode="decimal" placeholder="${fa.valor?fmtBRL(fa.valor):"0,00"}" value="${existing}" style="font-size:18px;margin-bottom:10px">
  <div class="fbrow" style="margin-top:4px">
   <button class="btn btn-ghost" onclick="skipFixedThisMonth('${faId}','${mk}')">${isSkipped?"↺ Reativar este mês":"⊘ Ignorar este mês"}</button>
   <button class="btn btn-pri" onclick="submitFixedLog('${faId}','${mk}')">💾 Registrar</button>
  </div>
 </div></div>`;
}
function skipFixedThisMonth(faId,mk){
 const isSkipped=S.fixedSkips?.[faId]?.[mk];
 saveFixedSkip(faId,mk,!isSkipped);
 closeModal();render();toast(isSkipped?"✓ Reativada":"⊘ Ignorada neste mês");
}
function submitFixedLog(faId,mk){
 const val=parseFloat(document.getElementById("flVal")?.value||"0");
 if(!val){toast("⚠️ Informe o valor");return;}
 saveFixedLog(faId,mk,val);
 const fa=S.fixedAccounts.find(x=>x.id===faId);
 const tx={id:gid(),date:todayStr(),desc:fa?.desc||"Conta fixa",amount:val,owner:fa?.resp||"nos",category:"🏠 Casa > "+escH(fa?.desc||""),method:"Débito",accountId:S.accounts[0]?.id||null,cardId:null,notes:"Conta fixa",installments:null,fixed:true,txType:"saida",incomeType:""};
 saveTx(tx);closeModal();toast("✓ Valor registrado");
}

// ── SALDO INICIAL ────────────────────────────────────────────
function buildSaldoInicialModal(){
 const mk=monthKey(S.filterYear,S.filterMonth);
 const curr=S.monthStartBalance?.[mk]||Object.values(S.balances).reduce((s,b)=>s+(b.value||0),0);
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div><div class="sh-title">📊 Saldo inicial</div><div class="sh-sub">${MONTHS_F[S.filterMonth]} ${S.filterYear}</div></div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Saldo total em todas as contas no início do mês.</p>

  <textarea id="aiTxt" class="input" rows="6" placeholder="Nubank Maio&#10;05/05 Gasolina R$ 220,00&#10;07/05 iFood R$ 45,90..."></textarea>
  <div id="aiErr" style="color:var(--red);font-size:12px;margin-top:5px;display:none"></div>
  <div id="aiRes" style="display:none;margin-top:10px;max-height:150px;overflow-y:auto"></div>
  <div class="fbrow">
   <button class="btn btn-pri" id="aiBtn" onclick="aiParse()">🔍 Analisar</button>
   <button class="btn btn-ghost" id="aiConfBtn" style="display:none" onclick="aiConfirm()">✅ Importar ${_aiRes?.length||0}</button>
  </div>
 </div></div>`;
}
function aiOwner(id,btn){_aiOwner=id;document.querySelectorAll("#aiTxt~* .chip,[onclick*='aiOwner'] ").forEach(()=>{});btn?.closest(".chip-row")?.querySelectorAll("button").forEach(b=>{const o=OWNERS.find(x=>b.textContent.includes(x.l));if(o){b.style.background=o.id===id?o.c:"var(--bg4)";b.style.color=o.id===id?"#fff":"var(--muted)";}});}
async function aiParse(){
 const text=document.getElementById("aiTxt")?.value||"";if(!text.trim()){toast("⚠️ Cole algum texto");return;}
 const btn=document.getElementById("aiBtn");btn.textContent="⏳ Analisando...";btn.disabled=true;
 document.getElementById("aiErr").style.display="none";
 const catList=allGroups().flatMap(g=>(g.subs||[]).map(s=>`${g.l} > ${s}`)).slice(0,60).join(", ");
 try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:`Extraia lançamentos financeiros. Responda APENAS com JSON válido sem markdown. Formato: {"transactions":[{"date":"YYYY-MM-DD","desc":"descrição curta","amount":0.00,"category":"categoria exata da lista"}]}. Categorias disponíveis: ${catList}. Se data não clara use ${todayStr()}. Amount positivo.`,messages:[{role:"user",content:text}]})});
  const data=await res.json();
  const raw=data.content?.find(b=>b.type==="text")?.text||"";
  _aiRes=JSON.parse(raw.replace(/```json|```/g,"").trim()).transactions||[];
  const resDiv=document.getElementById("aiRes");resDiv.style.display="block";
  resDiv.innerHTML=`<div style="font-size:11px;color:var(--mint);margin-bottom:5px">✓ ${_aiRes.length} lançamento(s) encontrado(s):</div>`+_aiRes.map(t=>`<div class="row" style="padding:4px 0;border-bottom:1px solid var(--border);font-size:11px"><span>${escH(t.desc)} <span style="color:var(--muted)">${escH((t.category||"").split(" > ")[1]||"")}</span></span><span style="color:var(--red);font-weight:700">${fmtBRL(t.amount)}</span></div>`).join("");
  const cb=document.getElementById("aiConfBtn");if(cb){cb.style.display="flex";cb.textContent=`✅ Importar ${_aiRes.length}`;}
 }catch(e){const err=document.getElementById("aiErr");err.style.display="block";err.textContent="Não consegui interpretar. Tente colar um texto mais estruturado.";}
 btn.textContent="🔍 Analisar";btn.disabled=false;
}
function aiConfirm(){if(!_aiRes)return;_aiRes.forEach(t=>saveTx({...t,id:gid(),owner:_aiOwner,cardId:null,accountId:S.accounts[0]?.id||null,notes:"Importado via IA",installments:null,fixed:false,txType:"saida",incomeType:""}));closeModal();toast(`✓ ${_aiRes.length} lançamentos importados`);}

// ── EXCEL EXPORT ──────────────────────────────────────────────
function exportExcel(){
 if(typeof XLSX==="undefined"){toast("⚠️ Aguarde o carregamento");return;}
 const wb=XLSX.utils.book_new();
 const headers=["Data","Descrição","Tipo","Responsável","Categoria","Método","Conta/Cartão","Valor (R$)","Parcela","Total Parc.","Tipo Entrada","Fixo?","Obs"];
 const rows=S.transactions.map(t=>{const o=OWNERS.find(x=>x.id===t.owner),card=t.cardId?S.cards.find(c=>c.id===t.cardId):null,acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;return[t.date,t.desc,t.txType==="entrada"?"Entrada":"Saída",o?.l||t.owner,t.category||t.incomeType||"",t.method,card?card.name:acc?acc.name:"",t.amount,t.installments?.current||"",t.installments?.total||"",t.incomeType||"",t.fixed?"Sim":"Não",t.notes||""];});
 const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
 ws["!cols"]=headers.map((_,i)=>({wch:[12,30,8,10,35,10,18,12,8,10,20,6,25][i]||12}));
 XLSX.utils.book_append_sheet(wb,ws,"📋 Lançamentos");
 XLSX.writeFile(wb,`Financas_KK_${S.filterYear}-${String(S.filterMonth+1).padStart(2,"0")}.xlsx`);
 toast("✓ Excel exportado!");
}

// ── IMPORT EXCEL ──────────────────────────────────────────────
function buildImportExcelModal(){
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="sh-hdr"><div class="sh-title">⬆️ Importar Excel</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:13px">Selecione um arquivo Excel com lançamentos.</p>
  <input type="file" id="xlFile" accept=".xlsx,.xls" style="display:none" onchange="processXL(this)">
  <button class="btn btn-pri" onclick="document.getElementById('xlFile').click()" style="width:100%;padding:11px;margin-bottom:10px">📂 Selecionar arquivo</button>
  <div id="xlStatus" style="font-size:12px;color:var(--muted);text-align:center"></div>
 </div></div>`;
}
function processXL(input){
 const file=input.files[0];if(!file)return;
 document.getElementById("xlStatus").textContent="Lendo arquivo...";
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
   const sheetName=wb.SheetNames.find(n=>n.includes("Importar")||n.includes("Lançamentos"))||wb.SheetNames[0];
   const ws=wb.Sheets[sheetName];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
   let hIdx=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes("data")));
   if(hIdx<0)hIdx=0;
   const dataRows=rows.slice(hIdx+1).filter(r=>r[0]&&r[1]);
   let imported=0;
   dataRows.forEach(r=>{
    const date=normalizeDate(String(r[0]||"").trim());
    const desc=String(r[1]||"").trim();
    const amt=parseFloat(String(r[7]||r[3]||"0").replace(",","."))||0;
    if(!date||!desc||!amt)return;
    const ownerLabel=String(r[3]||"").trim();
    const ownerId=OWNERS.find(o=>o.l.toLowerCase()===ownerLabel.toLowerCase())?.id||"outros";
    saveTx({id:gid(),date,desc,amount:amt,owner:ownerId,category:String(r[4]||"").trim(),method:String(r[5]||"PIX").trim(),cardId:null,accountId:S.accounts[0]?.id||null,notes:String(r[12]||"").trim(),installments:null,fixed:String(r[11]||"").toLowerCase()==="sim",txType:String(r[2]||"saida").toLowerCase().includes("entrada")?"entrada":"saida",incomeType:String(r[10]||"").trim()});
    imported++;
   });
   document.getElementById("xlStatus").textContent=`✓ ${imported} lançamento(s) importado(s)`;
   setTimeout(()=>{closeModal();toast(`✓ ${imported} importados`);},1500);
  }catch(err){document.getElementById("xlStatus").textContent="❌ Erro ao ler o arquivo.";}
 };
 reader.readAsArrayBuffer(file);
}
function normalizeDate(d){
 if(!d)return todayStr();
 if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)){const[dd,mm,yyyy]=d.split("/");return`${yyyy}-${mm}-${dd}`;}
 try{const dt=new Date(d);if(!isNaN(dt))return dt.toISOString().slice(0,10);}catch{}
 return todayStr();
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded",()=>{
 renderMonthNav();
 initFB();
 setTimeout(()=>{if(!S.loaded){S.loaded=true;syncDot("local","modo local");render();}},6000);
});
if(document.readyState!=="loading"){renderMonthNav();}
</script>
