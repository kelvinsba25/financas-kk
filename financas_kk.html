<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080F0B;--bg2:#0D1810;--bg3:#111F15;--bg4:#162A1A;--bg5:#1C3322;
  --border:#1E3526;--text:#E8F5ED;--muted:#6B8F73;--faint:#1C3020;
  --accent:#4ECCA3;--accent2:#2EBD8A;--mint:#A8FFDB;--white:#F0FAF5;
  --blue:#4B8EF8;--pink:#F07DB0;--purple:#A87EF8;--green:#4ECCA3;
  --gold:#F5C842;--red:#F06060;--cyan:#3DDBD8;--orange:#F0883C;
  --hfont:'Nunito',sans-serif;--bfont:'Plus Jakarta Sans',sans-serif;
  --radius:14px;--sheet-radius:24px 24px 0 0;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--bfont);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;overflow:hidden}

/* Desktop expands */
@media(min-width:640px){
  #app{max-width:100%;flex-direction:row}
  #sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;padding:24px 12px;border-right:1px solid var(--border);overflow-y:auto}
  #main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  #bottom-nav{display:none}
  #desktop-header{display:flex}
  #mobile-header{display:none}
  .scroll{padding:0 20px 40px}
}
@media(max-width:639px){
  #sidebar{display:none}
  #desktop-header{display:none}
  #mobile-header{display:flex}
}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── SIDEBAR (desktop) ── */
#sidebar{background:var(--bg2)}
.sb-logo{font-family:var(--hfont);font-size:20px;font-weight:800;padding:8px 10px 20px;letter-spacing:-0.5px}
.sb-logo span{color:var(--accent)}
.sb-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.sb-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;color:var(--muted);font-size:13px;font-family:var(--bfont);cursor:pointer;width:100%;text-align:left;transition:all .15s}
.sb-btn:hover{background:var(--bg3);color:var(--text)}
.sb-btn.active{background:var(--bg4);color:var(--accent);font-weight:600}
.sb-btn .ico{font-size:16px;width:20px;text-align:center}
.sb-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 4px;font-weight:700}
.sb-divider{height:1px;background:var(--border);margin:10px 0}
.sb-action{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.sb-action-btn{padding:9px 12px;border-radius:10px;border:none;cursor:pointer;font-family:var(--bfont);font-size:12px;font-weight:600;text-align:left;transition:all .15s}

/* ── MOBILE HEADER ── */
#mobile-header{justify-content:space-between;align-items:center;padding:16px 14px 8px;flex-shrink:0}
.mh-title{font-family:var(--hfont);font-size:21px;font-weight:800;letter-spacing:-0.5px}
.mh-sub{font-size:11px;color:var(--muted);margin-bottom:2px}
.hdr-btns{display:flex;gap:5px}
.icon-btn{width:34px;height:34px;border:none;border-radius:9px;background:var(--bg3);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.icon-btn.pri{background:var(--accent);color:#080F0B;font-size:19px}
.icon-btn:active{opacity:.7}

/* ── DESKTOP HEADER ── */
#desktop-header{justify-content:space-between;align-items:center;padding:20px 20px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.dh-left h1{font-family:var(--hfont);font-size:24px;font-weight:800;letter-spacing:-0.5px}
.dh-left p{font-size:12px;color:var(--muted)}
.dh-btns{display:flex;gap:8px}
.dh-btn{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-family:var(--bfont);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .15s}

/* ── PILLS ── */
.pills{display:flex;gap:5px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;flex-shrink:0}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 13px;border-radius:20px;border:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:12px;font-family:var(--bfont);font-weight:500;background:var(--bg3);color:var(--muted);transition:all .15s}
.pill.active{color:#080F0B;font-weight:700}

/* ── TABS (mobile) ── */
.tabs{display:flex;padding:0 14px 10px;gap:4px;flex-shrink:0}
.tab{flex:1;padding:7px 4px;border-radius:9px;border:none;cursor:pointer;font-size:11px;font-family:var(--bfont);font-weight:500;background:var(--bg3);color:var(--muted);transition:all .15s}
.tab.active{background:var(--bg4);color:var(--accent);font-weight:700;border:1px solid rgba(78,204,163,.3)}

/* ── BOTTOM NAV (mobile) ── */
#bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding:6px 0 env(safe-area-inset-bottom)}
.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;font-family:var(--bfont);transition:all .15s}
.bn-btn.active{color:var(--accent)}
.bn-ico{font-size:18px}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;padding:0 14px 20px}

/* ── CARDS ── */
.card{background:var(--bg2);border-radius:var(--radius);padding:15px;margin-bottom:9px;border:1px solid var(--border)}
.card-sm{background:var(--bg3);border-radius:11px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--border)}
.sec-title{font-size:10px;font-weight:800;color:var(--accent2);margin:15px 0 7px;text-transform:uppercase;letter-spacing:1.2px}
.row{display:flex;justify-content:space-between;align-items:center}

/* ── FORMS ── */
.input{background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;font-size:14px;width:100%;font-family:var(--bfont);outline:none;transition:border .15s}
.input:focus{border-color:rgba(78,204,163,.5);box-shadow:0 0 0 3px rgba(78,204,163,.08)}
.input option{background:var(--bg2)}
.label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea.input{resize:vertical;min-height:80px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:11px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;flex:1;font-family:var(--bfont);transition:opacity .15s}
.btn:active{opacity:.7}
.btn-pri{background:var(--accent);color:#080F0B}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--muted)}
.btn-green{background:var(--accent2);color:#fff}
.btn-gold{background:var(--gold);color:#07090F}
.fbrow{display:flex;gap:8px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.sheet{background:var(--bg2);border-radius:var(--sheet-radius);padding:22px;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto}
@media(min-width:640px){.overlay{align-items:center}.sheet{max-width:560px;border-radius:18px;max-height:88dvh}}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stitle{font-family:var(--hfont);font-size:17px;font-weight:800;letter-spacing:-0.3px}
.xbtn{width:29px;height:29px;border:none;border-radius:7px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* ── CHIPS ── */
.o-chip{padding:6px 13px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;font-family:var(--bfont);transition:all .15s}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.m-chip{padding:5px 11px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-family:var(--bfont);transition:all .15s;background:var(--bg3);color:var(--muted)}

/* ── PROGRESS ── */
.pbar{height:5px;background:var(--faint);border-radius:3px;overflow:hidden;margin:4px 0}
.pbar-fill{height:5px;border-radius:3px;transition:width .5s}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.install-badge{background:rgba(240,168,48,.15);color:var(--gold);border:1px solid rgba(240,168,48,.3)}
.fixed-badge{background:rgba(78,204,163,.15);color:var(--accent);border:1px solid rgba(78,204,163,.3)}
.pending-badge{background:rgba(245,100,80,.15);color:var(--red);border:1px solid rgba(245,100,80,.3)}

/* ── SYNC ── */
#sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;transition:background .3s}
#sync-dot.ok,#sync-dot-sb.ok,#sync-dot-m.ok{background:var(--accent)}
#sync-dot.syncing{background:var(--gold);animation:blink .8s infinite}
#sync-dot.err{background:var(--red)}
#sync-dot.local{background:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TOAST ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg5);color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:640px){#toast{bottom:30px}}

/* ── REMINDER CARD ── */
.reminder-card{background:rgba(78,204,163,.06);border:1px solid rgba(78,204,163,.25);border-radius:11px;padding:11px 13px;margin-bottom:7px}

/* ── EMPTY STATE ── */
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty-ico{font-size:48px;margin-bottom:12px}
</style>
</head>

// ── UTILS ────────────────────────────────────────────────────
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fmtBRL(v){return(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fmtDate(d){return d instanceof Date?d.toLocaleDateString("pt-BR"):new Date(d+"T00:00:00").toLocaleDateString("pt-BR")}
function pct(a,b){return b>0?Math.min(100,(a/b)*100):0}
function allGroups(){return[...GROUPS,...S.customGroups]}
function getGroup(cat){if(!cat)return null;const[l]=cat.split(" > ");return allGroups().find(g=>g.l===l)||null}
function getWeek(ds){const d=new Date(ds+"T00:00:00"),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()-day+(day===0?-6:1));return m.toISOString().slice(0,10)}
function wkLabel(w){const d=new Date(w+"T00:00:00"),e=new Date(d);e.setDate(d.getDate()+6);return`${d.getDate()}/${d.getMonth()+1}–${e.getDate()}/${e.getMonth()+1}`}
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function setBilling(card,ds){
 const d=new Date(ds+"T00:00:00"),y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),cd=card.closeDay;
 let ps,pe;
 if(day<=cd){const pm=m===0?11:m-1,py=m===0?y-1:y;ps=new Date(py,pm,cd+1);pe=new Date(y,m,cd);}
 else{ps=new Date(y,m,cd+1);const nm=m===11?0:m+1,ny=m===11?y+1:y;pe=new Date(ny,nm,cd);}
 const payM=pe.getMonth()===11?0:pe.getMonth()+1,payY=pe.getMonth()===11?pe.getFullYear()+1:pe.getFullYear();
 return{start:ps,end:pe,payDate:new Date(payY,payM,card.payDay)};
}
function pKey(s,e){return s.toISOString().slice(0,10)+"__"+e.toISOString().slice(0,10)}
function monthKey(y,m){return`${y}-${String(m+1).padStart(2,"0")}`}
function syncDot(st,lbl){
 ["sync-dot","sync-dot-sb","sync-dot-m"].forEach(id=>{const el=document.getElementById(id);if(el){el.className="";el.classList.add(st);}});
 ["sync-lbl","sync-lbl-sb","sync-lbl-m"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=lbl;});
}

// ── FIREBASE ────────────────────────────────────────────────
let DB=null;
function initFB(){
 try{
  if(FB.apiKey==="COLE_API_KEY"){syncDot("local","modo local");S.loaded=true;render();return;}
  const app=firebase.initializeApp(FB);
  DB=firebase.database(app);
  syncDot("syncing","conectando...");
  DB.ref("kk").on("value",snap=>{
   const d=snap.val();
   if(d){
    if(d.transactions) S.transactions=Object.values(d.transactions);
    if(d.cards) S.cards=Object.values(d.cards);
    if(d.accounts) S.accounts=Object.values(d.accounts);
    if(d.goals) S.goals=d.goals;
    if(d.fixedAccounts) S.fixedAccounts=Object.values(d.fixedAccounts);
    if(d.fixedLogs) S.fixedLogs=d.fixedLogs;
    if(d.balances) S.balances=d.balances;
    if(d.customGroups) S.customGroups=Object.values(d.customGroups);
   } else {
    DB.ref("kk").set({
     transactions:Object.fromEntries(SAMPLE_TX.map(t=>[t.id,t])),
     cards:Object.fromEntries(DEFAULT_CARDS.map(c=>[c.id,c])),
     accounts:Object.fromEntries(DEFAULT_ACCOUNTS.map(a=>[a.id,a])),
     fixedAccounts:Object.fromEntries(FIXED_ACCOUNTS.map(f=>[f.id,f])),
     fixedLogs:{},balances:{},goals:S.goals,customGroups:{}
    });
   }
   S.loaded=true;syncDot("ok","sincronizado");render();
  },()=>{syncDot("err","erro Firebase");S.loaded=true;render();});
 }catch(e){syncDot("err","erro");S.loaded=true;render();}
}
function fbSet(path,data){if(!DB)return;syncDot("syncing","salvando...");DB.ref("kk/"+path).set(data).then(()=>syncDot("ok","sincronizado")).catch(()=>syncDot("err","erro"));}
function fbDel(path){if(DB)DB.ref("kk/"+path).remove();}

function saveTx(tx){S.transactions=S.transactions.find(t=>t.id===tx.id)?S.transactions.map(t=>t.id===tx.id?tx:t):[...S.transactions,tx];fbSet("transactions/"+tx.id,tx);render();toast("✓ Salvo")}
function deleteTx(id){S.transactions=S.transactions.filter(t=>t.id!==id);fbDel("transactions/"+id);render();toast("🗑 Removido")}
function saveCards(c){S.cards=c;fbSet("cards",Object.fromEntries(c.map(x=>[x.id,x])));render()}
function saveGoals(g){S.goals=g;fbSet("goals",g);render()}
function saveFixedAccounts(fa){S.fixedAccounts=fa;fbSet("fixedAccounts",Object.fromEntries(fa.map(f=>[f.id,f])));render()}
function saveFixedLog(faId,key,val){if(!S.fixedLogs[faId])S.fixedLogs[faId]={};S.fixedLogs[faId][key]=val;fbSet(`fixedLogs/${faId}/${key}`,val);}
function saveBalance(acId,val,date){S.balances[acId]={value:val,date};fbSet(`balances/${acId}`,{value:val,date});}
function saveCustomGroup(g){S.customGroups=[...S.customGroups.filter(x=>x.id!==g.id),g];fbSet("customGroups/"+g.id,g);render();}

// ── FILTERED HELPERS ────────────────────────────────────────
function mTx(){return S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===S.filterMonth&&d.getFullYear()===S.filterYear})}
function fTx(){const m=mTx();return S.filterOwner==="all"?m:m.filter(t=>t.owner===S.filterOwner)}

 // Goals
 const goalsHTML=GROUPS.filter(g=>S.goals[g.id]>0).map(g=>{

 const weeksHTML=Object.keys(byWeek).sort((a,b)=>b.localeCompare(a)).map(w=>{

 }).join("");

 const empty=!Object.keys(byWeek).length?`<div class="empty"><div class="empty-ico">📭</div><p>Nenhum lançamento este mês</p></div>`:"";
 return`

function renderGroups(){

  const spent=items.reduce((a,b)=>a+b.amount,0);if(!spent)return"";
  const goal=S.goals[g.id]||0;
  const bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1];bySub[s]=(bySub[s]||0)+t.amount});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`
   <div class="row" style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)">

   </div>`).join("");
  const topItems=items.sort((a,b)=>b.amount-a.amount).slice(0,3).map(t=>{
   const o=OWNERS.find(x=>x.id===t.owner);
   return`<div class="row" style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer" onclick="editTx('${t.id}')">

     <span style="font-size:10px;color:${o?.c}">${o?.e||""}</span>
     <span style="font-size:12px;font-weight:600">${fmtBRL(t.amount)}</span>
     <span style="font-size:11px;color:var(--muted)">›</span>
    </div>
   </div>`;}).join("");
  const pbar=goal>0?`<div class="pbar"><div class="pbar-fill" style="width:${pct(spent,goal)}%;background:${pct(spent,goal)>=100?"var(--red)":g.c}"></div></div>
   <div class="row" style="margin-top:3px"><span style="font-size:10px;color:var(--muted)">${pct(spent,goal).toFixed(0)}% da meta</span>
   <span style="font-size:10px;color:${spent>goal?"var(--red)":"var(--green)"}">${spent>goal?"+"+fmtBRL(spent-goal)+" acima":"Restam "+fmtBRL(goal-spent)}</span></div>`:"";
  return`<div style="background:var(--bg2);border-radius:14px;margin-bottom:11px;overflow:hidden">
   <div style="padding:13px 15px;border-left:4px solid ${g.c}">
    <div class="row" style="margin-bottom:5px"><span style="font-weight:700;font-size:14px;color:${g.c}">${g.l}</span>
     <div><span style="font-weight:800;font-size:16px">${fmtBRL(spent)}</span>${goal>0?`<span style="font-size:11px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}</div></div>${pbar}
   </div>
   <div style="padding:9px 15px 13px;background:var(--bg3)">

// ── BILLS PAGE ───────────────────────────────────────────────
function renderBillsPage(){
 if(!S.cards.length)return`<div class="empty"><div class="empty-ico">💳</div><p>Nenhum cartão cadastrado</p></div>`;
 return S.cards.map(c=>{
  const today=new Date();
  const cp=setBilling(c,todayStr()),cpKey=pKey(cp.start,cp.end);
  const cardTx=S.transactions.filter(t=>t.method==="Crédito"&&t.cardId===c.id);
  const periodsMap={};
  cardTx.forEach(t=>{const p=setBilling(c,t.date),key=pKey(p.start,p.end);if(!periodsMap[key])periodsMap[key]={...p,items:[]};periodsMap[key].items.push(t)});
  if(!periodsMap[cpKey])periodsMap[cpKey]={...cp,items:[]};
  const periods=Object.values(periodsMap).sort((a,b)=>b.start-a.start);
  const ow=OWNERS.find(x=>x.id===c.owner);
  const totalCurrent=periodsMap[cpKey]?.items.reduce((a,b)=>a+b.amount,0)||0;
  return`<div style="background:linear-gradient(135deg,${c.color}33,${c.color}11);border-radius:14px;padding:14px;margin-bottom:14px;border-left:4px solid ${c.color}">
   <div class="row" style="margin-bottom:10px">
    <div><div style="font-size:15px;font-weight:800;color:${c.color}">${escH(c.name)}</div>
     <div style="font-size:11px;color:var(--muted)">${c.brand} · ${ow?.e||""} ${ow?.l||""} · Fecha dia ${c.closeDay} · Vence dia ${c.payDay}</div></div>
    <div style="font-size:20px;font-weight:800;color:var(--red)">${fmtBRL(totalCurrent)}</div>
   </div>
   ${periods.map((p,idx)=>{
    const key=pKey(p.start,p.end),tot=p.items.reduce((a,b)=>a+b.amount,0);
    const isCurr=p.start<=today&&p.end>=today,isPast=p.end<today;
    const sc=isPast?"var(--muted)":isCurr?"var(--green)":"var(--gold)";
    const status=isPast?"Encerrada":isCurr?"Em aberto":"Futura";
    const bId="bp_"+c.id+"_"+idx;
    const oSplit=OWNERS.map(o=>{const v=p.items.filter(t=>t.owner===o.id).reduce((a,b)=>a+b.amount,0);return v?`<span style="font-size:11px;background:${o.c}22;color:${o.c};padding:2px 8px;border-radius:20px">${o.e} ${fmtBRL(v)}</span>`:""}).join("");
    const itemRows=p.items.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
     const o=OWNERS.find(x=>x.id===t.owner),g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];
     const ib=t.installments?`<span class="badge install-badge" style="font-size:9px">${t.installments.current}/${t.installments.total}x</span>`:"";
     return`<div class="row" style="padding:6px 0;border-top:1px solid rgba(255,255,255,.05)">
      <div style="flex:1"><div style="display:flex;gap:5px;align-items:center"><span style="font-size:12px">${escH(t.desc)}</span>${ib}</div>
       <div style="display:flex;gap:5px;margin-top:2px">${g?`<span style="font-size:10px;color:${g.c}">${escH(sub||"")}</span>`:""}<span style="font-size:10px;color:var(--muted)">${fmtDate(t.date)}</span></div></div>
      <div style="text-align:right"><div style="font-size:12px;font-weight:700;color:var(--red)">${fmtBRL(t.amount)}</div><div style="font-size:10px;color:${o?.c}">${o?.e||""}</div></div>
     </div>`;}).join("");
    return`<div style="background:var(--bg3);border-radius:11px;margin-bottom:7px;overflow:hidden">
     <div onclick="toggleEl('${bId}')" style="padding:12px 14px;cursor:pointer">
      <div class="row"><div>
       <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
        <span style="font-size:12px;font-weight:700">${fmtDate(p.start)} → ${fmtDate(p.end)}</span>
        <span style="font-size:10px;background:${sc}22;color:${sc};padding:1px 7px;border-radius:20px">${status}</span>
       </div><span style="font-size:11px;color:var(--muted)">Vence ${fmtDate(p.payDate)}</span>
      </div>
      <div style="text-align:right"><div style="font-size:17px;font-weight:800;color:${tot>0?"var(--red)":"var(--green)"}">${fmtBRL(tot)}</div>
       <div style="font-size:10px;color:var(--muted)">${p.items.length} lanç. ▼</div></div></div>
     </div>
     <div id="${bId}" style="display:${idx===0?"block":"none"};border-top:1px solid var(--border)">
      ${oSplit?`<div style="display:flex;gap:6px;padding:8px 14px;background:var(--bg);flex-wrap:wrap">${oSplit}</div>`:""}
      <div style="padding:7px 14px 13px">${itemRows||`<p style="font-size:12px;color:var(--muted)">Nenhum lançamento.</p>`}</div>
     </div>
    </div>`;}).join("")}
  </div>`;}).join("");
}

// ── TX MODAL ────────────────────────────────────────────────
let _tO="kelvin",_tM="PIX",_tCrd=null,_tAcc="ac1";

function openModal(type,data){
 const root=document.getElementById("modalRoot");
 if(type==="add"){_tO="kelvin";_tM="PIX";_tCrd=null;_tAcc="ac1";}
 else if(type==="edit"&&data){_tO=data.owner||"kelvin";_tM=data.method||"PIX";_tCrd=data.cardId||null;_tAcc=data.accountId||"ac1";}
 let html="";
 if(type==="add"||type==="edit")html=buildTxModal(type==="edit"?data:null);
 else if(type==="bills")html=buildBillsModal();
 else if(type==="cardsMgr")html=buildCardsMgrModal();
 else if(type==="goals")html=buildGoalsModal();
 else if(type==="closing")html=buildClosingModal();
 else if(type==="ai")html=buildAIModal();
 else if(type==="fixedLog")html=buildFixedLogModal(data);
 else if(type==="editFixed")html=buildEditFixedModal();
 else if(type==="newGroup")html=buildNewGroupModal();
 else if(type==="editBalance")html=buildEditBalanceModal(data);
 else if(type==="importExcel")html=buildImportExcelModal();
 root.innerHTML=html;
 setTimeout(()=>{const d=document.getElementById("txDate");if(d){d.addEventListener("change",updateBillingInfo);updateBillingInfo();}},50);
}

function buildTxModal(tx){
 const isE=!!tx?.id;
 const f=tx||{id:"",date:todayStr(),desc:"",amount:"",owner:"kelvin",category:"🍽️ Alimentação > Mercado",method:"PIX",accountId:"ac1",cardId:null,notes:"",installments:null,fixed:false};
 const oChips=OWNERS.map(o=>`<button class="o-chip" id="oc_${o.id}" style="background:${f.owner===o.id?o.c:"var(--bg3)"};color:#fff;border-color:${f.owner===o.id?o.c:"transparent"}" onclick="txOwner('${o.id}')">${o.e} ${o.l}</button>`).join("");
 const mChips=METHODS.map(m=>`<button class="m-chip" id="mc_${m}" style="background:${f.method===m?"var(--bg4)":"var(--bg3)"};color:${f.method===m?"var(--blue)":"var(--muted)"};border-color:${f.method===m?"var(--blue)":"transparent"}" onclick="txMethod('${m}')">${m}</button>`).join("");

 const catDisp=g?`<span style="color:${g.c}">${escH(g.l)}</span> <span style="color:var(--muted)">› ${escH(sub||"")}</span>`:`<span style="color:var(--muted)">Selecionar...</span>`;

  <div class="row"><div><span style="font-size:13px;font-weight:700;color:${f.cardId===c.id?c.color:"var(--text)"}">${escH(c.name)}</span> <span style="font-size:10px;color:var(--muted)">${c.brand} · ${OWNERS.find(x=>x.id===c.owner)?.e||""} fecha dia ${c.closeDay}</span></div>${f.cardId===c.id?`<span style="color:${c.color}">✓</span>`:""}</div>
 </button>`).join("");
 const accBtns=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" style="background:${f.accountId===a.id?a.color+"33":"var(--bg3)"};border:2px solid ${f.accountId===a.id?a.color:"transparent"};border-radius:11px;padding:9px 13px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:var(--bfont)">
  <div class="row"><div><span style="font-size:13px;font-weight:700;color:${f.accountId===a.id?a.color:"var(--text)"}">${escH(a.name)}</span> <span style="font-size:10px;color:var(--muted)">${ow?.e||""} ${ow?.l||""}</span></div>${f.accountId===a.id?`<span style="color:${a.color}">✓</span>`:""}</div>
 </button>`}).join("");
 const instOn=!!f.installments;
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="shdr"><div class="stitle">${isE?"✏️ Editar":"➕ Novo"} lançamento</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:13px">
   <div><label class="label">Responsável</label><div class="chip-row">${oChips}</div></div>

   <div><label class="label">Categoria</label>

     <span id="catDisplay">${catDisp}</span><span style="color:var(--muted)">▾</span></button>
    <input type="hidden" id="txCat" value="${escH(f.category)}">
   </div>
   <div><label class="label">Pagamento</label><div class="chip-row">${mChips}</div></div>
   <div id="payTarget">

    <div id="billingInfo" style="display:none;background:var(--bg);border-radius:9px;padding:9px 12px;margin-top:4px">
     <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Entra na fatura</div>
     <div id="bPeriod" style="font-size:13px;font-weight:600"></div>
     <div id="bPay" style="font-size:11px;color:var(--gold);margin-top:2px"></div>
    </div>
   </div>
   <div style="background:var(--bg3);border-radius:11px;padding:11px 13px">
    <label style="display:flex;align-items:center;gap:9px;cursor:pointer">
     <input type="checkbox" id="isInst" ${instOn?"checked":""} onchange="toggleInst()" style="width:15px;height:15px;cursor:pointer">

function txOwner(id){_tO=id;OWNERS.forEach(o=>{const b=document.getElementById("oc_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg3)";b.style.borderColor=o.id===id?o.c:"transparent";}})}
function txMethod(m){
 _tM=m;
 METHODS.forEach(x=>{const b=document.getElementById("mc_"+x);if(b){b.style.background=x===m?"var(--bg4)":"var(--bg3)";b.style.color=x===m?"var(--blue)":"var(--muted)";b.style.borderColor=x===m?"var(--blue)":"transparent";}});
 const lbl=document.getElementById("ptLabel"),wrap=document.getElementById("ptBtns");
 if(lbl)lbl.textContent=m==="Crédito"?"Cartão":"Conta";
 if(wrap){
  if(m==="Crédito"){wrap.innerHTML=S.cards.map(c=>`<button id="crd_${c.id}" onclick="txCard('${c.id}')" style="background:${_tCrd===c.id?c.color+"33":"var(--bg3)"};border:2px solid ${_tCrd===c.id?c.color:"transparent"};border-radius:11px;padding:9px 13px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:var(--bfont)">
   <div class="row"><div><span style="font-size:13px;font-weight:700;color:${_tCrd===c.id?c.color:"var(--text)"}">${escH(c.name)}</span> <span style="font-size:10px;color:var(--muted)">${c.brand} · fecha dia ${c.closeDay}</span></div>${_tCrd===c.id?`<span style="color:${c.color}">✓</span>`:""}</div>
  </button>`).join("");}
  else{wrap.innerHTML=S.accounts.map(a=>{const ow=OWNERS.find(x=>x.id===a.owner);return`<button id="acc_${a.id}" onclick="txAcc('${a.id}')" style="background:${_tAcc===a.id?a.color+"33":"var(--bg3)"};border:2px solid ${_tAcc===a.id?a.color:"transparent"};border-radius:11px;padding:9px 13px;cursor:pointer;text-align:left;color:var(--text);width:100%;margin-bottom:5px;font-family:var(--bfont)">
   <div class="row"><div><span style="font-size:13px;font-weight:700;color:${_tAcc===a.id?a.color:"var(--text)"}">${escH(a.name)}</span> <span style="font-size:10px;color:var(--muted)">${ow?.e||""} ${ow?.l||""}</span></div>${_tAcc===a.id?`<span style="color:${a.color}">✓</span>`:""}</div>
  </button>`}).join("");}
 }
 updateBillingInfo();
}
function txCard(id){_tCrd=id;S.cards.forEach(c=>{const b=document.getElementById("crd_"+c.id);if(b){b.style.background=c.id===id?c.color+"33":"var(--bg3)";b.style.borderColor=c.id===id?c.color:"transparent";}});updateBillingInfo();}
function txAcc(id){_tAcc=id;S.accounts.forEach(a=>{const b=document.getElementById("acc_"+a.id);if(b){b.style.background=a.id===id?a.color+"33":"var(--bg3)";b.style.borderColor=a.id===id?a.color:"transparent";}});}
function updateBillingInfo(){
 const card=S.cards.find(c=>c.id===_tCrd);
 const dateEl=document.getElementById("txDate"),info=document.getElementById("billingInfo");

function buildClosingModal(){

 const oGrid=OWNERS.map(o=>{const v=mt.filter(t=>t.owner===o.id).reduce((a,b)=>a+b.amount,0);return`<div style="background:${o.c}1A;border-radius:10px;padding:10px;border-left:3px solid ${o.c}"><div style="font-size:11px;color:var(--muted)">${o.e} ${o.l}</div><div style="font-size:15px;font-weight:700;color:${o.c}">${fmtBRL(v)}</div><div style="font-size:10px;color:var(--muted)">${total>0?((v/total)*100).toFixed(1):0}%</div></div>`;}).join("");
 const byGrp=allGroups().map(g=>{
  const items=mt.filter(t=>getGroup(t.category)?.id===g.id),spent=items.reduce((a,b)=>a+b.amount,0);if(!spent)return"";
  const goal=S.goals[g.id]||0,bySub={};items.forEach(t=>{const s=(t.category||"").split(" > ")[1];bySub[s]=(bySub[s]||0)+t.amount;});
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="row" style="padding:4px 0;border-top:1px solid rgba(255,255,255,.05)"><span style="font-size:11px;color:var(--muted)">↳ ${escH(s)}</span><div><span style="font-size:11px;font-weight:600">${fmtBRL(v)}</span><span style="font-size:10px;color:var(--muted);margin-left:4px">(${spent>0?((v/spent)*100).toFixed(0):0}%)</span></div></div>`).join("");
  const pbar=goal>0?`<div class="pbar"><div class="pbar-fill" style="width:${pct(spent,goal)}%;background:${pct(spent,goal)>=100?"var(--red)":g.c}"></div></div><div class="row" style="margin-top:3px"><span style="font-size:10px;color:var(--muted)">${pct(spent,goal).toFixed(0)}% da meta</span><span style="font-size:10px;color:${spent>goal?"var(--red)":"var(--green)"}">${spent>goal?"▲ +"+fmtBRL(spent-goal)+" acima":"✓ −"+fmtBRL(goal-spent)}</span></div>`:"";
  return`<div style="background:var(--bg3);border-radius:11px;padding:13px;margin-bottom:9px"><div class="row" style="margin-bottom:5px"><span style="font-weight:700;color:${g.c}">${g.l}</span><div><span style="font-weight:800;font-size:15px">${fmtBRL(spent)}</span>${goal>0?`<span style="font-size:10px;color:var(--muted)"> / ${fmtBRL(goal)}</span>`:""}</div></div>${pbar}<div style="margin-top:8px">${subRows}</div></div>`;
 }).join("");
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="shdr"><div class="stitle">📅 Fechamento ${MONTHS_F[S.filterMonth]}/${S.filterYear}</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div style="background:linear-gradient(135deg,#0D2A1A,#0A1F12);border-radius:13px;padding:15px;margin-bottom:13px;border:1px solid rgba(78,204,163,.2)">
   <div style="font-size:11px;color:var(--mint);opacity:.8;margin-bottom:2px">${mt.length} lançamentos</div>
   <div style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:9px">${fmtBRL(total)}</div>
   <div style="display:flex;gap:14px">${byM}</div>
  </div>
  <div class="sec-title">Por responsável</div><div class="grid2" style="margin-bottom:13px">${oGrid}</div>
  <div class="sec-title">Por grupo</div>${byGrp}
 </div></div>`;
}

   <div id="ecPreview" style="background:linear-gradient(135deg,${c.color}cc,${c.color}44);border-radius:13px;padding:14px 18px">
    <div style="font-size:14px;font-weight:800;margin-bottom:5px">${c.name||"Nome do cartão"}</div>
    <div style="font-size:11px;color:rgba(255,255,255,.7)">Fecha dia ${c.closeDay} · Vence dia ${c.payDay}</div>
   </div>
   <div class="fbrow">
    ${!isNew?`<button class="btn btn-danger" onclick="ecDelete('${c.id}')">🗑 Remover</button>`:""}
    <button class="btn btn-pri" onclick="ecSave()">💾 Salvar</button>
   </div>
  </div>
 </div></div>`;
}
function ecOwner(id){_ec.owner=id;OWNERS.forEach(o=>{const b=document.getElementById("eco_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg3)";b.style.borderColor=o.id===id?o.c:"transparent";}})}
function ecCol(c){_ec.color=c;CC.forEach(x=>{const b=document.getElementById("ecc_"+x.slice(1));if(b)b.style.borderColor=x===c?"#fff":"transparent";});const p=document.getElementById("ecPreview");if(p)p.style.background=`linear-gradient(135deg,${c}cc,${c}44)`;}
function ecSave(){
 _ec.name=document.getElementById("ecName")?.value||"";_ec.brand=document.getElementById("ecBrand")?.value||"Mastercard";
 _ec.closeDay=+document.getElementById("ecClose")?.value||5;_ec.payDay=+document.getElementById("ecPay")?.value||15;
 if(!_ec.name.trim()){toast("⚠️ Informe o nome");return;}
 saveCards(S.cards.find(x=>x.id===_ec.id)?S.cards.map(x=>x.id===_ec.id?_ec:x):[...S.cards,_ec]);
 openModal("cardsMgr");toast("✓ Cartão salvo");
}
function ecDelete(id){if(confirm("Remover cartão?")){saveCards(S.cards.filter(c=>c.id!==id));openModal("cardsMgr");toast("🗑 Removido")}}

// ── AI MODAL ─────────────────────────────────────────────────
let _aiOwner="kelvin",_aiCard=null,_aiRes=null;
function buildAIModal(){
 const oChips=OWNERS.map(o=>`<button class="o-chip" id="aio_${o.id}" style="background:${o.id==="kelvin"?o.c:"var(--bg3)"};color:#fff;border-color:${o.id==="kelvin"?o.c:"transparent"}" onclick="aiOwner('${o.id}')">${o.e} ${o.l}</button>`).join("");
 const cBtns=`<button onclick="aiCard(null)" id="aic_none" style="padding:5px 11px;border-radius:20px;font-size:11px;border:2px solid var(--muted);background:var(--bg3);color:var(--muted);cursor:pointer;font-family:var(--bfont)">Nenhum</button>`+
  S.cards.map(c=>`<button onclick="aiCard('${c.id}')" id="aic_${c.id}" style="padding:5px 11px;border-radius:20px;font-size:11px;border:2px solid transparent;background:var(--bg3);color:var(--muted);cursor:pointer;font-family:var(--bfont)">${escH(c.name)} ${OWNERS.find(x=>x.id===c.owner)?.e||""}</button>`).join("");
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="shdr"><div class="stitle">✨ Importar com IA</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:12px;color:var(--muted);margin-bottom:11px">Cole o texto da fatura, extrato ou descreva os gastos.</p>
  <div style="margin-bottom:11px"><label class="label">Responsável</label><div class="chip-row">${oChips}</div></div>
  <div style="margin-bottom:11px"><label class="label">Cartão (se crédito)</label><div class="chip-row">${cBtns}</div></div>
  <textarea id="aiTxt" class="input" rows="6" placeholder="Nubank Março&#10;05/03 Gasolina R$ 220,00&#10;07/03 iFood R$ 45,90..."></textarea>
  <div id="aiErr" style="color:var(--red);font-size:12px;margin-top:5px;display:none"></div>
  <div id="aiRes" style="display:none;margin-top:11px;max-height:160px;overflow-y:auto"></div>
  <div class="fbrow" style="margin-top:13px">
   <button class="btn btn-pri" id="aiBtn" onclick="aiParse()">🔍 Analisar</button>
   <button class="btn btn-green" id="aiConfBtn" style="display:none" onclick="aiConfirm()">✓ Confirmar</button>
  </div>
 </div></div>`;
}
function aiOwner(id){_aiOwner=id;OWNERS.forEach(o=>{const b=document.getElementById("aio_"+o.id);if(b){b.style.background=o.id===id?o.c:"var(--bg3)";b.style.borderColor=o.id===id?o.c:"transparent";}})}
function aiCard(id){_aiCard=id;[null,...S.cards.map(c=>c.id)].forEach(cid=>{const b=document.getElementById("aic_"+(cid||"none"));if(b){b.style.borderColor=cid===id?"var(--muted)":"transparent";b.style.color=cid===id?"var(--text)":"var(--muted)";}});}
async function aiParse(){
 const text=document.getElementById("aiTxt")?.value||"";if(!text.trim())return;
 const btn=document.getElementById("aiBtn");btn.textContent="Analisando...";btn.disabled=true;
 document.getElementById("aiErr").style.display="none";
 const catList=allGroups().flatMap(g=>(g.subs||[]).map(s=>`${g.l} > ${s}`)).join(", ");
 try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,
    system:`Extraia lançamentos financeiros. APENAS JSON sem markdown. Formato: {"transactions":[{"date":"YYYY-MM-DD","desc":"descrição curta","amount":0.00,"category":"categoria exata","method":"Crédito|Débito|PIX|Dinheiro|TED"}]}. Categorias disponíveis: ${catList}. Se data não clara use ${todayStr()}. Amount positivo em reais.`,
    messages:[{role:"user",content:text}]})});
  const data=await res.json();
  const raw=data.content?.find(b=>b.type==="text")?.text||"";
  const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
  _aiRes=parsed.transactions||[];
  const resDiv=document.getElementById("aiRes");resDiv.style.display="block";
  resDiv.innerHTML=`<div style="font-size:12px;color:var(--green);margin-bottom:5px">✓ ${_aiRes.length} lançamento(s):</div>`+
   _aiRes.map(t=>{const g=getGroup(t.category);return`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px"><span>${escH(t.desc)} <span style="font-size:10px;color:${g?.c||"var(--muted)"}">${escH(t.category?.split(" > ")[1]||"")}</span></span><span style="color:var(--green);font-weight:700">${fmtBRL(t.amount)}</span></div>`;}).join("");
  document.getElementById("aiConfBtn").style.display="block";
 }catch(e){const err=document.getElementById("aiErr");err.style.display="block";err.textContent="Não consegui interpretar. Tente colar melhor o texto.";}
 btn.textContent="🔍 Analisar";btn.disabled=false;
}
function aiConfirm(){
 if(!_aiRes)return;
 _aiRes.forEach(t=>saveTx({...t,id:gid(),owner:_aiOwner,cardId:t.method==="Crédito"?_aiCard:null,accountId:t.method!=="Crédito"?"ac1":null,notes:"Importado via IA",installments:null,fixed:false}));
 closeModal();toast(`✓ ${_aiRes.length} lançamentos importados`);
}

// ── EXCEL EXPORT ─────────────────────────────────────────────
function exportExcel(){
 if(typeof XLSX==="undefined"){toast("⚠️ Aguarde o carregamento do SheetJS");return;}
 const wb=XLSX.utils.book_new();
 const headers=["Data","Descrição","Responsável","Grupo","Subcategoria","Categoria Completa","Método","Conta/Cartão","Valor (R$)","Parcela Atual","Total Parcelas","Valor Total Parc.","Fixo?","Observação"];
 const rows=S.transactions.map(t=>{
  const g=getGroup(t.category),sub=(t.category||"").split(" > ")[1];
  const card=t.cardId?S.cards.find(c=>c.id===t.cardId):null;
  const acc=t.accountId?S.accounts.find(a=>a.id===t.accountId):null;
  const owLabel=OWNERS.find(o=>o.id===t.owner)?.l||t.owner;
  return[
   t.date,t.desc,owLabel,g?.l||"",sub||"",t.category||"",t.method,
   card?card.name:acc?`${acc.name} (${OWNERS.find(o=>o.id===acc.owner)?.l||""})` :"",
   t.amount,
   t.installments?.current||"",t.installments?.total||"",t.installments?.totalValue||"",
   t.fixed?"Sim":"Não",t.notes||""
  ];
 });
 const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
 ws["!cols"]=headers.map((_,i)=>({wch:[12,32,12,22,22,42,10,22,12,12,14,16,8,28][i]||14}));
 XLSX.utils.book_append_sheet(wb,ws,"📋 Lançamentos");
 // Summary sheet
 const today=new Date(),m=today.getMonth(),y=today.getFullYear();
 const mTxNow=S.transactions.filter(t=>{const d=new Date(t.date+"T00:00:00");return d.getMonth()===m&&d.getFullYear()===y});
 const sumHeaders=["Grupo","Gasto Mês Atual (R$)","Meta (R$)","% da Meta"];
 const sumRows=allGroups().map(g=>{
  const spent=mTxNow.filter(t=>getGroup(t.category)?.id===g.id).reduce((a,b)=>a+b.amount,0);
  const goal=S.goals[g.id]||0;
  return[g.l,spent,goal,goal>0?Math.round((spent/goal)*100)+"%":"—"];
 });
 const ws2=XLSX.utils.aoa_to_sheet([sumHeaders,...sumRows]);
 XLSX.utils.book_append_sheet(wb,ws2,"📊 Resumo Mês");
 // Fixed accounts sheet
 const mk=monthKey(y,m);
 const faHeaders=["Conta","Responsável","Vencimento","Valor Fixo","Mês Atual","Status"];
 const faRows=S.fixedAccounts.map(fa=>{
  const ow=OWNERS.find(x=>x.id===fa.resp)?.l||fa.resp;
  const log=S.fixedLogs[fa.id]?.[mk];
  return[fa.desc,ow,fa.venc,fa.valor,log||"—",log?"✓ Lançado":"⚠️ Pendente"];
 });
 const ws3=XLSX.utils.aoa_to_sheet([faHeaders,...faRows]);
 XLSX.utils.book_append_sheet(wb,ws3,"📌 Contas Fixas");
 XLSX.writeFile(wb,`Financas_KK_${y}-${String(m+1).padStart(2,"0")}.xlsx`);
 toast("✓ Excel exportado com sucesso!");
}

// ── EXCEL IMPORT ─────────────────────────────────────────────
function buildImportExcelModal(){
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">
  <div class="shdr"><div class="stitle">⬆️ Importar Excel</div><button class="xbtn" onclick="closeModal()">✕</button></div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Selecione o arquivo Excel exportado por este app ou preenchido na aba <b style="color:var(--text)">⬆️ Importar</b> do template.</p>
  <input type="file" id="xlFile" accept=".xlsx,.xls" style="display:none" onchange="processXL(this)">
  <button class="btn btn-pri" onclick="document.getElementById('xlFile').click()" style="width:100%;margin-bottom:10px">📂 Selecionar arquivo Excel</button>
  <div id="xlStatus" style="font-size:12px;color:var(--muted);text-align:center"></div>
 </div></div>`;
}
function processXL(input){
 const file=input.files[0];if(!file)return;
 document.getElementById("xlStatus").textContent="Lendo arquivo...";
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
   // try "⬆️ Importar" first, then "📋 Lançamentos"
   let sheetName=wb.SheetNames.find(n=>n.includes("Importar")||n.includes("Lançamentos"));
   if(!sheetName){document.getElementById("xlStatus").textContent="❌ Aba de lançamentos não encontrada.";return;}
   const ws=wb.Sheets[sheetName];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
   // find header row
   let hIdx=rows.findIndex(r=>r.some(c=>String(c).includes("Data")));
   if(hIdx<0)hIdx=0;
   const dataRows=rows.slice(hIdx+1).filter(r=>r[0]&&r[1]);
   let imported=0;
   dataRows.forEach(r=>{
    const date=String(r[0]||"").trim();
    const desc=String(r[1]||"").trim();
    const ownerLabel=String(r[2]||"").trim();
    const cat=String(r[5]||r[3]||"").trim();
    const method=String(r[6]||"PIX").trim();
    const amount=parseFloat(String(r[8]||"0").replace(",","."))||0;
    const instCurr=parseInt(r[9])||null;
    const instTot=parseInt(r[10])||null;
    const instTotal=parseFloat(String(r[11]||"0").replace(",","."))||null;
    const fixed=String(r[12]||"").toLowerCase()==="sim";
    const notes=String(r[13]||"").trim();
    if(!date||!desc||!amount)return;
    const ownerId=OWNERS.find(o=>o.l.toLowerCase()===ownerLabel.toLowerCase())?.id||"outros";
    const installments=(instCurr&&instTot)?{current:instCurr,total:instTot,totalValue:instTotal||amount*instTot}:null;
    const tx={id:gid(),date:normalizeDate(date),desc,owner:ownerId,category:cat,method,
     cardId:null,accountId:"ac1",notes,installments,fixed,amount};
    saveTx(tx);imported++;
   });
   document.getElementById("xlStatus").textContent=`✓ ${imported} lançamento(s) importado(s)`;
   setTimeout(()=>{closeModal();toast(`✓ ${imported} lançamentos importados`);},1500);
  }catch(err){document.getElementById("xlStatus").textContent="❌ Erro ao ler o arquivo. Verifique o formato.";}
 };
 reader.readAsArrayBuffer(file);
}
function normalizeDate(d){
 if(!d)return todayStr();
 const s=String(d).trim();
 if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[dd,mm,yyyy]=s.split("/");return`${yyyy}-${mm}-${dd}`;}
 if(/^\d{2}\/\d{2}\/\d{2}$/.test(s)){const[dd,mm,yy]=s.split("/");return`20${yy}-${mm}-${dd}`;}
 try{const dt=new Date(s);if(!isNaN(dt))return dt.toISOString().slice(0,10);}catch{}
 return todayStr();
}
